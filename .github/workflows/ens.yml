name: Ensemble at the spots
run-name: Ensemble at the spots (ECMWF ENS)

# The ensemble's wind at the catalog spots (ens_points.py; the owner, 18.10.2026: the Kite row and
# banner, the Wind list's week of kite chances, the chart's range): ECMWF's 50 members from its open
# data, each 00 and 12 UTC run once all its steps are out (checked every hour).
on:
  # Started by helper-trigger (tools/helper-trigger in the app's repo), which leaves it out while the home runner
  # makes it live (24.10.2026, group 3 to the Tower: GitHub's own cron here published beside the Tower's).
  workflow_dispatch:
    inputs:
      force:
        description: "Read the newest run again even if published"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ens
  cancel-in-progress: false

jobs:
  ens:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python version (for the package cache)
        id: python
        run: echo "version=$(python3 -c 'import sys; print(sys.version.split()[0])')" >> "$GITHUB_OUTPUT"

      - name: Restore the installed packages
        id: venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: regional-venv-${{ runner.os }}-py${{ steps.python.outputs.version }}-eccodes-numpy-pillow-scipy-v1

      - name: Install ecCodes, NumPy, Pillow and SciPy
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet eccodes numpy pillow scipy

      - name: Read the ensemble at the spots
        env:
          INGEST_TOKEN: ${{ secrets.ADMIN_INGEST_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            .venv/bin/python ens_points.py --force
          else
            .venv/bin/python ens_points.py
          fi
