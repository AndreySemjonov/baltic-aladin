name: Weather mix tiles
run-name: Weather mix tiles (Europe and the world)

# The weather mix (weather_mix.py; the owner, 18.10.2026: the weather as advanced as the wind): every
# model's air (moved to our terrain's height), rain and cloud blended by place; Europe's at zoom 6 for
# the regional models' days, the world's to 15 days. Checked every hour; made again when its models
# have new runs, at most every 3 hours.
on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Make it again even if its models' runs are published"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mix:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        part: [europe, world]
    concurrency:
      group: weather-mix-${{ matrix.part }}
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python version (for the package cache)
        id: python
        run: echo "version=$(python3 -c 'import sys; print(sys.version.split()[0])')" >> "$GITHUB_OUTPUT"

      - name: Restore the installed packages
        id: venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: weather-mix-venv-${{ runner.os }}-py${{ steps.python.outputs.version }}-eccodes-numpy-pillow-scipy-omfiles-pyproj-v1

      - name: Install ecCodes, NumPy, Pillow, SciPy, omfiles and pyproj
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet eccodes numpy pillow scipy omfiles pyproj

      - name: Make and upload the ${{ matrix.part }} weather mix
        env:
          INGEST_TOKEN: ${{ secrets.ADMIN_INGEST_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            .venv/bin/python weather_mix.py ${{ matrix.part }} --force
          else
            .venv/bin/python weather_mix.py ${{ matrix.part }}
          fi
