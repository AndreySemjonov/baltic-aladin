name: SWAN ICESat-2 depths
run-name: SWAN ICESat-2 depths (${{ inputs.only }})

# NASA's ICESat-2 near-shore depths (ATL24) over SWAN areas (swan/icesat.py), to check and anchor the satellite survey
# (the owner, 22.11.2026: "I would go with B and C", then "put secrets"). The login is the owner's NASA Earthdata
# account (secrets EARTHDATA_USERNAME / EARTHDATA_PASSWORD). By hand only; the points come back as an artifact.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "areas (comma-separated)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  icesat:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The laser's seabed points
        env:
          ONLY: ${{ inputs.only }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          pip install -q numpy pillow earthaccess h5py
          mkdir -p out
          for a in ${ONLY//,/ }; do python3 swan/icesat.py "$a" --out out || echo "$a failed"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: icesat
          path: out/
          retention-days: 30
