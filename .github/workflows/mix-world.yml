name: World mix tiles
run-name: World mix tiles (the mix everywhere, to 14 days)

# The world mix (mix_world.py; the owner, 18.10.2026: the mix all the way to 14 days, a mix of its
# own in each region): ICON-EU, ECMWF, GFS, ICON and GDPS blended by place, after the world tiles
# are checked each hour; made again when its models have new runs, at most every 5 hours.
on:
  workflow_run:
    workflows: ["World weather tiles"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Make it again even if its models' runs are published"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mix-world
  cancel-in-progress: false

jobs:
  mix-world:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python version (for the package cache)
        id: python
        run: echo "version=$(python3 -c 'import sys; print(sys.version.split()[0])')" >> "$GITHUB_OUTPUT"

      - name: Restore the installed packages
        id: venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: regional-venv-${{ runner.os }}-py${{ steps.python.outputs.version }}-eccodes-numpy-pillow-scipy-v1

      - name: Install ecCodes, NumPy, Pillow and SciPy
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet eccodes numpy pillow scipy

      - name: Make and upload the world mix
        env:
          INGEST_TOKEN: ${{ secrets.ADMIN_INGEST_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            .venv/bin/python mix_world.py --force
          else
            .venv/bin/python mix_world.py
          fi

      - name: Make and upload the taps' series
        env:
          INGEST_TOKEN: ${{ secrets.ADMIN_INGEST_TOKEN }}
        # The files station-history reads a tapped place's hours from (series_tiles.py: not on its
        # cron, beside the stations' collector); skipped when this run's are made.
        run: .venv/bin/python series_tiles.py mix-world
