name: Regional weather tiles
run-name: Regional tiles (MET Nordic wind, air and rain)

# The regional models over their whole area as map tiles (regional_tiles.py; the owner,
# 12.10.2026: the detailed maps beyond the Baltic's box): every 3 hours the newest MET Nordic run,
# made into packs of tiles and uploaded through our service (station-history), as the world tiles.
# The wind and the air and rain side by side, each on its own runner (the owner, 12.10.2026: one
# after the other took 75 minutes), and beside them the models alone at their full areas
# (docs/TILES_PLAN.md phase 2): MET Nordic at 1 km, FMI's HARMONIE, ČHMÚ's ALADIN.
on:
  schedule:
    - cron: "25 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Make the newest run again even if published"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: regional
  cancel-in-progress: false

jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        set: [wind, weather, harm-fi, aladin]
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python version (for the package cache)
        id: python
        run: echo "version=$(python3 -c 'import sys; print(sys.version.split()[0])')" >> "$GITHUB_OUTPUT"

      - name: Restore the installed packages
        id: venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: regional-venv-${{ runner.os }}-py${{ steps.python.outputs.version }}-eccodes-numpy-pillow-scipy-v1

      - name: Install ecCodes, NumPy, Pillow and SciPy
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet eccodes numpy pillow scipy

      # The wind (2 km, with each model alone too), the air and the rain (3 km), or a model alone.
      - name: Make and upload the ${{ matrix.set }} tiles
        env:
          INGEST_TOKEN: ${{ secrets.ADMIN_INGEST_TOKEN }}
          KNMI_API_KEY: ${{ secrets.KNMI_API_KEY }}
          FORCE: ${{ inputs.force }}
        run: |
          case "${{ matrix.set }}" in
            metnordic-1km) script="metnordic_tiles.py" ;;
            metnordic-1km-wx) script="metnordic_tiles.py --set weather" ;;
            harm-fi) script="harmfi_tiles.py" ;;
            aladin) script="aladin_tiles.py" ;;
            *) script="regional_tiles.py --set ${{ matrix.set }}" ;;
          esac
          if [ "$FORCE" = "true" ]; then
            .venv/bin/python $script --force
          else
            .venv/bin/python $script
          fi
