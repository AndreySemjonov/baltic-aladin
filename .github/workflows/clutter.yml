name: Radar clutter
run-name: Radar false echoes (the last 24 hours)

# The radar's false echoes (radar_clutter.py; the owner, 14.10.2026: a spot in Masuria rained all
# day and night): every 6 hours, the spots of our radar tiles that show rain in nearly every image
# while the land round them doesn't, published as tiles/radar/clutter.json; station-history clears
# them in the radar's tiles and the rain alerts.
on:
  schedule:
    - cron: "10 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clutter
  cancel-in-progress: false

jobs:
  clutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python version (for the package cache)
        id: python
        run: echo "version=$(python3 -c 'import sys; print(sys.version.split()[0])')" >> "$GITHUB_OUTPUT"

      - name: Restore the installed packages
        id: venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: regional-venv-${{ runner.os }}-py${{ steps.python.outputs.version }}-eccodes-numpy-pillow-scipy-v1

      - name: Install ecCodes, NumPy, Pillow and SciPy
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet eccodes numpy pillow scipy

      - name: Find and publish the false echoes
        env:
          INGEST_TOKEN: ${{ secrets.ADMIN_INGEST_TOKEN }}
        run: .venv/bin/python radar_clutter.py
