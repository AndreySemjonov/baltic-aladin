name: Update ALADIN spots and wind maps
run-name: ALADIN spots and wind maps

on:
  schedule:
    # ČHMÚ publishes an ALADIN run about 4 hours after 00/06/12/18 UTC; MET Nordic every
    # hour, HARMONIE every 3, ICON-EU and GFS every 6, ECMWF every 12. Every 15 minutes, off
    # the full hour: GitHub skips many scheduled runs when busy (an hourly schedule ran only
    # about 4 times a day, an ALADIN run late by hours), and a run with nothing new stops
    # after the check.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "ALADIN run to read, e.g. 2026093006 (empty: newest, only if new)"
        required: false
        default: ""
      map:
        description: "Rebuild both maps now"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aladin
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install ecCodes, NumPy, Pillow, h5py and SciPy
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet eccodes numpy pillow h5py scipy

      - name: Read the newest ALADIN run
        id: aladin
        env:
          RUN: ${{ inputs.run }}
          # The GRIB files stay for the ALADIN map.
          ALADIN_KEEP: aladin-files
        run: |
          .venv/bin/python extract.py $RUN
          if git diff --quiet docs/aladin.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # NEMO-EST (Estonian sea model): water level and temperature at the spots, twice a day.
      - name: Read the newest NEMO run
        id: nemo
        run: |
          .venv/bin/python nemo.py || echo "NEMO unavailable this time"
          if git diff --quiet --exit-code docs/nemo.json 2>/dev/null && git ls-files --error-unmatch docs/nemo.json >/dev/null 2>&1; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # The Estonian coastal gauges' last 48 hours, from their pages, once an hour.
      - name: Read the Estonian gauges
        id: gauges
        run: |
          .venv/bin/python ee_gauges.py || echo "Estonian gauges unavailable this time"
          if git diff --quiet --exit-code docs/ee-gauges.json 2>/dev/null && git ls-files --error-unmatch docs/ee-gauges.json >/dev/null 2>&1; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # Pages replaces the whole site on each deploy, so every deploy carries all of it:
      # MET Nordic, HARM-FI and HARM-DK are rebuilt each time (new runs every 1-3 hours);
      # ALADIN, ICON-EU, ECMWF and GFS only for a new run, otherwise their published frames
      # are copied over. The blend is mixed from whatever maps the site then holds.
      - name: What is due?
        id: due
        env:
          FORCE: ${{ inputs.map }}
          NEW_ALADIN: ${{ steps.aladin.outputs.changed }}
          NEW_NEMO: ${{ steps.nemo.outputs.changed }}
          NEW_GAUGES: ${{ steps.gauges.outputs.changed }}
        run: |
          nordic=$(python3 - <<'PY'
          import json, time
          from datetime import datetime
          try:
              built = json.load(open("docs/map-state.json"))["built"]
              age = time.time() - datetime.strptime(built, "%Y-%m-%dT%H:%MZ").timestamp()
          except Exception:
              age = 1e9
          print("true" if age >= 3 * 3600 - 600 else "false")
          PY
          )
          rebuild=""
          for pair in icon-eu:iconeu_map.py ecmwf:ecmwf_map.py gfs:gfs_map.py; do
            name=${pair%%:*}; script=${pair##*:}
            newest=$(.venv/bin/python $script --check || echo "")
            published=$(python3 -c "import json; print(json.load(open('docs/runs.json')).get('$name', ''))" 2>/dev/null || echo "")
            echo "$name: newest $newest, published $published"
            if [ -n "$newest" ] && { [ "$newest" != "$published" ] || [ "$FORCE" = "true" ]; }; then rebuild="$rebuild $name"; fi
          done
          deploy=false
          if [ "$nordic" = "true" ] || [ -n "$rebuild" ] || [ "$NEW_ALADIN" = "true" ] || [ "$NEW_NEMO" = "true" ] || [ "$NEW_GAUGES" = "true" ] || [ "$FORCE" = "true" ]; then deploy=true; fi
          echo "MET Nordic due: $nordic; new runs:$rebuild; deploy: $deploy"
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Build the site
        if: steps.due.outputs.deploy == 'true'
        env:
          REBUILD: ${{ steps.due.outputs.rebuild }}
          NEW_ALADIN: ${{ steps.aladin.outputs.changed }}
          FORCE: ${{ inputs.map }}
        run: |
          # MET Norway's server sometimes drops the connection: keep the last map then.
          .venv/bin/python metnordic_map.py site/map || .venv/bin/python carry.py site/map map || echo "MET Nordic map unavailable this time"
          # A busy source keeps its last published map rather than failing the deploy.
          .venv/bin/python harmonie_map.py site/harmonie || .venv/bin/python carry.py site/harmonie harmonie || echo "HARM-FI map unavailable this time"
          .venv/bin/python dmi_map.py site/harm-dk || .venv/bin/python carry.py site/harm-dk harm-dk || echo "HARM-DK map unavailable this time"
          if [ "$NEW_ALADIN" = "true" ] && [ -f aladin-files/run.txt ]; then
            .venv/bin/python aladin_map.py site/aladin aladin-files
          elif [ "$FORCE" = "true" ] || ! .venv/bin/python carry.py site/aladin aladin; then
            .venv/bin/python aladin_map.py site/aladin || echo "ALADIN map unavailable this time"
          fi
          for pair in icon-eu:iconeu_map.py ecmwf:ecmwf_map.py gfs:gfs_map.py; do
            name=${pair%%:*}; script=${pair##*:}
            case " $REBUILD " in
              *" $name "*) .venv/bin/python $script site/$name || .venv/bin/python carry.py site/$name $name || echo "$name map unavailable this time" ;;
              *) .venv/bin/python carry.py site/$name $name || .venv/bin/python $script site/$name || echo "$name map unavailable this time" ;;
            esac
          done
          .venv/bin/python blend_map.py site || echo "Blend unavailable this time"
          cp docs/aladin.json docs/index.html site/
          if [ -f docs/nemo.json ]; then cp docs/nemo.json site/; fi
          # The coast points (about 1 MB, not in git): this run's, else the live ones.
          if [ -f nemo-coast.json ]; then cp nemo-coast.json site/; else curl -sf -o site/nemo-coast.json https://andreysemjonov.github.io/baltic-aladin/nemo-coast.json || echo "No NEMO coast points yet"; fi
          if [ -f docs/ee-gauges.json ]; then cp docs/ee-gauges.json site/; fi
          python3 - <<'PY'
          import json, os, time
          now = time.strftime("%Y-%m-%dT%H:%MZ", time.gmtime())
          if os.path.exists("site/map/map.json"):
              m = json.load(open("site/map/map.json"))
              json.dump({"built": now, "run": m["run"], "frames": len(m["frames"])}, open("docs/map-state.json", "w"))
          runs = {}
          for name in ("icon-eu", "ecmwf", "gfs"):
              path = f"site/{name}/map.json"
              if os.path.exists(path):
                  run = json.load(open(path))["run"]
                  runs[name] = run[:4] + run[5:7] + run[8:10] + run[11:13]
          json.dump(runs, open("docs/runs.json", "w"), indent=1, sort_keys=True)
          PY

      - name: Commit the small status files
        if: steps.due.outputs.deploy == 'true'
        run: |
          git rm -q --ignore-unmatch docs/icon-state.json
          git add docs/aladin.json docs/map-state.json docs/runs.json
          if [ -f docs/nemo.json ]; then git add docs/nemo.json; fi
          if [ -f docs/ee-gauges.json ]; then git add docs/ee-gauges.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ALADIN $(python3 -c 'import json;print(json.load(open("docs/aladin.json"))["run"])'), MET Nordic $(python3 -c 'import json;print(json.load(open("docs/map-state.json"))["run"])'), runs $(python3 -c 'import json;print(json.load(open("docs/runs.json")))')"
          git push

      - name: Upload the site
        if: steps.due.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish on GitHub Pages
        if: steps.due.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
