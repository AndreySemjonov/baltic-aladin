name: Update ALADIN spots and wind maps
run-name: ALADIN spots and wind maps

on:
  schedule:
    # ČHMÚ publishes an ALADIN run about 4 hours after 00/06/12/18 UTC; MET Nordic every
    # hour, ICON-EU every 6 hours (00/06/12/18 UTC, about 4 hours later). Hourly checks are cheap.
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "ALADIN run to read, e.g. 2026093006 (empty: newest, only if new)"
        required: false
        default: ""
      map:
        description: "Rebuild both maps now"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aladin
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install ecCodes, NumPy and Pillow
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet eccodes numpy pillow

      - name: Read the newest ALADIN run
        id: aladin
        env:
          RUN: ${{ inputs.run }}
        run: |
          .venv/bin/python extract.py $RUN
          if git diff --quiet docs/aladin.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # Pages replaces the whole site on each deploy, so every deploy carries all of it:
      # MET Nordic is rebuilt each time (small, and it has a new run every hour); ICON-EU
      # only for a new run, otherwise its published frames are copied over.
      - name: What is due?
        id: due
        env:
          FORCE: ${{ inputs.map }}
          NEW_ALADIN: ${{ steps.aladin.outputs.changed }}
        run: |
          nordic=$(python3 - <<'PY'
          import json, time
          from datetime import datetime
          try:
              built = json.load(open("docs/map-state.json"))["built"]
              age = time.time() - datetime.strptime(built, "%Y-%m-%dT%H:%MZ").timestamp()
          except Exception:
              age = 1e9
          print("true" if age >= 3 * 3600 - 600 else "false")
          PY
          )
          icon_run=$(.venv/bin/python iconeu_map.py --check || echo "")
          icon_state=$(python3 -c 'import json;print(json.load(open("docs/icon-state.json"))["id"])' 2>/dev/null || echo "")
          icon=false
          if [ -n "$icon_run" ] && { [ "$icon_run" != "$icon_state" ] || [ "$FORCE" = "true" ]; }; then icon=true; fi
          deploy=false
          if [ "$nordic" = "true" ] || [ "$icon" = "true" ] || [ "$NEW_ALADIN" = "true" ] || [ "$FORCE" = "true" ]; then deploy=true; fi
          echo "MET Nordic due: $nordic; ICON-EU newest $icon_run, published $icon_state, due: $icon; deploy: $deploy"
          echo "icon=$icon" >> "$GITHUB_OUTPUT"
          echo "icon_run=$icon_run" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Build the site
        if: steps.due.outputs.deploy == 'true'
        env:
          ICON: ${{ steps.due.outputs.icon }}
          ICON_RUN: ${{ steps.due.outputs.icon_run }}
        run: |
          .venv/bin/python metnordic_map.py site/map
          if [ "$ICON" = "true" ] || ! .venv/bin/python carry.py site/icon-eu icon-eu; then
            .venv/bin/python iconeu_map.py site/icon-eu $ICON_RUN
          fi
          cp docs/aladin.json docs/index.html site/
          python3 - <<'PY'
          import json, time
          now = time.strftime("%Y-%m-%dT%H:%MZ", time.gmtime())
          m = json.load(open("site/map/map.json"))
          json.dump({"built": now, "run": m["run"], "frames": len(m["frames"])}, open("docs/map-state.json", "w"))
          i = json.load(open("site/icon-eu/map.json"))
          run_id = i["run"][:4] + i["run"][5:7] + i["run"][8:10] + i["run"][11:13]
          json.dump({"id": run_id, "run": i["run"], "updated": i["updated"], "frames": len(i["frames"])},
                    open("docs/icon-state.json", "w"))
          PY

      - name: Commit the small status files
        if: steps.due.outputs.deploy == 'true'
        run: |
          git add docs/aladin.json docs/map-state.json docs/icon-state.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ALADIN $(python3 -c 'import json;print(json.load(open("docs/aladin.json"))["run"])'), MET Nordic $(python3 -c 'import json;print(json.load(open("docs/map-state.json"))["run"])'), ICON-EU $(python3 -c 'import json;print(json.load(open("docs/icon-state.json"))["run"])')"
          git push

      - name: Upload the site
        if: steps.due.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish on GitHub Pages
        if: steps.due.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
