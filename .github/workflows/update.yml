name: Update ALADIN spots and wind maps
run-name: ALADIN spots and wind maps

on:
  schedule:
    # ČHMÚ publishes an ALADIN run about 4 hours after 00/06/12/18 UTC; MET Nordic every
    # hour, HARMONIE every 3, ICON-EU and GFS every 6, ECMWF every 12. Every 15 minutes, off
    # the full hour: GitHub skips many scheduled runs when busy (an hourly schedule ran only
    # about 4 times a day, an ALADIN run late by hours), and a run with nothing new stops
    # after the check. Since 6.10.2026 a Cloudflare Worker also starts it (workflow_dispatch)
    # whenever no run is going, checked every 5 minutes; this schedule is the fallback.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      run:
        description: "ALADIN run to read, e.g. 2026093006 (empty: newest, only if new)"
        required: false
        default: ""
      map:
        description: "Rebuild both maps now"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aladin
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Note the start (for the admin panel's report)
        run: echo "RUN_STARTED=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Python version (for the package cache)
        id: python
        run: echo "version=$(python3 -c 'import sys; print(sys.version.split()[0])')" >> "$GITHUB_OUTPUT"

      # The installed packages are kept between runs (GitHub's cache, keyed by the Python version and
      # the package list; v1: change it to install them afresh), so a run doesn't spend 1-7 minutes
      # installing them again (7.10.2026).
      - name: Restore the installed packages
        id: venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.python.outputs.version }}-eccodes-numpy-pillow-h5py-scipy-copernicusmarine-v1

      - name: Install ecCodes, NumPy, Pillow, h5py, SciPy and the Copernicus Marine toolbox
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet eccodes numpy pillow h5py scipy copernicusmarine

      - name: Read the newest ALADIN run
        id: aladin
        env:
          RUN: ${{ inputs.run }}
          # The GRIB files stay for the ALADIN map.
          ALADIN_KEEP: aladin-files
        run: |
          .venv/bin/python extract.py $RUN
          if git diff --quiet docs/aladin.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # NEMO-EST (Estonian sea model): water level and temperature at the spots, twice a day.
      - name: Read the newest NEMO run
        id: nemo
        env:
          # The Copernicus Baltic model for the water map's coasts outside NEMO (free account).
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: |
          .venv/bin/python nemo.py || echo "NEMO unavailable this time"
          if git diff --quiet --exit-code docs/nemo.json 2>/dev/null && git ls-files --error-unmatch docs/nemo.json >/dev/null 2>&1; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # The Estonian coastal gauges' last 48 hours, from their pages, once an hour.
      - name: Read the Estonian gauges
        id: gauges
        run: |
          .venv/bin/python ee_gauges.py || echo "Estonian gauges unavailable this time"
          if git diff --quiet --exit-code docs/ee-gauges.json 2>/dev/null && git ls-files --error-unmatch docs/ee-gauges.json >/dev/null 2>&1; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # Pages replaces the whole site on each deploy, so every deploy carries all of it: each map is
      # rebuilt only for a new run of its model (MET Nordic and the rain every hour, HARM-FI and
      # HARM-DK every 3 hours, ALADIN, ICON-EU and GFS 4 times a day, ECMWF and the EWAM waves
      # twice), otherwise its published frames are copied over. The blend is mixed again when any
      # wind map is new. A run with nothing new stops here in about two minutes.
      - name: What is due?
        id: due
        env:
          FORCE: ${{ inputs.map }}
          NEW_ALADIN: ${{ steps.aladin.outputs.changed }}
          NEW_NEMO: ${{ steps.nemo.outputs.changed }}
          NEW_GAUGES: ${{ steps.gauges.outputs.changed }}
        run: |
          rebuild=""
          for pair in map:metnordic_map.py rain:rain_map.py temp:temp_map.py harmonie:harmonie_map.py harm-dk:dmi_map.py icon-eu:iconeu_map.py ecmwf:ecmwf_map.py gfs:gfs_map.py waves:wave_map.py rain-icon:rain_icon.py rain-chance:rain_chance.py; do
            name=${pair%%:*}; script=${pair##*:}
            newest=$(.venv/bin/python $script --check || echo "")
            published=$(python3 -c "import json; print(json.load(open('docs/runs.json')).get('$name', ''))" 2>/dev/null || echo "")
            echo "$name: newest $newest, published $published"
            echo "$name|$newest|$published" >> due.txt
            if [ -n "$newest" ] && { [ "$newest" != "$published" ] || [ "$FORCE" = "true" ]; }; then rebuild="$rebuild $name"; fi
          done
          deploy=false
          if [ -n "$rebuild" ] || [ "$NEW_ALADIN" = "true" ] || [ "$NEW_NEMO" = "true" ] || [ "$NEW_GAUGES" = "true" ] || [ "$FORCE" = "true" ]; then deploy=true; fi
          echo "New runs:$rebuild; ALADIN new: $NEW_ALADIN; deploy: $deploy"
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      - name: Build the site
        id: build
        if: steps.due.outputs.deploy == 'true'
        env:
          REBUILD: ${{ steps.due.outputs.rebuild }}
          NEW_ALADIN: ${{ steps.aladin.outputs.changed }}
          FORCE: ${{ inputs.map }}
        run: |
          # A new run is built (a busy source keeps its last published map rather than failing
          # the deploy); otherwise the published frames are copied (built if that fails). Rain is
          # MET Nordic's precipitation; the app adds the radar before now. The chance of rain is
          # MEPS's ensemble (30 members, a new lagged set every hour). What couldn't be made is noted
          # for the admin panel's report.
          failed() { echo "$1"; echo "$1" >> failed.txt; }
          for pair in map:metnordic_map.py rain:rain_map.py temp:temp_map.py harmonie:harmonie_map.py harm-dk:dmi_map.py icon-eu:iconeu_map.py ecmwf:ecmwf_map.py gfs:gfs_map.py waves:wave_map.py rain-icon:rain_icon.py rain-chance:rain_chance.py; do
            name=${pair%%:*}; script=${pair##*:}
            case " $REBUILD " in
              *" $name "*) .venv/bin/python $script site/$name || .venv/bin/python carry.py site/$name $name || failed "$name map unavailable this time" ;;
              *) .venv/bin/python carry.py site/$name $name || .venv/bin/python $script site/$name || failed "$name map unavailable this time" ;;
            esac
          done
          if [ "$NEW_ALADIN" = "true" ] && [ -f aladin-files/run.txt ]; then
            .venv/bin/python aladin_map.py site/aladin aladin-files
          elif [ "$FORCE" = "true" ] || ! .venv/bin/python carry.py site/aladin aladin; then
            .venv/bin/python aladin_map.py site/aladin || failed "ALADIN map unavailable this time"
          fi
          # The rain map's days 3-5 (ICON-EU) joined after its MET Nordic hours.
          .venv/bin/python rain_join.py site || failed "Rain join failed"
          # The blend: mixed again when a wind map is new, else the published one.
          case " $REBUILD " in
            *" map "*|*" harmonie "*|*" harm-dk "*|*" icon-eu "*|*" ecmwf "*|*" gfs "*) mix=true ;;
            *) mix=$NEW_ALADIN ;;
          esac
          if [ "$mix" = "true" ] || [ "$FORCE" = "true" ] || ! .venv/bin/python carry.py site/blend blend; then
            .venv/bin/python blend_map.py site || .venv/bin/python carry.py site/blend blend || failed "Blend unavailable this time"
          fi
          cp docs/aladin.json docs/index.html site/
          if [ -f docs/nemo.json ]; then cp docs/nemo.json site/; fi
          # The water map (NEMO-EST): this run's frames, else the published ones.
          if [ -d water-site ]; then cp -r water-site site/water; else .venv/bin/python carry.py site/water water || failed "Water map unavailable this time"; fi
          # The sea ice beside it (Copernicus): this run's frames, else the published ones.
          if [ -d ice-site ]; then cp -r ice-site site/ice; else .venv/bin/python carry.py site/ice ice || echo "No ice map yet"; fi
          # The coast points (about 1 MB, not in git): this run's, else the live ones.
          if [ -f nemo-coast.json ]; then cp nemo-coast.json site/; else curl -sf -o site/nemo-coast.json https://andreysemjonov.github.io/baltic-aladin/nemo-coast.json || echo "No NEMO coast points yet"; fi
          if [ -f docs/ee-gauges.json ]; then cp docs/ee-gauges.json site/; fi
          if [ -f docs/gauges.json ]; then cp docs/gauges.json site/; fi
          python3 - <<'PY'
          import json, os, time
          now = time.strftime("%Y-%m-%dT%H:%MZ", time.gmtime())
          if os.path.exists("site/map/map.json"):
              m = json.load(open("site/map/map.json"))
              json.dump({"built": now, "run": m["run"], "frames": len(m["frames"])}, open("docs/map-state.json", "w"))
          runs = {}
          for name in ("map", "rain", "temp", "harmonie", "harm-dk", "icon-eu", "ecmwf", "gfs", "waves", "rain-icon", "rain-chance"):
              path = f"site/{name}/map.json"
              if os.path.exists(path):
                  run = json.load(open(path))["run"]
                  runs[name] = run[:4] + run[5:7] + run[8:10] + run[11:13]
          json.dump(runs, open("docs/runs.json", "w"), indent=1, sort_keys=True)
          PY

      - name: Commit the small status files
        id: commit
        if: steps.due.outputs.deploy == 'true'
        run: |
          git rm -q --ignore-unmatch docs/icon-state.json
          git add docs/aladin.json docs/map-state.json docs/runs.json
          if [ -f docs/nemo.json ]; then git add docs/nemo.json; fi
          if [ -f docs/ee-gauges.json ]; then git add docs/ee-gauges.json; fi
          if [ -f docs/gauges.json ]; then git add docs/gauges.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ALADIN $(python3 -c 'import json;print(json.load(open("docs/aladin.json"))["run"])'), MET Nordic $(python3 -c 'import json;print(json.load(open("docs/map-state.json"))["run"])'), runs $(python3 -c 'import json;print(json.load(open("docs/runs.json")))')"
          # Someone may have pushed while this ran: take their commits first.
          # On a clash over the same status files, this run's (newer) versions win.
          git pull --rebase -X theirs -q && git push

      - name: Upload the site
        id: upload
        if: steps.due.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish on GitHub Pages
        id: publish
        if: steps.due.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4

      # A short report of every run (also the quick "nothing new" ones) for the admin panel: what was
      # due, what was rebuilt, what failed, each map's newest and published run. Sent to the
      # station-history Worker, which keeps 14 days; nothing secret in it. Without the
      # ADMIN_INGEST_TOKEN secret nothing is sent; a failed report never fails the run.
      - name: Report to the admin panel
        if: always()
        env:
          INGEST_TOKEN: ${{ secrets.ADMIN_INGEST_TOKEN }}
          REBUILD: ${{ steps.due.outputs.rebuild }}
          DEPLOY: ${{ steps.due.outputs.deploy }}
          FORCE: ${{ inputs.map }}
          EVENT: ${{ github.event_name }}
          OUTCOMES: aladin=${{ steps.aladin.outcome }} nemo=${{ steps.nemo.outcome }} gauges=${{ steps.gauges.outcome }} due=${{ steps.due.outcome }} build=${{ steps.build.outcome }} commit=${{ steps.commit.outcome }} upload=${{ steps.upload.outcome }} publish=${{ steps.publish.outcome }}
          CHANGED: aladin=${{ steps.aladin.outputs.changed }} nemo=${{ steps.nemo.outputs.changed }} gauges=${{ steps.gauges.outputs.changed }}
        run: |
          if [ -z "$INGEST_TOKEN" ]; then echo "No ADMIN_INGEST_TOKEN secret: no report"; exit 0; fi
          python3 - > report.json <<'PY'
          import glob, json, os, time

          def pairs(text):
              return dict(p.split("=", 1) for p in text.split() if "=" in p)

          maps = {}
          if os.path.exists("due.txt"):
              for line in open("due.txt"):
                  name, newest, published = (line.strip().split("|") + ["", "", ""])[:3]
                  maps[name] = {"newest": newest, "published": published}
          try:
              runs = json.load(open("docs/runs.json"))
          except Exception:
              runs = {}
          for name, run in runs.items():
              maps.setdefault(name, {})["published"] = run
          for path in glob.glob("site/*/map.json"):
              name = os.path.basename(os.path.dirname(path))
              try:
                  m = json.load(open(path))
              except Exception:
                  continue
              maps.setdefault(name, {}).update({"run": m.get("run"), "updated": m.get("updated"), "frames": len(m.get("frames", []))})
          failed = [l.strip() for l in open("failed.txt")] if os.path.exists("failed.txt") else []
          steps = pairs(os.environ.get("OUTCOMES", ""))
          deploy = os.environ.get("DEPLOY") == "true"
          result = ("failed" if "failure" in steps.values() or "cancelled" in steps.values()
                    else "published" if steps.get("publish") == "success" else "nothing new" if not deploy else "partial")
          print(json.dumps({
              "run_id": int(os.environ["GITHUB_RUN_ID"]), "number": int(os.environ["GITHUB_RUN_NUMBER"]),
              "attempt": int(os.environ.get("GITHUB_RUN_ATTEMPT", "1")), "event": os.environ.get("EVENT"),
              "started": int(os.environ.get("RUN_STARTED") or 0), "finished": int(time.time()),
              "rebuild": os.environ.get("REBUILD", "").split(), "deploy": deploy, "force": os.environ.get("FORCE") == "true",
              "changed": pairs(os.environ.get("CHANGED", "")), "steps": steps, "failed": failed, "result": result, "maps": maps,
          }, separators=(",", ":")))
          PY
          curl -s -m 20 -o /dev/null -w "Report sent: HTTP %{http_code}\n" -X POST \
            -H "authorization: Bearer $INGEST_TOKEN" -H "content-type: application/json" \
            --data @report.json https://station-history.andrejs-semjonovs.workers.dev/ingest || echo "Report not sent"
