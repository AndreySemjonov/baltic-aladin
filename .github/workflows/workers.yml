name: Deploy Workers
run-name: Deploy Workers (${{ inputs.worker }})

# MeteoGust's Cloudflare Workers from the app's repository (private; the owner, 14.10.2026: no more
# pasting from a phone; the app repository's own Actions have no minutes left, this public one's
# are free). Only the Worker's code is uploaded, through Cloudflare's "script content" call: its
# bindings (the database, the file store), schedules, secrets and domains stay as they are set in
# the dashboard. The code comes from the app repository's master, read with a read-only token: every
# .js file in the Worker's folder (its modules, worker.js the entry; since 26.10.2026 the big two are
# split into modules), checked as modules and loaded together first; nothing of it is printed here.
# station-history's /status is read after.
#
# Started by hand or by the chats after a Worker changes on master (gh workflow run workers.yml
# -f worker=station-history). Secrets (the owner's, never in a repository or a chat):
# APP_REPO_TOKEN (GitHub, Contents: Read-only on WindguruStationWatch), CLOUDFLARE_API_TOKEN
# (Workers Scripts: Edit), CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:
    inputs:
      worker:
        description: Which Worker
        type: choice
        options: [station-history, meteogust-admin, helper-trigger, meteogust-mirror, all]
        default: station-history

permissions:
  contents: read

concurrency:
  group: workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: The Workers' code (the app's master)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AndreySemjonov/WindguruStationWatch
          ref: master
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app
          persist-credentials: false
          sparse-checkout: tools

      - name: Check and upload
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WANTED: ${{ inputs.worker }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ "$WANTED" = "all" ]; then list="station-history meteogust-admin helper-trigger meteogust-mirror"; else list="$WANTED"; fi
          echo "app master: $(git -C app rev-parse --short HEAD)"
          for name in $list; do
            case "$name" in
              station-history) dir=station-history ;;
              meteogust-admin) dir=admin ;;
              helper-trigger) dir=helper-trigger ;;
              meteogust-mirror) dir=mirror ;;
              *) echo "::error::Unknown Worker $name"; exit 1 ;;
            esac
            # Every .js file in the Worker's folder is one of its modules, worker.js the entry (station-history and
            # meteogust-admin split into modules on 26.10.2026; the others are one file). Checked as Cloudflare reads
            # them: each a module (a plain script check let a broken string through once), then all loaded together,
            # so a missing import or export stops here. Only file names are printed, never Node's message (code).
            check="$RUNNER_TEMP/check-$name"
            rm -rf "$check"; mkdir -p "$check"
            cp "app/tools/$dir"/*.js "$check/"
            echo '{"type":"module"}' > "$check/package.json"
            for f in "$check"/*.js; do
              node --check "$f" > /dev/null 2>&1 || { echo "::error::$name: $(basename "$f") is not a valid module"; exit 1; }
            done
            ( cd "$check" && node --input-type=module -e 'await import("./worker.js")' ) > /dev/null 2>&1 \
              || { echo "::error::$name: its modules don't load together (a missing import or export?)"; exit 1; }
            parts=()
            for f in "$check"/*.js; do
              b=$(basename "$f")
              parts+=(-F "$b=@$f;filename=$b;type=application/javascript+module")
            done
            echo "$name: $(( ${#parts[@]} / 2 )) modules"
            if [ "$name" = "meteogust-mirror" ]; then
              # The mirror (21.10.2026) brings its own settings: the file store's binding, room to stream big
              # files, and its 5-minute cron (the older Workers keep theirs from the dashboard).
              reply=$(curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/$name" \
                -H "Authorization: Bearer $TOKEN" \
                -F 'metadata={"main_module":"worker.js","compatibility_date":"2026-10-01","bindings":[{"type":"r2_bucket","name":"FILES","bucket_name":"meteogust-files"}],"limits":{"cpu_ms":300000}};type=application/json' \
                "${parts[@]}")
              curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/$name/schedules" \
                -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                --data '[{"cron":"*/5 * * * *"}]' | python3 -c 'import json,sys; r=json.load(sys.stdin); print("schedule:", "ok" if r.get("success") else r.get("errors"))'
            else
              reply=$(curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/$name/content" \
                -H "Authorization: Bearer $TOKEN" \
                -F 'metadata={"main_module":"worker.js"};type=application/json' \
                "${parts[@]}")
            fi
            echo "$reply" | NAME="$name" python3 -c '
          import json, os, sys
          reply = json.load(sys.stdin)
          name = os.environ["NAME"]
          if reply.get("success"):
              print(f"{name}: uploaded")
          else:
              print(f"::error::{name}: " + "; ".join(e.get("message", "") for e in reply.get("errors", [])))
              sys.exit(1)'
          done

      - name: station-history answers
        if: inputs.worker == 'station-history' || inputs.worker == 'all'
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" https://data.meteogust.com/status)
          echo "station-history /status: $code"
          [ "$code" = "200" ]
