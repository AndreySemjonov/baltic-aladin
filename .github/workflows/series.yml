name: Places' files
run-name: Places' files (every wind set's hours by place)

# The files a place's hours are read from (series_tiles.py; the owner, 18.10.2026: a new place must
# not wait for them): after each run of a wind set, every tile of its area, its hourly packs turned
# round; a set already done for its newest run is skipped in a second.
on:
  workflow_run:
    workflows: ["Regional weather tiles", "MET Nordic 1 km tiles", "World weather tiles", "Mix tiles", "World mix tiles", "UK Met Office tiles", "Open data tiles", "Weather mix tiles", "Europe's seas", "World seas"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: series
  cancel-in-progress: false

jobs:
  series:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Python version (for the package cache)
        id: python
        run: echo "version=$(python3 -c 'import sys; print(sys.version.split()[0])')" >> "$GITHUB_OUTPUT"

      - name: Restore the installed packages
        id: venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: world-venv-${{ runner.os }}-py${{ steps.python.outputs.version }}-eccodes-numpy-pillow-scipy-v2

      - name: Install ecCodes, NumPy, Pillow and SciPy
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet eccodes numpy pillow scipy

      - name: Make and upload the places' files
        env:
          INGEST_TOKEN: ${{ secrets.ADMIN_INGEST_TOKEN }}
        run: .venv/bin/python series_tiles.py
