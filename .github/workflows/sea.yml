name: Europe's seas
run-name: Europe's seas (Copernicus level, temperature, current, ice)

# Europe's water map as one tile set (water_composite.py, the app's docs/WATER_TILES_PLAN.md W1;
# the owner, 15.10.2026): the Copernicus Marine physics forecasts (Baltic, North-West Shelf,
# Iberia-Biscay-Ireland, Black Sea, Mediterranean, the global model under them in Europe's box)
# blended into tiles/sea, the Baltic's ice beside it. Twice a day, after the models' runs are out.
on:
  schedule:
    - cron: "20 9,21 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Only the first N hours (a test); empty: all"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  sea:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: sea
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install ecCodes, NumPy, Pillow, SciPy and the Copernicus Marine toolbox
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet eccodes numpy pillow scipy copernicusmarine

      - name: Make and upload the seas
        env:
          INGEST_TOKEN: ${{ secrets.ADMIN_INGEST_TOKEN }}
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          HOURS: ${{ inputs.hours }}
        run: .venv/bin/python water_composite.py ${HOURS:+--hours $HOURS}
