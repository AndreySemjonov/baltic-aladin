<style>
/* Layout: a control-room console. Status bar, the machine, running jobs beside what's next, then the
   day's timeline, sources and recent runs. One column on a phone, in the order a glance needs. */
:root {
  --bg: #eef2f5; --panel: #ffffff; --line: #d8e0e7; --ink: #13202b; --muted: #5d6d7c; --faint: #728396;
  --accent: #0f7f88; --accent-soft: #d5eef0; --wrf: #6a55c9; --wrf-soft: #e6e1fa;
  --ok: #2f9a5c; --warn: #b9770e; --warn-soft: #fbefd9; --bad: #c94141; --bad-soft: #f8dede;
  --display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d151d; --panel: #141f2a; --line: #233242; --ink: #dbe5ee; --muted: #8b9cad; --faint: #5a6b7c;
  --accent: #46c1c9; --accent-soft: #143a40; --wrf: #a594f2; --wrf-soft: #2a2550;
  --ok: #5fc58a; --warn: #e3a447; --warn-soft: #3a2c14; --bad: #f07272; --bad-soft: #3d1b1e; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d151d; --panel: #141f2a; --line: #233242; --ink: #dbe5ee; --muted: #8b9cad; --faint: #5a6b7c;
  --accent: #46c1c9; --accent-soft: #143a40; --wrf: #a594f2; --wrf-soft: #2a2550;
  --ok: #5fc58a; --warn: #e3a447; --warn-soft: #3a2c14; --bad: #f07272; --bad-soft: #3d1b1e; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); margin: 0 }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 0 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
/* The Pipeline across the whole window, its hours taking the room (the owner, 26.10.2026: "Lets make its fit
   automatically to left right. This will give more room to graph"); the other tabs keep their column. */
.wrap.wide { max-width: none; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)) }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
h2 { font: 600 13px/1 var(--display); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0 }

/* Status bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  margin-bottom: 16px }
.top .wrap { padding-block: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px }
.brand { font: 700 20px/1 var(--display); letter-spacing: .01em; display: flex; align-items: center; gap: 10px }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent);
  animation: pulse 2s infinite }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px transparent } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none } }
.brand small { font: 500 14px var(--body); color: var(--muted) }
.pills { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0 }
.pill { font: 500 12.5px/1 var(--body); padding: 6px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); white-space: nowrap }
.pill.wrf { background: var(--wrf-soft); border-color: transparent; color: var(--wrf) }
.pill.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn) }
.clock { font: 500 13px var(--mono); color: var(--muted); white-space: nowrap }
.clock b { color: var(--ink); font-weight: 500 }

/* Grid */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)) }
.s12 { grid-column: span 12 } .s8 { grid-column: span 8 } .s4 { grid-column: span 4 } .s7 { grid-column: span 7 } .s5 { grid-column: span 5 }
@media (max-width: 980px) { .s8, .s4, .s7, .s5 { grid-column: span 12 } }

/* Machine */
.machine { display: grid; grid-template-columns: 1.25fr 1fr 1.25fr; gap: 24px }
@media (max-width: 980px) { .machine { grid-template-columns: 1fr } }
.cores { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px }
.core { height: 38px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden }
.core i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); transition: height .8s }
.core.wrf i { background: var(--wrf) }
.core.e { height: 30px; align-self: end }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); margin-top: 8px }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; background: var(--c) }
.mem { display: flex; height: 22px; border-radius: 5px; overflow: hidden; background: var(--line); gap: 2px }
.mem div { height: 100% }
.memline { display: flex; justify-content: space-between; align-items: baseline; margin: 2px 0 8px }
.big { font: 600 26px/1 var(--display) }
.big small { font: 500 14px var(--body); color: var(--muted) }
.memnote { font-size: 13px; color: var(--muted); margin-top: 8px }
.net { display: flex; flex-direction: column; gap: 6px }
.net svg { width: 100%; height: 64px; display: block }
.netnums { display: flex; gap: 22px }

/* Running jobs */
.jobs { display: grid; gap: 12px }
.job { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; cursor: pointer; background: var(--panel) }
.job:hover, .job:focus-visible { border-color: var(--accent); outline: none }
.job.wrfjob { background: var(--wrf-soft); border-color: transparent }
.jhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.jname { font: 600 17px/1.1 var(--display) }
.prio { font: 600 11px/1 var(--mono); padding: 4px 6px; border-radius: 4px }
.p1 { background: var(--accent); color: var(--panel) } .p2 { border: 1px solid var(--accent); color: var(--accent) } .p3 { border: 1px solid var(--faint); color: var(--muted) }
.pw { background: var(--wrf); color: var(--panel) }
.jstats { margin-left: auto; display: flex; gap: 14px; font: 13px var(--mono); color: var(--muted) }
.jstats b { color: var(--ink); font-weight: 500 }
.what { font-size: 14px }
.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .8s }
.wrfjob .bar i { background: var(--wrf) }
.dl { display: flex; align-items: center; gap: 10px; font: 12.5px var(--mono); color: var(--muted); min-width: 0 }
.dl .file { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 }
.dl .speed { color: var(--accent); font-weight: 500; white-space: nowrap }
.dl svg { width: 70px; height: 18px; flex: none }
.logline { font: 12px var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.log { background: var(--bg); border-radius: 6px; padding: 10px 12px; font: 12px/1.6 var(--mono); color: var(--muted); max-height: 168px; overflow: auto }
.log div:last-child { color: var(--ink) }

/* Next */
.next { display: grid; gap: 0 }
.nrow { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start }
.nrow:first-of-type { border-top: 0; padding-top: 0 }
.nrow .t { font: 500 13px var(--mono); color: var(--muted); white-space: nowrap; text-align: right }
.nrow .t.now { color: var(--warn) }
.nrow .n { font: 600 15px/1.2 var(--display) }
.nrow .why { grid-column: 2 / 4; font-size: 13px; color: var(--muted) }
.chip { display: inline-block; font: 500 11.5px/1 var(--body); padding: 4px 7px; border-radius: 4px; margin-left: 6px; vertical-align: 1px }
.chip.mem { background: var(--warn-soft); color: var(--warn) }
.chip.hold { background: var(--line); color: var(--muted) }
.chip.wrf { background: var(--wrf-soft); color: var(--wrf) }

/* Timeline */
.tlwrap { overflow-x: auto }
.tl { min-width: 860px; width: 100%; display: block }
.tl text { font: 11px var(--mono); fill: var(--muted) }
.tl .lane { font: 600 12px var(--display); letter-spacing: .04em; fill: var(--ink) }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: 14px }
th { text-align: left; font: 600 11.5px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 8px 8px; border-bottom: 1px solid var(--line) }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top }
tr:last-child td { border-bottom: 0 }
td.r, th.r { text-align: right }
.tablewrap { overflow-x: auto }
.ok { color: var(--ok) } .bad { color: var(--bad) } .warn { color: var(--warn) }
.faster { color: var(--ok); font-size: 12.5px } .slower { color: var(--warn); font-size: 12.5px }
.foot { margin-top: 18px; font-size: 12.5px; color: var(--faint); display: flex; flex-wrap: wrap; gap: 6px 18px }
.mockflag { font: 600 11px var(--mono); letter-spacing: .08em; color: var(--warn); border: 1px dashed var(--warn); border-radius: 4px; padding: 3px 6px }
</style>

<style>
