          <select value=${(o.sets || [])[0] || ""} onChange=${(e) => e.target.value && act({ code: o.code, action: "set", set: e.target.value })}>${!(o.sets || []).length ? html`<option value="">set…</option>` : null}${sets.map((x) => html`<option value=${x.id}>${x.flag} ${x.name}</option>`)}</select>
          <${ActButton} label=${o.hidden ? "Show" : "Hide"} ask=${o.hidden ? null : "Hide? Riders who have it keep it. Click again"} run=${() => act({ code: o.code, action: o.hidden ? "show" : "hide" })} /></span></td></tr>`)}</tbody></table></div></div>`)}
    ${!official.length ? html`<div class="panel s12"><${ActButton} label=${"Import the " + spots.builtIn + " built-in spots"} run=${async () => { const d = await adminPost("spots", { action: "import" }); refresh(); return d; }} /></div>` : null}
    <p class="whytxt s12" style="margin:0">What the app offers: on first launch by set, and in Add spots. A set change or a hidden spot reaches phones within a few hours, without a new build; a hidden spot keeps working for riders who have it. · ${spots.shared ?? "–"} spots shared by link only · ${spots.rejected ?? "–"} rejected</p>
  </div>`;
}

let alertMsg = (m) => alert("Not done: " + m);

function WeightPoints({ spots, refresh }) {
  const [edit, setEdit] = useState(null);
  const [form, setForm] = useState({ name: "", lat: "", lon: "", weights: {}, source: "" });
  const [msg, setMsg] = useState("");
  if (!spots) return html`<p class="empty">Reading the spots…</p>`;
  if (edit) return html`<${SpotEditBox} code=${edit} onClose=${() => { setEdit(null); refresh(); }} onSaved=${refresh} />`;
  const points = (spots.official || []).filter((o) => String(o.spot_id).startsWith("w-"));
  const add = async () => {
    const { data } = await adminPostRaw("spots", { action: "point", name: form.name, lat: form.lat, lon: form.lon, weights: form.weights, source: form.source });
    setMsg(data.error ? data.error : "✓ added");
    if (!data.error) { setForm({ name: "", lat: "", lon: "", weights: {}, source: "" }); refresh(); }
  };
  return html`<div class="grid">
    <div class="panel s6"><h2>Weight points · ${points.length}</h2><p class="note">Places with their own model weights, not shown as spots: the Mix and new spots near them use these weights.</p>
      <div class="tablewrap"><table><tbody>${points.map((o) => html`<tr><td><b>${o.name}</b><div class="whytxt">${(+o.lat).toFixed(3)}, ${(+o.lon).toFixed(3)}</div></td>
        <td class="r"><button class="btn" onClick=${() => setEdit(o.code)}>Edit weights, move</button></td></tr>`)}</tbody></table></div></div>
    <div class="panel s6"><h2>Add a weight point</h2><div class="form">
      <label>Name<input maxlength="60" value=${form.name} onInput=${(e) => setForm({ ...form, name: e.target.value })}/></label>
      <label>Where the weights come from<input maxlength="80" value=${form.source} onInput=${(e) => setForm({ ...form, source: e.target.value })}/></label>
      <label>Latitude<input value=${form.lat} onInput=${(e) => setForm({ ...form, lat: e.target.value })}/></label>
      <label>Longitude<input value=${form.lon} onInput=${(e) => setForm({ ...form, lon: e.target.value })}/></label></div>
      <div style="margin-top:10px"><${WeightsGrid} value=${form.weights} onChange=${(w) => setForm({ ...form, weights: w })} /></div>
      <div class="btns" style="margin-top:10px"><button class="btn primary" onClick=${add} disabled=${!form.name || !form.lat || !form.lon}>Add</button><${Saved} msg=${msg} /></div></div>
  </div>`;
}

function RolesEditor({ roles, refresh, now }) {
  const [msg, setMsg] = useState("");
  if (!roles) return html`<p class="empty">Reading riders and roles…</p>`;
  const post = async (body, what) => { const { data, status } = await adminPostRaw("roles", body); setMsg(data.error ? data.error : `✓ ${what}`); if (!data.error && status < 400) refresh(); };
  const accounts = (roles.accounts || []).slice().sort((a, b) => b.last_seen - a.last_seen);
  const devices = (roles.devices || []).slice().sort((a, b) => b.last_seen - a.last_seen);
  return html`<div class="grid">
    <div class="panel s12"><div class="btns" style="align-items:center"><b>New riders get</b>
      <select value=${roles.defaultRole} onChange=${(e) => post({ action: "default", role: e.target.value }, "default role " + e.target.value)}>${ROLES.map((r) => html`<option value=${r}>${r}</option>`)}</select>
      <${Saved} msg=${msg} /></div></div>
    <div class="panel s12"><h2>Accounts · ${accounts.length}</h2><div class="tablewrap"><table><thead><tr><th>Rider</th><th>Email</th><th>Signed in with</th><th>Role</th><th class="r">Last seen</th><th></th></tr></thead><tbody>
      ${accounts.map((a) => html`<tr><td>${a.photo && !a.photo_blocked ? html`<img src=${a.photo} alt="" class="avatar"/>` : null} ${a.nickname || [a.first, a.last].filter(Boolean).join(" ") || "–"}</td>
        <td class="whytxt">${a.email || a.apple_email || "–"}</td><td class="whytxt">${[a.apple ? "Apple" : null, a.google ? "Google" : null].filter(Boolean).join(", ") || "email"}</td>
        <td><select value=${a.role} onChange=${(e) => post({ action: "accountRole", account: a.id, role: e.target.value }, (a.nickname || a.first || "rider") + " is " + e.target.value)}>${ROLES.map((r) => html`<option value=${r}>${r}</option>`)}</select></td>
        <td class="r num">${a.last_seen ? hrs(now - a.last_seen) + " ago" : "–"}</td>
        <td class="r">${a.photo ? html`<span class="btns"><button class="btn" onClick=${() => post({ action: "photo", account: a.id, remove: true }, "photo removed")}>Remove photo</button>
          <button class="btn danger" onClick=${() => post({ action: "photo", account: a.id, block: !a.photo_blocked }, a.photo_blocked ? "photos allowed" : "photos blocked")}>${a.photo_blocked ? "Allow photos" : "Block photos"}</button></span>` : null}</td></tr>`)}</tbody></table></div></div>
    <div class="panel s12"><h2>Devices · ${devices.length}</h2><div class="tablewrap"><table><thead><tr><th>Device</th><th>Build</th><th>Country</th><th>Account</th><th>Role</th><th class="r">Last seen</th></tr></thead><tbody>
      ${devices.map((d) => html`<tr><td>${d.nickname || d.model || d.device.slice(0, 8)}<div class="whytxt">${d.model || ""}</div></td><td class="num whytxt">${d.build || "–"}</td><td class="whytxt">${d.country || "–"}</td>
        <td class="whytxt">${(accounts.find((a) => a.id === d.account) || {}).nickname || (d.account ? "signed in" : "–")}</td>
        <td><select value=${d.role} onChange=${(e) => post({ action: "role", device: d.device, role: e.target.value }, "device is " + e.target.value)}>${ROLES.map((r) => html`<option value=${r}>${r}</option>`)}</select></td>
        <td class="r num">${d.last_seen ? hrs(now - d.last_seen) + " ago" : "–"}</td></tr>`)}</tbody></table></div></div>
  </div>`;
}

function FeatureRow({ x, post }) {
  const [release, setRelease] = useState(x.release);
  const [roles, setRoles] = useState(new Set(x.roles || []));
  const [account, setAccount] = useState(!!x.account);
  const changed = release !== x.release || account !== !!x.account || [...roles].sort().join() !== [...(x.roles || [])].sort().join();
  return html`<tr><td><b>${x.name}</b><div class="whytxt">${x.key}${x.soon ? " · " + x.soon : ""}</div></td><td class="whytxt">${x.grp}</td>
    <td><select value=${release} onChange=${(e) => setRelease(e.target.value)}><option value="released">released</option><option value="testers">testers only</option><option value="off">off</option></select></td>
    <td><span class="btns">${ROLES.map((r) => html`<label class="row"><input type="checkbox" checked=${roles.has(r)} disabled=${r === "admin"} onChange=${() => { const n = new Set(roles); n.has(r) ? n.delete(r) : n.add(r); setRoles(n); }}/> ${r}</label>`)}</span></td>
    <td><label class="row"><input type="checkbox" checked=${account} onChange=${(e) => setAccount(e.target.checked)}/> signed in only</label></td>
    <td class="r">${changed ? html`<button class="btn primary" onClick=${() => post({ action: "feature", key: x.key, release, roles: [...roles], account }, x.name)}>Save</button>` : null}</td></tr>`;
}

function FeaturesEditor({ roles, refresh }) {
  const [msg, setMsg] = useState("");
  if (!roles) return html`<p class="empty">Reading features…</p>`;
  const post = async (body, what) => { const { data } = await adminPostRaw("roles", body); setMsg(data.error ? data.error : `✓ ${what} saved`); if (!data.error) refresh(); };
  return html`<div class="panel"><h2>Features · who gets what</h2><p class="note">Admins always get everything. "Testers only": only the tester role. "Released": the roles ticked.</p>
    <div class="tablewrap"><table><thead><tr><th>Feature</th><th>Group</th><th>Release</th><th>Roles</th><th>Accounts</th><th></th></tr></thead>
      <tbody>${(roles.features || []).map((x) => html`<${FeatureRow} key=${x.key + x.release + (x.roles || []).join()} x=${x} post=${post} />`)}</tbody></table></div>
    <${Saved} msg=${msg} /></div>`;
}

function StationAdd({ st, refresh }) {
  const kinds = (st && st.kinds) || {};
  const [q, setQ] = useState({ source: Object.keys(kinds)[0] || "", lat: "", lon: "", km: "30" });
  const [found, setFound] = useState(null);
  const [msg, setMsg] = useState("");
  const [show, setShow] = useState(true);
  const find = async () => {
    setMsg("…");
    try { const d = await adminGet(`stations/find?source=${encodeURIComponent(q.source)}&lat=${encodeURIComponent(q.lat)}&lon=${encodeURIComponent(q.lon)}&km=${encodeURIComponent(q.km)}`);
      if (d.error) throw new Error(d.error); setFound(d); setMsg(""); } catch (e) { setMsg(String(e.message || e)); }
  };
  const add = async (x) => {
    const { data } = await adminPostRaw("stations", { action: "add", source: q.source, code: x.code, name: x.name, lat: x.lat, lon: x.lon, show });
    setMsg(data.error ? data.error : `✓ added ${data.station ? data.station.name : x.name}${show ? "" : " (hidden)"}`);
    if (!data.error) { refresh(); find(); }
  };
  return html`<div class="panel s12"><h2>Find and add a station</h2><div class="form four">
      <label>Source<select value=${q.source} onChange=${(e) => setQ({ ...q, source: e.target.value })}>${Object.entries(kinds).map(([k, v]) => html`<option value=${k}>${v.name}</option>`)}</select></label>
      <label>Latitude<input value=${q.lat} onInput=${(e) => setQ({ ...q, lat: e.target.value })} placeholder="36.01"/></label>
      <label>Longitude<input value=${q.lon} onInput=${(e) => setQ({ ...q, lon: e.target.value })} placeholder="-5.60"/></label>
      <label>Within km<input value=${q.km} onInput=${(e) => setQ({ ...q, km: e.target.value })}/></label></div>
    <div class="btns" style="margin-top:8px;align-items:center"><button class="btn primary" onClick=${find} disabled=${!q.lat || !q.lon}>Find stations</button>
      <label class="row"><input type="checkbox" checked=${show} onChange=${(e) => setShow(e.target.checked)}/> show on the map when added</label><${Saved} msg=${msg} /></div>
    ${found ? html`<div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Station</th><th class="r">Distance</th><th class="r">Wind</th><th class="r">Reading</th><th></th></tr></thead><tbody>
      ${(found.found || []).map((x) => html`<tr><td>${x.name}<div class="whytxt">${x.code}</div></td><td class="r num">${x.km.toFixed(1)} km</td><td class="r num">${x.wind != null ? x.wind + " m/s" : "–"}</td>
        <td class="r num">${x.time ? hrs(Date.now() / 1000 - x.time) + " ago" : "–"}</td>
        <td class="r">${x.added ? html`<span class="st ok">added</span>` : html`<button class="btn" onClick=${() => add(x)}>Add</button>`}</td></tr>`)}</tbody></table>
      <p class="whytxt">${found.listed} stations listed for this source, list updated ${found.updated ? hrs(Date.now() / 1000 - found.updated) + " ago" : "–"}.</p></div>` : null}
  </div>`;
}

function StationRow({ x, refresh, now }) {
  const [open, setOpen] = useState(false);
  const [f, setF] = useState({ name: x.name, note: x.note || "", windguru: x.windguru || "", twinKm: x.twinKm ?? "", lat: x.lat, lon: x.lon });
  const [msg, setMsg] = useState("");
  const [far, setFar] = useState(null);
  const save = async (confirmFar) => {
    const body = { action: "edit", id: x.id, name: f.name, note: f.note, windguru: f.windguru === "" ? null : f.windguru, twinKm: f.twinKm === "" ? undefined : Number(f.twinKm) };
    if (String(f.lat) !== String(x.lat) || String(f.lon) !== String(x.lon)) { body.lat = Number(f.lat); body.lon = Number(f.lon); if (confirmFar) body.far = true; }
    const { status, data } = await adminPostRaw("stations", body);
    if (status === 409 && data.far) { setFar(data.error); return; }
    setMsg(data.error ? data.error : "✓ saved"); setFar(null);
    if (!data.error) refresh();
  };
  const toggle = async () => { const { data } = await adminPostRaw("stations", { action: x.hidden ? "show" : "hide", id: x.id }); setMsg(data.error ? data.error : "✓"); refresh(); };
  return html`<tr><td>${x.name}${x.hidden ? html` <span class="st unknown">hidden</span>` : null}<div class="whytxt">${x.id}</div></td><td class="whytxt">${x.source}</td>
    <td class="r num" style=${x.time && now - x.time > 1200 ? "color:var(--warn)" : ""}>${x.time ? hrs(now - x.time) + " ago" : "–"}</td>
    <td class="r num">${x.wind != null ? x.wind + (x.gust != null ? "/" + x.gust : "") + " m/s" : "–"}</td>
    <td class="r"><span class="btns"><button class="btn" onClick=${() => setOpen(!open)}>${open ? "Close" : "Edit"}</button><button class="btn" onClick=${toggle}>${x.hidden ? "Show" : "Hide"}</button></span></td></tr>
    ${open ? html`<tr><td colspan="5"><div class="form four">
      <label>Name<input value=${f.name} onInput=${(e) => setF({ ...f, name: e.target.value })}/></label>
      <label>Note<input maxlength="300" value=${f.note} onInput=${(e) => setF({ ...f, note: e.target.value })}/></label>
      <label>Windguru station id (internal)<input value=${f.windguru} onInput=${(e) => setF({ ...f, windguru: e.target.value })}/></label>
      <label>Twin km (0-10)<input value=${f.twinKm} onInput=${(e) => setF({ ...f, twinKm: e.target.value })}/></label>
      <label>Latitude<input value=${f.lat} onInput=${(e) => setF({ ...f, lat: e.target.value })}/></label>
      <label>Longitude<input value=${f.lon} onInput=${(e) => setF({ ...f, lon: e.target.value })}/></label></div>
      <div class="btns" style="margin-top:8px;align-items:center"><button class="btn primary" onClick=${() => save(false)}>Save</button><${Saved} msg=${msg} />
        ${far ? html`<span class="confirm">${far} <button class="btn danger" onClick=${() => save(true)}>Move it that far</button></span>` : null}</div></td></tr>` : null}`;
}

function StationsEditor({ st, refresh, now }) {
  if (!st) return null;
  return html`<div class="grid" style="margin-top:16px"><${StationAdd} st=${st} refresh=${refresh} />
    <div class="panel s12"><h2>Edit stations · ${(st.stations || []).length}</h2><div class="tablewrap"><table><thead><tr><th>Station</th><th>Source</th><th class="r">Last reading</th><th class="r">Wind</th><th></th></tr></thead><tbody>
      ${(st.stations || []).slice().sort((a, b) => a.name.localeCompare(b.name)).map((x) => html`<${StationRow} key=${x.id} x=${x} refresh=${refresh} now=${now} />`)}</tbody></table></div></div></div>`;
}

const APP_TABS = [["overview", "Overview"], ["spots", "Spots"], ["points", "Weight points"], ["roles", "Riders & roles"], ["features", "Features"]];
function AppSection(props) {
  const [tab, setTab] = useState("overview");
  return html`<div class="subtabs">${APP_TABS.map(([k, label]) => html`<button class=${"chip" + (tab === k ? " on" : "")} onClick=${() => setTab(k)}>${label}</button>`)}</div>
    ${tab === "overview" ? html`<${AppRiders} ...${props} goTab=${setTab} />` : tab === "spots" ? html`<${SpotsEditor} spots=${props.spots} refresh=${props.reloadSpots} now=${props.now} />`
      : tab === "points" ? html`<${WeightPoints} spots=${props.spots} refresh=${props.reloadSpots} />`
      : tab === "roles" ? html`<${RolesEditor} roles=${props.roles} refresh=${props.reloadRoles} now=${props.now} />`
      : html`<${FeaturesEditor} roles=${props.roles} refresh=${props.reloadRoles} />`}`;
}

function App() {
  const [f, setF] = useState(null);
  const [s, setS] = useState(null);
  const [fr, setFr] = useState(null);
  const [cap, setCap] = useState(null);
  const [ad, setAd] = useState(null);
  const [maps, setMaps] = useState(null);
  const [spots, setSpots] = useState(null);
  const [roles, setRoles] = useState(null);
  const [builds, setBuilds] = useState(null);
  const [st, setSt] = useState(null);
  const pick = () => { const h = location.hash.slice(1); return SECTIONS.some(([k]) => k === h) ? h : "pipeline"; };
  const [sec, setSec] = useState(pick());
  const [zone, setZoneState] = useState(ZONE);
  const [, tick] = useState(0);
  const setZone = (z) => { ZONE = z; try { localStorage.setItem("ops-zone", z); } catch (e) {} setZoneState(z); };
  const load = async (list) => { for (const [k, fn] of list) { try { fn(await adminGet(k)); } catch (e) {} } };
  const refresh = () => load([["spots", setSpots]]);
  const reloadRoles = () => load([["roles", setRoles]]);
  const reloadStations = () => load([["stations", setSt]]);
  useEffect(() => {
    let last = Date.now();
    const es = new EventSource("/api/stream");
    es.addEventListener("fast", (e) => { last = Date.now(); setF(JSON.parse(e.data)); });
    es.addEventListener("slow", (e) => setS(JSON.parse(e.data)));
    es.addEventListener("fresh", (e) => setFr(JSON.parse(e.data)));
    es.addEventListener("capacity", (e) => setCap(JSON.parse(e.data)));
    es.addEventListener("admin", (e) => setAd(JSON.parse(e.data)));
    const onHash = () => setSec(pick());
    addEventListener("hashchange", onHash);
    // Admin's own data: the maps' history every 10 minutes (it reads ~3,000 rows), the rest every 5.
    load([["maps", setMaps], ["spots", setSpots], ["roles", setRoles], ["builds", setBuilds], ["stations", setSt]]);
    const slowAdmin = setInterval(() => load([["maps", setMaps]]), 600000);
    const midAdmin = setInterval(() => load([["spots", setSpots], ["builds", setBuilds], ["stations", setSt], ["roles", setRoles]]), 300000);
    // Without the stream (a proxy holding it back), ask every 3 seconds instead.
    const poll = setInterval(async () => {
      if (Date.now() - last < 8000) return;
      try {
        setF(await (await fetch("/api/fast")).json());
        if (Date.now() % 30000 < 3000) {
          setS(await (await fetch("/api/slow")).json());
          setFr(await (await fetch("/api/fresh")).json());
          setCap(await (await fetch("/api/capacity")).json());
          setAd(await (await fetch("/api/admin")).json());
        }
      } catch (err) {}
    }, 3000);
    const clockTimer = setInterval(() => tick((n) => n + 1), 1000);
    return () => { es.close(); clearInterval(poll); clearInterval(clockTimer); clearInterval(slowAdmin); clearInterval(midAdmin); removeEventListener("hashchange", onHash); };
  }, []);
  const now = Date.now() / 1000;
  if (!f) return html`<main class="wrap"><p class="empty">Connecting to the Tower…</p></main>`;
  return html`<${TopBar} f=${f} fr=${fr} ad=${ad} spots=${spots} zone=${zone} setZone=${setZone} sec=${sec} />
    <main class="wrap">
      ${sec === "pipeline" ? html`<${Pipeline} maps=${maps} fr=${fr} f=${f} now=${now} s=${s} cap=${cap} ad=${ad} />`
        : sec === "machine" ? html`<${NowTab} f=${f} s=${s} now=${now} /><div style="margin-top:16px"><${Capacity} cap=${cap} now=${now} /></div>`
        : sec === "quality" ? html`<${Quality} ad=${ad} now=${now} />`
        : sec === "app" ? html`<${AppSection} ad=${ad} spots=${spots} roles=${roles} builds=${builds} refresh=${refresh} reloadSpots=${refresh} reloadRoles=${reloadRoles} now=${now} />`
        : sec === "stations" ? html`<${StationsSec} ad=${ad} st=${st} now=${now} /><${StationsEditor} st=${st} refresh=${reloadStations} now=${now} />`
        : html`<${Costs} ad=${ad} now=${now} />`}
    <div class="foot"><span>Live every 2 seconds; admin's data every 5-10 minutes.</span><span>Changes go through admin's own routes and ask once more.</span><a href="/admin/" style="color:var(--accent)">Full admin</a></div></main>`;
}

render(html`<${App} />`, document.getElementById("app"));
</script>
</body></html>
