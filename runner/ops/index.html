<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MeteoGust Control</title>
<!-- The ops panel (runner/ops/server.py); from docs/mockups/ops-panel-2026-10-21.html in the app repo, approved by the owner 21.10.2026. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a control-room console. Status bar, the machine, running jobs beside what's next, then the
   day's timeline, sources and recent runs. One column on a phone, in the order a glance needs. */
:root {
  --bg: #eef2f5; --panel: #ffffff; --line: #d8e0e7; --ink: #13202b; --muted: #5d6d7c; --faint: #9aa8b5;
  --accent: #0f7f88; --accent-soft: #d5eef0; --wrf: #6a55c9; --wrf-soft: #e6e1fa;
  --ok: #2f9a5c; --warn: #b9770e; --warn-soft: #fbefd9; --bad: #c94141; --bad-soft: #f8dede;
  --display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d151d; --panel: #141f2a; --line: #233242; --ink: #dbe5ee; --muted: #8b9cad; --faint: #5a6b7c;
  --accent: #46c1c9; --accent-soft: #143a40; --wrf: #a594f2; --wrf-soft: #2a2550;
  --ok: #5fc58a; --warn: #e3a447; --warn-soft: #3a2c14; --bad: #f07272; --bad-soft: #3d1b1e; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d151d; --panel: #141f2a; --line: #233242; --ink: #dbe5ee; --muted: #8b9cad; --faint: #5a6b7c;
  --accent: #46c1c9; --accent-soft: #143a40; --wrf: #a594f2; --wrf-soft: #2a2550;
  --ok: #5fc58a; --warn: #e3a447; --warn-soft: #3a2c14; --bad: #f07272; --bad-soft: #3d1b1e; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); margin: 0 }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 0 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
h2 { font: 600 13px/1 var(--display); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0 }

/* Status bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  margin-bottom: 16px }
.top .wrap { padding-block: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px }
.brand { font: 700 20px/1 var(--display); letter-spacing: .01em; display: flex; align-items: center; gap: 10px }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent);
  animation: pulse 2s infinite }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px transparent } }
@media (prefers-reduced-motion: reduce) { .dot { animation: none } }
.brand small { font: 500 14px var(--body); color: var(--muted) }
.pills { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0 }
.pill { font: 500 12.5px/1 var(--body); padding: 6px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); white-space: nowrap }
.pill.wrf { background: var(--wrf-soft); border-color: transparent; color: var(--wrf) }
.pill.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn) }
.clock { font: 500 13px var(--mono); color: var(--muted); white-space: nowrap }
.clock b { color: var(--ink); font-weight: 500 }

/* Grid */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)) }
.s12 { grid-column: span 12 } .s8 { grid-column: span 8 } .s4 { grid-column: span 4 } .s7 { grid-column: span 7 } .s5 { grid-column: span 5 }
@media (max-width: 980px) { .s8, .s4, .s7, .s5 { grid-column: span 12 } }

/* Machine */
.machine { display: grid; grid-template-columns: 1.25fr 1fr 1.25fr; gap: 24px }
@media (max-width: 980px) { .machine { grid-template-columns: 1fr } }
.cores { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px }
.core { height: 38px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden }
.core i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); transition: height .8s }
.core.wrf i { background: var(--wrf) }
.core.e { height: 30px; align-self: end }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); margin-top: 8px }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; background: var(--c) }
.mem { display: flex; height: 22px; border-radius: 5px; overflow: hidden; background: var(--line); gap: 2px }
.mem div { height: 100% }
.memline { display: flex; justify-content: space-between; align-items: baseline; margin: 2px 0 8px }
.big { font: 600 26px/1 var(--display) }
.big small { font: 500 14px var(--body); color: var(--muted) }
.memnote { font-size: 13px; color: var(--muted); margin-top: 8px }
.net { display: flex; flex-direction: column; gap: 6px }
.net svg { width: 100%; height: 64px; display: block }
.netnums { display: flex; gap: 22px }

/* Running jobs */
.jobs { display: grid; gap: 12px }
.job { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; cursor: pointer; background: var(--panel) }
.job:hover, .job:focus-visible { border-color: var(--accent); outline: none }
.job.wrfjob { background: var(--wrf-soft); border-color: transparent }
.jhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.jname { font: 600 17px/1.1 var(--display) }
.prio { font: 600 11px/1 var(--mono); padding: 4px 6px; border-radius: 4px }
.p1 { background: var(--accent); color: var(--panel) } .p2 { border: 1px solid var(--accent); color: var(--accent) } .p3 { border: 1px solid var(--faint); color: var(--muted) }
.pw { background: var(--wrf); color: var(--panel) }
.jstats { margin-left: auto; display: flex; gap: 14px; font: 13px var(--mono); color: var(--muted) }
.jstats b { color: var(--ink); font-weight: 500 }
.what { font-size: 14px }
.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .8s }
.wrfjob .bar i { background: var(--wrf) }
.dl { display: flex; align-items: center; gap: 10px; font: 12.5px var(--mono); color: var(--muted); min-width: 0 }
.dl .file { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 }
.dl .speed { color: var(--accent); font-weight: 500; white-space: nowrap }
.dl svg { width: 70px; height: 18px; flex: none }
.logline { font: 12px var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.log { background: var(--bg); border-radius: 6px; padding: 10px 12px; font: 12px/1.6 var(--mono); color: var(--muted); max-height: 168px; overflow: auto }
.log div:last-child { color: var(--ink) }

/* Next */
.next { display: grid; gap: 0 }
.nrow { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start }
.nrow:first-of-type { border-top: 0; padding-top: 0 }
.nrow .t { font: 500 13px var(--mono); color: var(--muted); white-space: nowrap; text-align: right }
.nrow .t.now { color: var(--warn) }
.nrow .n { font: 600 15px/1.2 var(--display) }
.nrow .why { grid-column: 2 / 4; font-size: 13px; color: var(--muted) }
.chip { display: inline-block; font: 500 11.5px/1 var(--body); padding: 4px 7px; border-radius: 4px; margin-left: 6px; vertical-align: 1px }
.chip.mem { background: var(--warn-soft); color: var(--warn) }
.chip.hold { background: var(--line); color: var(--muted) }
.chip.wrf { background: var(--wrf-soft); color: var(--wrf) }

/* Timeline */
.tlwrap { overflow-x: auto }
.tl { min-width: 860px; width: 100%; display: block }
.tl text { font: 11px var(--mono); fill: var(--muted) }
.tl .lane { font: 600 12px var(--display); letter-spacing: .04em; fill: var(--ink) }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: 14px }
th { text-align: left; font: 600 11.5px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 8px 8px; border-bottom: 1px solid var(--line) }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top }
tr:last-child td { border-bottom: 0 }
td.r, th.r { text-align: right }
.tablewrap { overflow-x: auto }
.ok { color: var(--ok) } .bad { color: var(--bad) } .warn { color: var(--warn) }
.faster { color: var(--ok); font-size: 12.5px } .slower { color: var(--warn); font-size: 12.5px }
.foot { margin-top: 18px; font-size: 12.5px; color: var(--faint); display: flex; flex-wrap: wrap; gap: 6px 18px }
.mockflag { font: 600 11px var(--mono); letter-spacing: .08em; color: var(--warn); border: 1px dashed var(--warn); border-radius: 4px; padding: 3px 6px }
</style>
</head><body>
<style>
.pill.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad) }
.pill.okp { color: var(--ok) }
.tbtn { font: 500 12.5px var(--body); padding: 5px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer }
.tbtn:focus-visible { outline: 2px solid var(--accent) }
.tag { font: 500 11px/1 var(--body); padding: 3px 6px; border-radius: 4px; background: var(--line); color: var(--muted) }
.tag.live { background: var(--accent-soft); color: var(--accent) }
.dhead .tag.live { background: var(--home-soft); color: var(--home) }
.bar i.over { background: var(--warn) }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0 }
.core.idle i { background: var(--faint) }
.top .wrap { flex-direction: column; align-items: stretch; padding-bottom: 0 }
.row1 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px }
.tabs { display: flex; gap: 2px; overflow-x: auto; margin-bottom: -1px }
.tabs a { font: 600 15px/1 var(--display); letter-spacing: .03em; color: var(--muted); text-decoration: none; padding: 10px 14px 11px;
  border-bottom: 2px solid transparent; white-space: nowrap; display: flex; gap: 7px; align-items: center }
.tabs a.on { color: var(--ink); border-color: var(--accent) }
.tabs a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px }
.badge { font: 600 11px/1 var(--mono); padding: 3px 5px; border-radius: 4px; background: var(--bad-soft); color: var(--bad) }
.badge.warn { background: var(--warn-soft); color: var(--warn) }
:root { --ok-soft: #dcf2e4 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ok-soft: #173525 } }
:root[data-theme="dark"] { --ok-soft: #173525 }
.note { font-size: 13.5px; color: var(--muted); max-width: 80ch }
.st { font: 600 12px/1 var(--body); padding: 5px 8px; border-radius: 5px; white-space: nowrap; display: inline-block }
.st.ok { background: var(--ok-soft); color: var(--ok) } .st.proc { background: var(--accent-soft); color: var(--accent) }
.st.wait { background: var(--warn-soft); color: var(--warn) } .st.bad { background: var(--bad-soft); color: var(--bad) }
.st.unknown { background: var(--line); color: var(--muted) }
.where { font: 500 11px/1 var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; margin-left: 4px }
.where.home { color: var(--accent); border-color: var(--accent) }
.ftiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px }
@media (max-width: 720px) { .ftiles { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.ftile { border-radius: 8px; padding: 12px 14px; background: var(--bg) }
.ftile .v { font: 600 30px/1 var(--display) } .ftile .l { font-size: 13px; color: var(--muted); margin-top: 4px }
.ftile.ok .v { color: var(--ok) } .ftile.proc .v { color: var(--accent) } .ftile.wait .v { color: var(--warn) } .ftile.bad .v { color: var(--bad) }
td .sub { display: block; font-size: 12.5px; color: var(--muted) }
tr.group td { font: 600 12px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: 16px }
.strip { display: block; width: 260px; height: 22px }
.fresh-table { min-width: 1080px }
.fcards { display: none }
.fcard { padding: 10px 0; border-top: 1px solid var(--line); display: grid; gap: 4px }
.fcard .h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.fcard .h b { font: 600 16px var(--display) }
.fcard .h .st { margin-left: auto }
.fcard .t { font: 12.5px var(--mono); color: var(--muted) }
.fcard.group { font: 600 12px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: 16px; border-top: 0 }
.whytxt { font-size: 12.5px; color: var(--muted) }
@media (max-width: 760px) { #freshtable { display: none } .fcards { display: grid } }
.verdict { display: grid; gap: 4px }
.verdict .v { font: 600 24px/1.1 var(--display) }
.verdict .d { font-size: 13.5px; color: var(--muted) }
.s3 { grid-column: span 3 } .s6 { grid-column: span 6 }
@media (max-width: 980px) { .s3 { grid-column: span 6 } .s6 { grid-column: span 12 } }
@media (max-width: 520px) { .s3 { grid-column: span 12 } }
.chart { width: 100%; display: block }
.chart text { font: 11px var(--mono); fill: var(--muted) }
.hbar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; min-width: 60px }
.hbar i { display: block; height: 100%; background: var(--accent) }
.cards { display: grid; gap: 16px; grid-template-columns: repeat(3, minmax(0, 1fr)) }
@media (max-width: 980px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
@media (max-width: 620px) { .cards { grid-template-columns: 1fr } }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px }
.kv > span:nth-child(even) { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere }
.btn { display: inline-block; margin-top: 12px; font: 600 13px var(--body); color: var(--accent); text-decoration: none; border: 1px solid var(--accent); border-radius: 6px; padding: 6px 10px }
.feed { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px }
.feed:first-child { border-top: 0 }
.feed .sub { display: block; font-size: 12.5px; color: var(--muted) }
.top nav.tabs { flex: 1; min-width: 0 }
.warnings { display: flex; gap: 8px; flex-wrap: wrap; padding-block: 6px 8px }
.w { font: 500 13px/1.2 var(--body); padding: 6px 10px; border-radius: 6px; text-decoration: none; color: inherit }
.w.bad { background: var(--bad-soft); color: var(--bad) } .w.warn { background: var(--warn-soft); color: var(--warn) } .w.ok { background: var(--ok-soft); color: var(--ok) }
.w b { font-weight: 600 }
:root { --home: #2b6fd6; --home-soft: #dde8fb }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --home: #6ea2f5; --home-soft: #1b2c4a } }
:root[data-theme="dark"] { --home: #6ea2f5; --home-soft: #1b2c4a }
.pipe { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px }
.chip { font: 500 12.5px/1 var(--body); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer }
.chip.on { background: var(--ink); color: var(--panel); border-color: var(--ink) }
.lanes { overflow-x: auto }
.lanes svg { display: block; min-width: 1100px; width: 100% }
.lanes text { font: 11px var(--mono); fill: var(--muted) }
.lanes .lname { font: 600 12.5px var(--display); fill: var(--ink) }
.lanes .row:hover rect.hit, .lanes .row.sel rect.hit { fill: var(--accent-soft) }
.detail { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; scroll-margin-top: 150px }
.dhead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap }
.dhead b { font: 700 21px/1 var(--display) }
.plist { display: none }
.pitem { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer }
.pitem b { font: 600 15px var(--display) } .pitem .s { font: 12.5px var(--mono); color: var(--muted); grid-column: 1 / 3 }
@media (max-width: 760px) { .detail { position: static } }
/* The Pipeline's timeline (21.10.2026): GitHub's bar above the Tower's, waiting in amber. */
:root { --gh: #7f8c99; --wait: #d9a441 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --gh: #8592a0; --wait: #e3b04f } }
:root[data-theme="dark"] { --gh: #8592a0; --wait: #e3b04f }
.lanes .grp { font: 600 11px var(--display); letter-spacing: .08em; fill: var(--muted) }
.lanes .ours { font: 600 12px var(--mono) }
.lanes .skip { fill: var(--bad); font: 700 12px var(--body) }
.lanes .src { font: 500 9.5px var(--body); fill: var(--gh) }
.legend span.t::before { display: none }
/* The machine band (22.10.2026): waiting with room, its tooltip. */
:root { --room: rgba(214, 69, 69, .16) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --room: rgba(240, 114, 114, .2) } }
:root[data-theme="dark"] { --room: rgba(240, 114, 114, .2) }
.lanes { position: relative }
.btip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  font-size: 12.5px; line-height: 1.45; box-shadow: 0 6px 20px rgba(0,0,0,.25); width: 300px; z-index: 3 }
.btip b { font: 600 13px var(--display) }
/* The bars' popups and the expected ends (22.10.2026; mockup pipeline-progress-popups-2026-10-22). */
.lanes .eta { font: 600 11px var(--mono) }
.bpop { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  width: 380px; font-size: 13px; line-height: 1.4; box-shadow: 0 8px 26px rgba(0,0,0,.28); z-index: 4 }
.bpop .ph { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 8px; align-items: baseline } .bpop .ph b { font: 700 16px/1.15 var(--display) }
.bpop .ptag { font: 600 10.5px/1 var(--body); padding: 3px 6px; border-radius: 4px; text-transform: uppercase; letter-spacing: .04em; background: var(--home-soft); color: var(--home); white-space: nowrap }
.bpop .ptag.wrf { background: var(--wrf-soft); color: var(--wrf) } .bpop .ptag.done { background: var(--ok-soft); color: var(--ok) }
.bpop .ptag.gh { background: var(--line); color: var(--muted) } .bpop .ptag.late { background: var(--warn-soft); color: var(--warn) } .bpop .ptag.bad { background: var(--bad-soft); color: var(--bad) }
.bpop .psub { color: var(--muted); font-size: 12px; margin: 2px 0 6px }
.bpop .pbar { height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; display: flex } .bpop .pbar i { display: block; height: 100% }
.bpop .pkv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin-top: 7px }
.bpop .pkv span:nth-child(odd) { color: var(--muted) } .bpop .pkv span:nth-child(even) { font: 12px var(--mono); text-align: right }
.bpop .pspark { display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--muted) } .bpop .pspark b { font: 500 12px var(--mono); color: var(--ink) }
.bpop .psteps { display: grid; grid-template-columns: 44px auto 1fr; gap: 3px 8px; margin-top: 8px; align-items: baseline }
.bpop .psteps .st { font: 12px var(--mono); color: var(--muted) } .bpop .psteps .sw { font-weight: 600; white-space: nowrap } .bpop .psteps .sd { font: 11.5px var(--mono); color: var(--muted) }
.bpop .pbar i.rest { background: repeating-linear-gradient(45deg, var(--line) 0 4px, transparent 4px 8px) }
.bpop .plog { margin-top: 6px; font: 11px var(--mono); color: var(--muted); background: var(--bg); border-radius: 6px; padding: 5px 7px; overflow-wrap: anywhere } .btip .k { color: var(--muted) } .btip .room { color: var(--bad); font-weight: 600 }
.pstrip { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: baseline }
.pstrip > div { display: flex; gap: 8px; align-items: baseline }
.pstrip .v { font: 600 22px/1 var(--display) } .pstrip .l { font-size: 13px; color: var(--muted) }
.hint { font-size: 13.5px; border-left: 3px solid var(--accent); padding: 6px 10px; background: var(--accent-soft); border-radius: 0 6px 6px 0; margin-top: 10px }
.big { font: 600 28px/1 var(--display) } .big small { font: 500 14px var(--body); color: var(--muted) }
.btn { font: 600 13px var(--body); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--accent); color: var(--accent); background: transparent; cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-block }
.btn.primary { background: var(--accent); color: var(--panel) }
.btn.danger { border-color: var(--bad); color: var(--bad) }
.btn:disabled { opacity: .5 }
.btns { display: flex; gap: 6px; flex-wrap: wrap }
.confirm { border: 1px dashed var(--warn); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; background: var(--warn-soft) }
.form { display: grid; gap: 8px; grid-template-columns: 1fr 1fr }
.form label { font-size: 12.5px; color: var(--muted); display: grid; gap: 4px }
.form input { font: 14px var(--body); padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); min-width: 0 }
.heat { display: grid; grid-template-columns: 150px repeat(24, 1fr); gap: 2px; font: 12px var(--mono); align-items: center }
.heat span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.heat i { height: 13px; border-radius: 2px; display: block }
.job { border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; display: flex; gap: 8px; flex-wrap: wrap }

.subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 10px }
.wgrid label { display: grid; grid-template-columns: 1fr 64px; gap: 6px; align-items: center; font-size: 13px; color: var(--muted) }
.wgrid input, .editor input, .editor select, .editor textarea, .form select, .btns select { font: 14px var(--body); padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); min-width: 0 }
.editor textarea { width: 100%; resize: vertical }
.egrid { display: grid; gap: 14px; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 12px }
@media (max-width: 1050px) { .egrid { grid-template-columns: minmax(0, 1fr) } }
.egroup { display: grid; gap: 8px; align-content: start; border: 1px solid var(--line); border-radius: 8px; padding: 12px }
.egroup.wide { grid-column: 1 / -1 }
.egroup h3 { font: 600 12px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 }
.egroup label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted) }
label.row { display: inline-flex !important; gap: 6px; align-items: center; color: var(--ink) !important; font-size: 13.5px !important }
.ticks { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center }
.ticks > span { font: 600 12px var(--display); color: var(--muted); width: 100%; text-transform: uppercase; letter-spacing: .06em }
.photos { display: flex; flex-wrap: wrap; gap: 10px }
.ph { width: 180px; display: grid; gap: 6px }
.ph img { width: 180px; height: 120px; object-fit: cover; border-radius: 6px; background: var(--line) }
.ph.add { height: 120px; border: 2px dashed var(--line); border-radius: 6px; display: grid; place-items: center; cursor: pointer; color: var(--accent); font-weight: 600 }
.ebar { margin-top: 14px; align-items: center }
.form.four { grid-template-columns: repeat(4, minmax(0, 1fr)) }
@media (max-width: 760px) { .form.four { grid-template-columns: 1fr 1fr } }
.avatar { width: 22px; height: 22px; border-radius: 50%; vertical-align: middle; object-fit: cover }
.st.unknown { background: var(--line); color: var(--muted) }
</style>
<div id="app"><main class="wrap"><p class="empty">Connecting to the Tower…</p></main></div>
<script type="module">
import { html, render, useState, useEffect, useRef } from "https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.module.js";

const GB = (b) => (b / 1e9).toFixed(1);
const MBs = (v) => v >= 20 ? Math.round(v) : v >= 1 ? v.toFixed(1) : v > 0 ? v.toFixed(2) : "0";
const pad = (n) => String(n).padStart(2, "0");
const dur = (s) => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, r = s % 60; return h ? `${h}:${pad(m)}:${pad(r)}` : `${m}:${pad(r)}`; };
const prioClass = (p) => p === 1 ? "p1" : p === 2 ? "p2" : "p3";
let ZONE = "Europe/Riga";
try { ZONE = localStorage.getItem("ops-zone") || ZONE; } catch (e) {}
const clock = (t, sec) => t ? new Date(t * 1000).toLocaleTimeString("en-GB", { timeZone: ZONE, hour: "2-digit", minute: "2-digit", second: sec ? "2-digit" : undefined }) : "–";
const zoneName = () => ZONE === "UTC" ? "UTC" : "Riga";
const base = (u) => { try { const p = new URL(u); const parts = p.pathname.split("/").filter(Boolean); return p.hostname + "/…/" + parts.slice(-2).join("/"); } catch (e) { return u; } };

function Spark({ values, w = 70, h = 18 }) {
  if (!values || values.length < 2) return html`<svg width=${w} height=${h}></svg>`;
  const max = Math.max(...values, 1);
  const d = values.map((v, i) => `${i ? "L" : "M"}${(i / (values.length - 1) * w).toFixed(1)} ${(h - v / max * (h - 2) - 1).toFixed(1)}`).join(" ");
  return html`<svg viewBox="0 0 ${w} ${h}" width=${w} height=${h}><path d=${d} fill="none" stroke="var(--accent)" stroke-width="1.5"/></svg>`;
}

function Top({ f, zone, setZone, tab, fr, cap }) {
  const now = Date.now() / 1000;
  const waitingMem = (f.waiting || []).filter((w) => /^waits for (memory|WRF)/.test(w.why || "")).length;
  const busy = (f.jobs || []).length;
  const stale = f.live_t && now - f.live_t > 180;
  const beatAge = f.beat ? now - f.beat : null;
  const behind = fr && fr.counts ? fr.counts.bad : 0;
  return html`<header class="top"><div class="wrap"><div class="row1">
    <div class="brand"><span class="dot" aria-hidden="true" style=${stale ? "background:var(--bad)" : ""}></span>MeteoGust ops
      <small>${f.host || "…"} · ${(f.live || []).length ? `${f.live.length} live` : "shadow"}</small></div>
    <div class="pills">
      ${behind ? html`<a class="pill bad" href="#freshness" style="text-decoration:none">${behind} model${behind > 1 ? "s" : ""} behind</a>` : null}
      ${f.wrf && f.wrf.running
        ? html`<span class="pill wrf">WRF ${f.wrf.region || ""} running · ${dur(now - (f.wrf.started || now))}</span>`
        : f.wrf && f.wrf.waiting
        ? html`<span class="pill">WRF waiting for GFS · since ${clock(f.wrf.started)}</span>`
        : html`<span class="pill">WRF idle · next ${clock((f.wrf && f.wrf.next || [])[0])}</span>`}
      <span class="pill">${busy} of ${f.slots || "?"} job slots${f.wrf && f.wrf.running ? " (1 big job during WRF)" : ""}</span>
      ${waitingMem ? html`<span class="pill warn">${waitingMem} waiting for memory</span>` : null}
      ${stale ? html`<span class="pill bad">scheduler quiet for ${dur(now - f.live_t)}</span>` : null}
      <span class="pill">heartbeat ${beatAge == null ? "not sent" : dur(beatAge) + " ago"}</span>
    </div>
    <div class="clock"><b>${clock(now, true)}</b> ${zoneName()}
      <button class="tbtn" id="zone" onClick=${() => setZone(zone === "UTC" ? "Europe/Riga" : "UTC")}>show ${zone === "UTC" ? "Riga" : "UTC"}</button></div>
  </div><${Tabs} tab=${tab} fr=${fr} cap=${cap} /></div></header>`;
}

function Machine({ f }) {
  const cores = f.cores || [];
  const total = f.mem_total || 1, used = total - (f.mem_avail || 0);
  const conts = (f.containers || []).filter((c) => c.kind !== "other" || c.mem > 2e8);
  const sum = conts.reduce((a, c) => a + c.mem, 0);
  const segs = [...conts.map((c) => ({ name: c.kind === "wrf" ? "WRF" : c.name, mem: c.mem, color: c.kind === "wrf" ? "var(--wrf)" : c.kind === "job" ? "var(--accent)" : "var(--faint)" })),
    { name: "system and caches", mem: Math.max(used - sum, 0), color: "color-mix(in srgb, var(--faint) 60%, var(--panel))" }];
  const hist = (f.net_hist || []).map((h) => h[1]);
  const max = Math.max(117, ...hist, 1);
  const w = 300, hh = 64;
  const pts = hist.map((v, i) => [hist.length > 1 ? i / (hist.length - 1) * w : 0, hh - v / max * (hh - 4)]);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");
  const limitY = hh - 117 / max * (hh - 4);
  return html`<section class="panel s12" aria-label="The machine"><div class="machine">
    <div><h2>Threads (${cores.length})</h2>
      <div class="cores" style=${`grid-template-columns:repeat(${Math.min(cores.length || 10, 10)},1fr)`}>
        ${cores.map((v) => html`<div class=${"core" + (v < 5 ? " idle" : "")}><i style=${`height:${Math.max(v, 2)}%`}></i></div>`)}
      </div>
      <div class="legend"><span style="--c:var(--accent)">busy share of each thread, last 2 s</span></div></div>
    <div><h2>Memory</h2>
      <div class="memline"><span class="big">${GB(used)} <small>of ${GB(total)} GB</small></span>
        <span class="mono" style="font-size:13px;color:var(--muted)">jobs' budget ${f.budget ? (f.budget / 1000).toFixed(1) : "?"}</span></div>
      <div class="mem" role="img" aria-label="Memory by user">${segs.filter((s) => s.mem > 0).map((s) => html`<div title=${`${s.name} ${GB(s.mem)} GB`} style=${`width:${(s.mem / total * 100).toFixed(2)}%;background:${s.color}`}></div>`)}</div>
      <div class="legend">${segs.filter((s) => s.mem > 1e8).map((s) => html`<span style=${`--c:${s.color}`}>${s.name} ${GB(s.mem)}</span>`)}</div>
      <div class="memnote">Reserved for running jobs: <b class="num">${f.reserved != null ? (f.reserved / 1000).toFixed(1) : "?"} GB</b>${f.wrf && f.wrf.running ? " (WRF's 9 GB off the budget while it runs)" : ""}.</div></div>
    <div class="net"><h2>Network</h2>
      <div class="netnums"><span class="big">${MBs(f.net_in || 0)} <small>MB/s in</small></span><span class="big">${MBs(f.net_out || 0)} <small>MB/s out</small></span></div>
      <svg viewBox="0 0 300 64" preserveAspectRatio="none" aria-label="Download speed, last minutes">
        <line x1="0" x2="300" y1=${limitY} y2=${limitY} stroke="var(--faint)" stroke-dasharray="3 4" stroke-width="1" vector-effect="non-scaling-stroke"/>
        ${hist.length > 1 ? html`<path d=${line + " L300 64 L0 64 Z"} fill="var(--accent-soft)"/><path d=${line} fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>` : null}
      </svg>
      <div class="legend"><span style="--c:var(--accent)">in, last ${Math.round(hist.length * 2 / 60) || "<1"} min</span><span style="--c:var(--faint)">line limit ~117 MB/s</span></div></div>
  </div></section>`;
}

function Log({ job }) {
  const [lines, setLines] = useState([]);
  const box = useRef(null);
  useEffect(() => {
    const es = new EventSource("/api/log?job=" + encodeURIComponent(job));
    const got = [];
    es.addEventListener("line", (e) => { got.push(JSON.parse(e.data).text); if (got.length > 200) got.shift(); setLines([...got]); });
    return () => es.close();
  }, [job]);
  useEffect(() => { if (box.current) box.current.scrollTop = box.current.scrollHeight; }, [lines]);
  return html`<div class="log" ref=${box}>${lines.length ? lines.map((l) => html`<div>${l}</div>`) : html`<div>Reading the log…</div>`}</div>`;
}

function JobCard({ j, now, open, toggle }) {
  const el = j.started ? now - j.started : null;
  const typ = j.typical;
  const pct = el != null && typ ? Math.min(el / (typ * 60), 1) : null;
  const over = el != null && typ && el > typ * 60 * 1.2;
  const d = j.download;
  const speed = j.net_in || 0;
  return html`<div class="job" tabindex="0" onClick=${toggle} onKeyDown=${(e) => e.key === "Enter" && toggle()}>
    <div class="jhead"><span class=${"prio " + prioClass(j.priority)}>P${j.priority}</span><span class="jname">${j.job}</span>
      <span class=${"tag" + (j.live ? " live" : "")}>${j.live ? "live" : "shadow"}</span>
      <span class="jstats"><span><b>${el != null ? dur(el) : "–"}</b></span><span>CPU <b>${j.cpu != null ? j.cpu + "%" : "–"}</b></span><span><b>${j.mem != null ? GB(j.mem) : "–"}</b> GB</span></span></div>
    <div class="what">${j.source ? `source run ${new Date(j.source * 1000).toISOString().slice(8, 13).replace("T", " ")}Z · ` : ""}${typ ? `usually ${typ} min` : "first runs: no usual time yet"}${over ? html` · <b class="warn">running long</b>` : pct != null ? html` · <b>~${Math.round(pct * 100)}% · ends ~${clock(j.started + typ * 60)}</b>` : ""} · plans for ${j.need ? (j.need / 1000).toFixed(1) : "?"} GB</div>
    ${pct != null ? html`<div class="bar"><i class=${over ? "over" : ""} style=${`width:${(pct * 100).toFixed(1)}%`}></i></div>` : null}
    <div class="dl"><span>↓</span><span class="file">${d ? `${d.host} · ${base(d.url)}${d.done ? " · done" : ""}` : "no download right now"}</span>
      <${Spark} values=${j.speeds} /><span class="speed">${MBs(speed)} MB/s</span></div>
    ${open ? html`<${Log} job=${j.job} />` : html`<div class="logline">tap for the live log</div>`}
  </div>`;
}

function WrfCard({ w, now, open, toggle }) {
  return html`<div class="job wrfjob" tabindex="0" onClick=${toggle} onKeyDown=${(e) => e.key === "Enter" && toggle()}>
    <div class="jhead"><span class="prio pw">WRF</span><span class="jname">WRF ${w.region || ""} 1 km</span>
      <span class="jstats"><span><b>${dur(now - (w.started || now))}</b></span><span>CPU <b>${w.cpu != null ? w.cpu + "%" : "–"}</b></span><span><b>${w.mem != null ? GB(w.mem) : "–"}</b> GB</span></span></div>
    <div class="what">${w.box ? `1 km box ${w.box[0]} to ${w.box[1]} UTC · model time ${w.model_time || "–"}` : "preparing (GFS, the boxes)"}${(() => { const x = wrfEnd(w, now); return x ? html` · <b>${Math.round(x.pct * 100)}% · ends ~${clock(x.end)}</b>` : null; })()}</div>
    ${w.progress != null ? html`<div class="bar"><i style=${`width:${(w.progress * 100).toFixed(1)}%`}></i></div>` : null}
    ${open ? html`<${Log} job="wrf" />` : html`<div class="logline">${w.last_line || ""}</div>`}
  </div>`;
}

function Running({ f, now }) {
  const [open, setOpen] = useState(null);
  const t = (k) => () => setOpen(open === k ? null : k);
  const jobs = [...(f.jobs || [])].sort((a, b) => a.priority - b.priority);
  return html`<section class="panel s8" aria-label="Running now"><h2>Running now</h2><div class="jobs">
    ${f.wrf && f.wrf.running ? html`<${WrfCard} w=${f.wrf} now=${now} open=${open === "wrf"} toggle=${t("wrf")} />` : null}
    ${jobs.map((j) => html`<${JobCard} key=${j.job} j=${j} now=${now} open=${open === j.job} toggle=${t(j.job)} />`)}
    ${!jobs.length && !(f.wrf && f.wrf.running) ? html`<p class="empty">Nothing running: every job is waiting for its next run.</p>` : null}
  </div></section>`;
}

function Next({ f }) {
  // During WRF a dozen can wait at once: the first 8 by priority, the rest named in one line.
  const allWaiting = f.waiting || [];
  const waiting = allWaiting.slice(0, 8);
  const moreWaiting = allWaiting.slice(8);
  const next = (f.next || []).filter((n) => n.at).slice(0, 10);
  const later = (f.next || []).filter((n) => !n.at);
  const wnext = (f.wrf && f.wrf.next) || [];
  return html`<section class="panel s4" aria-label="What's next"><h2>Next, and why</h2><div class="next">
    ${waiting.map((w) => html`<div class="nrow"><span class=${"prio " + prioClass(w.priority)}>P${w.priority}</span>
      <span class="n">${w.job}${(w.why || "").startsWith("waits for WRF") ? html`<span class="chip wrf">after WRF</span>` : (w.why || "").startsWith("waits for memory") ? html`<span class="chip mem">memory</span>` : (w.why || "").startsWith("priority 3") ? html`<span class="chip hold">held</span>` : null}</span>
      <span class="t now">due</span><span class="why">${w.source ? w.source + ": " : ""}${w.why}</span></div>`)}
    ${moreWaiting.length ? html`<div class="nrow"><span></span><span class="why" style="grid-column:2/4">Also due and waiting: ${moreWaiting.map((w) => w.job).join(", ")}</span></div>` : null}
    ${next.map((n) => html`<div class="nrow"><span class=${"prio " + prioClass(n.priority)}>P${n.priority}</span><span class="n">${n.job}</span>
      <span class="t">${n.why.startsWith("every") ? "" : "~"}${clock(n.at)}</span><span class="why">${n.why}</span></div>`)}
    ${wnext[0] ? html`<div class="nrow"><span class="prio pw">WRF</span><span class="n">WRF Tarifa</span><span class="t">${clock(wnext[0])}</span>
      <span class="why">From the newest GFS. Job slots halve and their CPU share drops while it runs.</span></div>` : null}
    ${later.length ? html`<div class="nrow"><span></span><span class="why" style="grid-column:2/4">Not known yet: ${later.map((n) => n.job).join(", ")}</span></div>` : null}
  </div></section>`;
}

function Timeline({ s, now }) {
  if (!s || !s.items) return html`<section class="panel s12"><h2>Timeline</h2><p class="empty">Loading…</p></section>`;
  const X0 = 150, X1 = 1225, top = 38, lh = 30;
  const t0 = s.from, t1 = s.to;
  const x = (t) => X0 + (t - t0) / (t1 - t0) * (X1 - X0);
  const lanes = s.lanes;
  const hours = [];
  const first = Math.ceil(t0 / 3600) * 3600;
  for (let t = first; t <= t1; t += 3600) hours.push(t);
  const color = (k) => k === "wrf" || k === "wrfplan" ? "var(--wrf)" : k === "bad" ? "var(--bad)" : k === "plan" ? "var(--line)" : "var(--accent)";
  const H = top + lanes.length * lh + 24;
  return html`<section class="panel s12" aria-label="Timeline"><h2>Last 12 hours and next 6 · ${zoneName()} time</h2>
    <div class="tlwrap"><svg class="tl" viewBox="0 0 1240 ${H}" role="img" aria-label="Timeline of job runs">
      ${hours.map((t, i) => html`<line x1=${x(t)} x2=${x(t)} y1=${top - 6} y2=${top + lanes.length * lh} stroke="var(--line)" stroke-width="1"/>
        ${i % 2 === 0 ? html`<text x=${x(t)} y=${top - 12} text-anchor="middle">${clock(t)}</text>` : null}`)}
      ${(s.arrivals || []).map((a) => html`<path d=${`M${x(a.t) - 4} ${top - 4} L${x(a.t) + 4} ${top - 4} L${x(a.t)} ${top + 2} Z`} fill="var(--muted)"><title>${a.label} arrived ${clock(a.t)}</title></path>`)}
      ${lanes.map((name, i) => html`<text class="lane" x="0" y=${top + i * lh + 19}>${name}</text>`)}
      ${s.items.map((it) => {
        const i = lanes.indexOf(it.lane); if (i < 0) return null;
        const xa = x(Math.max(it.a, t0)), xb = Math.max(x(Math.min(it.b, t1)), xa + 3);
        return html`<rect x=${xa.toFixed(1)} y=${top + i * lh + 7} width=${(xb - xa).toFixed(1)} height="16" rx="3" fill=${it.lane === "WRF" && it.kind === "run" ? "var(--wrf)" : color(it.kind)} opacity=${it.kind === "wrfplan" ? 0.35 : 1}
          stroke=${it.kind === "run" ? "var(--ink)" : "none"} stroke-width="1.5"><title>${it.job} ${clock(it.a)}–${clock(it.b)}</title></rect>`;
      })}
      <line x1=${x(now)} x2=${x(now)} y1=${top - 8} y2=${top + lanes.length * lh + 4} stroke="var(--warn)" stroke-width="2"/>
      <text x=${x(now) + 6} y=${top + lanes.length * lh + 16} style="fill:var(--warn)">now ${clock(now)}</text>
    </svg></div>
    <div class="legend"><span style="--c:var(--accent)">ran</span><span style="--c:var(--bad)">failed</span><span style="--c:var(--wrf)">WRF</span><span style="--c:var(--line)">expected</span><span>▾ a model's new run complete</span></div>
  </section>`;
}

function Sources({ f, s }) {
  const hosts = (s && s.hosts) || {};
  const now = f.sources_now || {};
  const names = [...new Set([...Object.keys(hosts), ...Object.keys(now)])]
    .sort((a, b) => ((hosts[b] || {}).bytes || 0) - ((hosts[a] || {}).bytes || 0));
  return html`<section class="panel s5" aria-label="Downloads by source"><h2>Downloads by source · today (UTC)</h2>
    ${names.length ? html`<div class="tablewrap"><table><thead><tr><th>Source</th><th class="r">Now</th><th class="r">Best today</th><th class="r">Today</th></tr></thead>
      <tbody>${names.map((n) => html`<tr><td>${n}</td><td class="r num">${MBs((now[n] || 0) / 1e6)} MB/s</td>
        <td class="r num">${(hosts[n] || {}).best ? MBs(hosts[n].best / 1e6) + " MB/s" : "–"}</td><td class="r num">${GB((hosts[n] || {}).bytes || 0)} GB</td></tr>`)}</tbody></table></div>`
      : html`<p class="empty">No downloads reported yet today.</p>`}
  </section>`;
}

function Runs({ s }) {
  const runs = ((s && s.runs) || []).slice(0, 12);
  return html`<section class="panel s7" aria-label="Recent runs"><h2>Recent runs</h2>
    ${runs.length ? html`<div class="tablewrap"><table><thead><tr><th>Job</th><th>Ended</th><th class="r">Took</th><th class="r">On GitHub</th><th>Result</th></tr></thead>
      <tbody>${runs.map((r) => {
        const factor = r.github && r.took ? r.github / r.took : null;
        const ok = r.exit === 0;
        const why = r.exit === -9 || r.exit === 137 || r.exit === 247 ? "stopped: out of memory" : `stopped (exit ${r.exit})`;
        return html`<tr><td>${r.job}</td><td class="num">${clock(r.end)}</td><td class="r num">${r.took} min</td>
          <td class="r num">${r.github ? html`${r.github} min ${factor >= 1.15 ? html`<span class="faster">${factor.toFixed(1)}×</span>` : factor < 0.87 ? html`<span class="slower">slower</span>` : ""}` : "–"}</td>
          <td class=${ok ? "ok" : "bad"}>${ok ? "done" : why}${r.peak_mb ? ` · ${(r.peak_mb / 1000).toFixed(1)} GB` : ""}${r.net_mb ? ` · ${(r.net_mb / 1000).toFixed(1)} GB in` : ""}</td></tr>`;
      })}</tbody></table></div>` : html`<p class="empty">No runs recorded yet.</p>`}
  </section>`;
}

// MARK: v2 tabs (the owner, 21.10.2026: Freshness first, then Now, Capacity, Admin; docs/mockups/ops-panel-v2-2026-10-21.html)

const TABS = ["freshness", "now", "capacity", "admin"];
const runZ = (t) => t ? new Date(t * 1000).toISOString().slice(11, 13) + "Z" : "–";
const dayRunZ = (t, ref) => {
  if (!t) return "–";
  const d = new Date(t * 1000).toISOString();
  return (ref && Math.abs(ref - t) > 20 * 3600 ? d.slice(8, 10) + " " : "") + d.slice(11, 13) + "Z";
};
const hrs = (s) => s == null ? "–" : s >= 3600 ? (s / 3600).toFixed(1) + " h" : Math.round(s / 60) + " min";
const STATUS = { ok: "on time", proc: "processing", wait: "due", bad: "behind", unknown: "no record" };

function Tabs({ tab, fr, cap }) {
  const bad = fr && fr.counts ? fr.counts.bad : 0;
  const capWarn = cap && (cap.mem_full_h > 1 || cap.waited_h > 2);
  return html`<nav class="tabs" aria-label="Sections">
    ${TABS.map((t) => html`<a href=${"#" + t} class=${tab === t ? "on" : ""}>${t[0].toUpperCase() + t.slice(1)}
      ${t === "freshness" && bad ? html`<span class="badge">${bad}</span>` : null}
      ${t === "capacity" && capWarn ? html`<span class="badge warn">!</span>` : null}</a>`)}
  </nav>`;
}

function FreshStrip({ row, now }) {
  const w = 260, h = 22, from = now - 24 * 3600;
  const x = (t) => Math.max(0, Math.min(w, (t - from) / (24 * 3600) * w));
  const allow = Math.max((row.usual_ours || 3 * 3600) - (row.usual_maker || 0), 1800) * 1.5;
  const strip = row.strip || [];
  return html`<svg class="strip" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <line x1="0" x2=${w} y1=${h / 2} y2=${h / 2} stroke="var(--line)"/>
    ${strip.map(([run, done, pub], i) => {
      const last = i === strip.length - 1;
      const end = pub || (last ? now : Math.min(now, done + allow * 2));
      const color = pub ? (pub - done <= allow ? "var(--ok)" : "var(--warn)") : last ? "var(--accent)" : "var(--bad)";
      const a = x(done), b = x(end);
      return html`<rect x=${a.toFixed(1)} y=${h / 2 - 4} width=${Math.max(b - a, 2).toFixed(1)} height="8" rx="2" fill=${color}><title>${runZ(run)}: complete ${clock(done)}, ours ${pub ? clock(pub) : "not yet"}</title></rect>`;
    })}
    <line x1=${w - 1} x2=${w - 1} y1="2" y2=${h - 2} stroke="var(--warn)" stroke-width="2"/>
  </svg>`;
}

function behindText(r) {
  if (!r.behind_runs) return "–";
  return `${r.behind_runs} run${r.behind_runs > 1 ? "s" : ""}${r.waited != null ? " · " + hrs(r.waited) : ""}`;
}

function usualText(r) {
  const m = r.usual_maker != null ? `maker +${hrs(r.usual_maker)}` : null;
  const o = r.usual_ours != null ? `ours +${hrs(r.usual_ours)}` : null;
  return [m, o].filter(Boolean).join(" · ") || "–";
}

function oursText(r) {
  const both = r.ours_spots && r.ours_map && r.ours_spots !== r.ours_map;
  return both ? `spots ${runZ(r.ours_spots)} · map ${runZ(r.ours_map)}` : "";
}

function Freshness({ fr, now }) {
  if (!fr || !fr.rows) return html`<p class="empty">Reading the makers' and our runs…</p>`;
  const groups = [];
  fr.rows.forEach((r) => { if (!groups.length || groups[groups.length - 1].name !== r.group) groups.push({ name: r.group, rows: [] }); groups[groups.length - 1].rows.push(r); });
  const c = fr.counts || {};
  return html`<div class="grid">
    <div class="panel s12"><div class="ftiles">
      <div class="ftile ok"><div class="v">${c.ok || 0}</div><div class="l">on time: our newest run is the maker's newest</div></div>
      <div class="ftile proc"><div class="v">${c.proc || 0}</div><div class="l">processing: a newer run is being made now</div></div>
      <div class="ftile wait"><div class="v">${c.wait || 0}</div><div class="l">due: a newer run is out, ours within its usual lag or queued</div></div>
      <div class="ftile bad"><div class="v">${c.bad || 0}</div><div class="l">behind: a newer run sits unprocessed past its usual lag</div></div>
    </div></div>
    <div class="panel s12"><h2>Each model: the maker's newest run against ours · ${zoneName()} time</h2>
      <div class="fcards">${groups.map((g) => html`<div class="fcard group">${g.name}</div>${g.rows.map((r) => html`<div class="fcard">
        <div class="h"><b>${r.label}</b><span class=${"where" + (r.where === "Home" ? " home" : "")}>${r.where}</span>
          <span class=${"st " + r.status}>${STATUS[r.status]}${r.behind_runs ? " · " + behindText(r) : ""}</span></div>
        <div class="t">maker ${dayRunZ(r.maker_run, now)}${r.maker_done ? " " + clock(r.maker_done) : ""} · ours ${dayRunZ(r.ours, now)}${r.published ? " " + clock(r.published) : ""}</div>
        ${r.processing || oursText(r) ? html`<div class="whytxt">${[r.processing, oursText(r)].filter(Boolean).join(" · ")}</div>` : null}</div>`)}`)}</div>
      <div class="tablewrap" id="freshtable"><table class="fresh-table">
        <thead><tr><th>Model</th><th>Runs</th><th>Maker's newest</th><th>Ours, published</th><th>Status</th><th class="r">Behind</th><th>Usual, from the run's start</th><th>Last 24 h: maker complete → ours</th></tr></thead>
        <tbody>${groups.map((g) => html`<tr class="group"><td colspan="8">${g.name}</td></tr>${g.rows.map((r) => html`<tr>
          <td><b>${r.label}</b>${r.processing ? html`<span class="sub">${r.processing}</span>` : null}</td>
          <td class="whytxt">${r.every === 1 ? "hourly" : "every " + r.every + " h"}</td>
          <td class="num">${dayRunZ(r.maker_run, now)}<span class="sub">${r.maker_done ? "complete " + clock(r.maker_done) : r.maker_run ? "" : "not in Open-Meteo's record"}</span></td>
          <td class="num">${dayRunZ(r.ours, now)}<span class="sub">${r.published ? clock(r.published) : ""}<span class=${"where" + (r.where === "Home" ? " home" : "")}>${r.where}</span>${oursText(r) ? html`<br/>${oursText(r)}` : null}</span></td>
          <td><span class=${"st " + r.status}>${STATUS[r.status]}</span></td>
          <td class="r num" style=${r.status === "bad" ? "color:var(--bad)" : ""}>${behindText(r)}</td>
          <td class="num whytxt">${usualText(r)}</td>
          <td><${FreshStrip} row=${r} now=${now} /></td></tr>`)}`)}</tbody></table></div>
      <div class="legend"><span style="--c:var(--ok)">published within its usual lag</span><span style="--c:var(--warn)">later than usual</span><span style="--c:var(--bad)">not published</span><span style="--c:var(--accent)">in progress</span></div>
      <p class="note">Maker's newest: Open-Meteo's open-data record (the makers' release or a little after), at the run hours our job takes. Ours: the spot forecasts' and the map's newest run, the older of the two. "Usual" is from the run's start: how long the maker takes, and how long until ours is published. The strips fill in from 21.10.2026 (the panel's own record).</p>
    </div>
    <div class="panel s12"><h2>Products riders see, made from our sets</h2>
      <div class="tablewrap"><table><thead><tr><th>Product</th><th>Made</th><th>Inputs newer since</th><th>Now</th></tr></thead>
      <tbody>${(fr.products || []).map((p) => html`<tr><td><b>${p.label}</b></td><td class="num">${p.updated ? clock(p.updated) + " · " + hrs(now - p.updated) + " ago" : "–"}</td>
        <td class="whytxt">${p.newer_inputs.length ? p.newer_inputs.length + ": " + p.newer_inputs.join(", ") : "none"}</td><td class="whytxt">${p.processing || ""}</td></tr>`)}</tbody></table></div>
    </div>
  </div>`;
}

function Capacity({ cap, now }) {
  if (!cap || !cap.jobs) return html`<p class="empty">Reading the runner's records…</p>`;
  const target = 5000;
  const big = cap.biggest || { job: "–", peak_mb: 0 };
  const fits = big.peak_mb <= target;
  const hoursSince = cap.samples_from ? (now - cap.samples_from) / 3600 : 0;
  const X0 = 40, X1 = 1160, Y0 = 20, Y1 = 190, bw = (X1 - X0) / 24;
  const maxWait = Math.max(5, ...cap.by_hour.map((h) => h.waiting || 0));
  const total = cap.jobs.reduce((a, j) => a + j.cpu_h, 0) || 1;
  return html`<div class="grid">
    ${hoursSince < 23 ? html`<p class="note s12" style="margin:0">The records reach back ${hoursSince.toFixed(0)} h; the waits are counted from 21.10.2026 evening on (when the runner began recording when a job became due).</p>` : null}
    <div class="panel s3"><div class="verdict"><h2>CPU</h2><div class="v">${cap.cpu_day != null ? cap.cpu_day + "%" : "–"} <small style="font:500 14px var(--body);color:var(--muted)">of the day</small></div>
      <div class="d">All ${cap.threads} threads together; peak ${cap.cpu_peak != null ? cap.cpu_peak + "%" : "–"} in a minute.</div></div></div>
    <div class="panel s3"><div class="verdict"><h2>Memory</h2><div class="v" style=${cap.mem_full_h > 1 ? "color:var(--warn)" : ""}>${cap.mem_full_h} h full</div>
      <div class="d">Minutes with under 1.5 GB free, added up.</div></div></div>
    <div class="panel s3"><div class="verdict"><h2>Waiting</h2><div class="v" style=${cap.waited_h > 2 ? "color:var(--warn)" : ""}>${cap.waited_h} h</div>
      <div class="d">Due jobs' waits added up; ${cap.long_waits} over 15 min.</div></div></div>
    <div class="panel s3"><div class="verdict"><h2>Mac mini (16 GB)</h2><div class="v" style=${fits ? "color:var(--ok)" : "color:var(--bad)"}>${fits ? "Fits" : "Not yet"}</div>
      <div class="d">Jobs used ${cap.cpu_h_day} CPU hours (the Mac has about 150-170 a day). Biggest: ${big.job} ${(big.peak_mb / 1000).toFixed(1)} GB, target 5 beside WRF.</div></div></div>
    <div class="panel s12"><h2>The machine through the day · CPU by who, jobs waiting · Riga time</h2>
      <svg class="chart" viewBox="0 0 1200 230" role="img" aria-label="CPU use by hour and jobs waiting">
        ${[0, 50, 100].map((v) => { const y = Y1 - (Y1 - Y0) * v / 100; return html`<line x1=${X0} x2=${X1} y1=${y} y2=${y} stroke="var(--line)"/><text x=${X0 - 6} y=${y + 4} text-anchor="end">${v}%</text>`; })}
        ${cap.by_hour.map((h) => {
          const x = X0 + h.h * bw + 3, w = bw - 6;
          const hw = (Y1 - Y0) * Math.min((h.wrf || 0) / 100, 1), hj = (Y1 - Y0) * Math.min((h.jobs || 0) / 100, 1);
          return html`${h.free_min != null && h.free_min < 1500 ? html`<rect x=${x} y=${Y1 + 6} width=${w} height="5" rx="2" fill="var(--bad)"/>` : null}
            <rect x=${x} y=${Y1 - hw} width=${w} height=${hw} fill="var(--wrf)"/>
            <rect x=${x} y=${Y1 - hw - hj} width=${w} height=${hj} rx="2" fill="var(--accent)"><title>${pad(h.h)}:00 WRF ${h.wrf ?? "–"}% jobs ${h.jobs ?? "–"}%, ${h.waiting} job-hours waiting</title></rect>
            ${h.h % 3 === 0 ? html`<text x=${x + w / 2} y=${Y1 + 26} text-anchor="middle">${pad(h.h)}:00</text>` : null}`;
        })}
        <path d=${cap.by_hour.map((h, i) => `${i ? "L" : "M"}${(X0 + h.h * bw + bw / 2).toFixed(1)} ${(Y1 - (Y1 - Y0) * (h.waiting || 0) / maxWait).toFixed(1)}`).join(" ")} fill="none" stroke="var(--warn)" stroke-width="2"/>
        <text x=${X1 + 8} y=${Y0 + 4}>${maxWait.toFixed(0)}</text><text x=${X1 + 8} y=${Y1 + 4}>0</text>
      </svg>
      <div class="legend"><span style="--c:var(--wrf)">WRF</span><span style="--c:var(--accent)">jobs</span><span style="--c:var(--warn)">job-hours waiting (right scale)</span><span style="--c:var(--bad)">memory full that hour</span></div></div>
    <div class="panel s12"><h2>Each job, last 24 hours · sorted by CPU</h2>
      <div class="tablewrap"><table style="min-width:900px"><thead><tr><th>Job</th><th class="r">Runs</th><th class="r">CPU hours</th><th>Share of the CPU</th><th class="r">Time running</th><th class="r">Peak memory</th><th class="r">Downloaded</th><th class="r">Waited</th><th class="r">Longest wait</th><th class="r">Failed</th></tr></thead>
      <tbody>${cap.jobs.map((j) => html`<tr><td><b>${j.job}</b></td><td class="r num">${j.runs}</td><td class="r num">${j.cpu_h.toFixed(1)}</td>
        <td><div class="hbar"><i style=${`width:${Math.min(j.cpu_h / total * 250, 100).toFixed(0)}%`}></i></div></td>
        <td class="r num">${j.wall_h.toFixed(1)} h</td><td class="r num">${(j.peak_mb / 1000).toFixed(1)} GB</td><td class="r num">${j.net_gb.toFixed(1)} GB</td>
        <td class="r num" style=${j.waited_h >= 1 ? "color:var(--warn)" : ""}>${j.waited_h.toFixed(1)} h</td><td class="r num">${hrs(j.longest_wait)}</td>
        <td class="r num" style=${j.failed ? "color:var(--bad)" : ""}>${j.failed || ""}</td></tr>`)}</tbody></table></div>
      <p class="note">CPU hours: thread-hours used (one thread busy for an hour is 1). Waited: from the minute a job was due to its start; this is where the machine runs short. Shadow runs make whole sets, so they show more work than the live jobs will.</p></div>
  </div>`;
}

// admin.meteogust.com's overview, read-only (its /api/overview through the service token on the Tower).
const ago = (t, now) => t ? hrs(now - t) + " ago" : "–";
function KV({ rows }) {
  return html`<div class="kv">${rows.filter(Boolean).map(([k, v, style]) => html`<span>${k}</span><span style=${style || ""}>${v}</span>`)}</div>`;
}

function AdminCards({ o, now }) {
  const cards = [];
  // The helper's hourly job on GitHub (update.yml): its last 24 hours.
  const runs = (o.runs || []).filter((r) => r.started >= now - 86400);
  // Its results are "published", "nothing new" or "failed" (and the steps that failed in "failed").
  const failed = runs.filter((r) => r.result === "failed" || (r.failed || []).length);
  const published = runs.filter((r) => r.result === "published").length;
  const lastFail = failed.sort((a, b) => b.started - a.started)[0];
  const h = o.helper || {};
  cards.push(html`<div class="panel"><h2>Helper's hourly job · 24 h</h2><${KV} rows=${[
    ["Runs", `${runs.length} · ${published} published, ${runs.length - published - failed.length} nothing new`], ["Failed", failed.length, failed.length ? "color:var(--bad)" : ""],
    lastFail ? ["Last failure", `${clock(lastFail.started)}${(lastFail.failed || []).length ? " · " + lastFail.failed.slice(0, 3).join(", ") : ""}`] : null,
    h.running ? ["Running now", `${h.running.step || "…"} · since ${clock(h.running.started)}`] : ["Last finished", ago(h.lastEnd || h.lastStart, now)],
    h.queued ? ["Queued", h.queued] : null]} /></div>`);
  // Stations.
  const st = o.stations || {};
  cards.push(html`<div class="panel"><h2>Stations</h2><${KV} rows=${[
    ["Fresh in 20 min", `${st.fresh ?? "–"} of ${st.total ?? "–"}`, st.total && st.fresh < st.total / 2 ? "color:var(--bad)" : ""],
    ["Newest reading", ago(st.newest, now)],
    ...(st.stale || []).slice(0, 5).map((x) => [x.station, "silent " + ago(x.time, now)])]} />
    <a class="btn" href="https://admin.meteogust.com/#stations">Stations in admin ↗</a></div>`);
  // Ours against Open-Meteo on the same run (the first 48 hours): the biggest differences.
  const ours = ((o.ours || {}).rows || []).filter((r) => r.lead === "0-48" && r.n >= 50).sort((a, b) => b.mae - a.mae);
  cards.push(html`<div class="panel"><h2>Our data vs Open-Meteo · same run, 0-48 h</h2><${KV} rows=${[
    ...ours.slice(0, 6).map((r) => [r.model.replace("#temp", " air"), `${r.mae.toFixed(2)} ${r.model.endsWith("#temp") ? "°C" : "m/s"} · ${r.n.toLocaleString("en")} h`,
      r.mae > (r.model.endsWith("#temp") ? 0.5 : 0.3) ? "color:var(--warn)" : ""]),
    ours.length ? null : ["Compared", "no rows yet"]]} /></div>`);
  // Open-Meteo calls (admins' "vs OM" and the server's comparisons): today.
  const om = o.openMeteo || [];
  const today = Math.max(0, ...om.map((x) => x.day));
  const todays = om.filter((x) => x.day === today);
  const sum = (k) => todays.reduce((a, x) => a + (x[k] || 0), 0);
  const refused = todays.filter((x) => x.kind.includes("refused")).reduce((a, x) => a + x.hits, 0);
  cards.push(html`<div class="panel"><h2>Open-Meteo relay · today</h2><${KV} rows=${[
    ["Requests", sum("hits").toLocaleString("en")], ["Fetched from Open-Meteo", sum("fetches").toLocaleString("en")],
    ["Weight (counts toward the cap)", sum("weight").toLocaleString("en")], refused ? ["Refused", refused, "color:var(--warn)"] : null]} /></div>`);
  // Crashes, 30 days.
  const cr = o.crashes || {};
  const groups = cr.groups || [];
  const newest = groups.slice().sort((a, b) => b.last - a.last)[0];
  cards.push(html`<div class="panel"><h2>Crashes · 30 days</h2><${KV} rows=${[
    ["iPhone", groups.filter((g) => g.platform === "ios").reduce((a, g) => a + g.n, 0)],
    ["Android", groups.filter((g) => g.platform !== "ios").reduce((a, g) => a + g.n, 0)],
    ["Kinds", groups.length],
    newest ? ["Newest", `${ago(newest.last, now)} · ${(newest.summary || newest.kind || "").slice(0, 40)}`] : null]} /></div>`);
  // Rain and wind alerts.
  const al = o.alerts || {};
  const sent = al.sent || [];
  cards.push(html`<div class="panel"><h2>Rain and wind alerts</h2><${KV} rows=${[
    ["Rain alerts", `${(al.rain || {}).phones ?? 0} phones · ${(al.rain || {}).places ?? 0} places`],
    ["Wind alerts", `${(al.wind || {}).phones ?? 0} phones · ${(al.wind || {}).spots ?? 0} spots`],
    ...sent.map((x) => [`Sent today (${x.kind})`, `${x.ok}${x.failed ? " · " + x.failed + " failed" : ""}`, x.failed ? "color:var(--warn)" : ""]),
    al.last ? ["Last alert", `${ago(al.last.time, now)} · ${al.last.kind} · ${al.last.place}`] : null,
    (al.errors || []).length ? ["Errors (recent)", `${al.errors.length} · last: ${al.errors[0].reason}`.slice(0, 60), "color:var(--warn)"] : null]} /></div>`);
  // Builds.
  const b = o.builds || {};
  const nb = (b.builds || [])[0], nr = (b.runs || [])[0];
  cards.push(html`<div class="panel"><h2>Builds</h2><${KV} rows=${[
    nb ? ["Newest build", `${nb.number} · ${nb.result || nb.progress || ""}`] : null,
    nr ? ["Last workflow", `${nr.title.slice(0, 32)} · ${nr.conclusion || nr.status}`] : null,
    nr ? ["Started", ago(nr.created, now)] : null]} />
    <a class="btn" href="https://admin.meteogust.com/">Builds in admin ↗</a></div>`);
  // Pushes, the last day.
  const pushes = o.pushes || [];
  const pday = Math.max(0, ...pushes.map((x) => x.day));
  const pt = pushes.filter((x) => x.day === pday);
  if (pt.length) cards.push(html`<div class="panel"><h2>Pushes · last day</h2><${KV} rows=${pt.map((x) => [x.kind, `${x.ok} sent${x.failed ? " · " + x.failed + " failed" : ""}`, x.failed ? "color:var(--warn)" : ""])} /></div>`);
  // The station collector's own state.
  cards.push(html`<div class="panel"><h2>Collector</h2><${KV} rows=${(o.collector || []).map((c) => {
    const v = c.value, k = c.key.replace(/_/g, " ").replace(/^windguru/, "source");
    const asTime = typeof v === "number" && v > 1.5e9 && v < 2.5e9;
    return [k, asTime ? ago(v, now) : String(v)];
  })} /></div>`);
  return cards;
}

function Admin({ ad, now }) {
  if (!ad || !ad.feeds) return html`<p class="empty">Reading the feeds…</p>`;
  const late = ad.feeds.filter((f) => f.late).length;
  return html`<p class="note" style="margin:0 0 12px">admin.meteogust.com's data, read-only, every minute while open. Changes (approve a spot, add a station, start a build) stay on <a href="https://admin.meteogust.com/" style="color:var(--accent)">admin.meteogust.com</a>, which also keeps working when home is down.</p>
    <div class="cards">
      <div class="panel"><h2>Feeds and alerts · ${late ? late + " late" : "all fine"}</h2>
        ${ad.feeds.map((f) => html`<div class="feed"><span>${f.name}<span class="sub">${f.usual}</span></span><span class="num">${f.age != null ? hrs(f.age) + " ago" : "not found"}</span>
          <span class=${"st " + (f.late ? "bad" : "ok")}>${f.late ? "late" : "fine"}</span></div>`)}
        <a class="btn" href="https://admin.meteogust.com/">Alert settings in admin ↗</a></div>
      ${ad.error === "token" ? html`<div class="panel"><h2>The rest of admin's overview</h2>
          <p class="note">Needs the admin service token on the Tower: add <b>SHOREWIND_ADMIN_ID</b> and <b>SHOREWIND_ADMIN_SECRET</b> to /root/.meteogust.env.</p></div>`
        : ad.error ? html`<div class="panel"><h2>Admin's overview</h2><p class="note">${ad.error}</p></div>`
        : ad.overview ? html`<${AdminCards} o=${ad.overview} now=${now} />` : null}
    </div>`;
}

function NowTab({ f, s, now }) {
  return html`<div class="grid">
      <${Machine} f=${f} />
      <${Running} f=${f} now=${now} />

}

async function adminGet(path) {
  const r = await fetch("/admin/api/" + path, { cache: "no-store" });
  if (!r.ok) throw new Error((await r.text()).slice(0, 200));
  return r.json();
}
async function adminPost(path, body) {
  const r = await fetch("/admin/api/" + path, { method: "POST", headers: { "content-type": "application/json", "x-shorewind-admin": "1" }, body: JSON.stringify(body) });
  const text = await r.text();
  let data = {};
  try { data = JSON.parse(text); } catch (e) { data = { error: text.slice(0, 200) }; }
  if (!r.ok || data.error) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

// A button that asks once more before it acts; shows what came back.
function ActButton({ label, ask, run, primary, danger }) {
  const [state, setState] = useState("idle");
  const [msg, setMsg] = useState("");
  const go = async () => {
    if (state === "idle") { setState("ask"); return; }
    setState("busy");
    try { const d = await run(); setMsg(d && d.ok === false ? "not done" : "done"); setState("done"); }
    catch (e) { setMsg(String(e.message || e)); setState("error"); }
  };
  return html`<span style="display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap">
    <button class=${"btn" + (primary ? " primary" : "") + (danger ? " danger" : "")} onClick=${go} disabled=${state === "busy"}>
      ${state === "ask" ? (ask || "Sure? Click again") : state === "busy" ? "…" : label}</button>
    ${state === "ask" ? html`<button class="btn" onClick=${() => setState("idle")}>Cancel</button>` : null}
    ${msg ? html`<span class="whytxt" style=${state === "error" ? "color:var(--bad)" : ""}>${msg}</span>` : null}</span>`;
}

function Nav({ sec }) {
  return html`<nav class="tabs" aria-label="Sections">
    ${SECTIONS.map(([k, label]) => html`<a href=${"#" + k} class=${sec === k ? "on" : ""}>${label}</a>`)}
    <a href="/admin/" title="admin.meteogust.com's own page, served from home">Full admin ↗</a></nav>`;
}

function warningsList({ f, fr, ad, spots, now }) {
  const out = [];
  for (const r of (fr && fr.rows) || []) if (r.status === "bad") out.push(["bad", r.label, `${r.behind_runs} run${r.behind_runs > 1 ? "s" : ""} behind${r.waited ? " · " + hrs(r.waited) : ""}`, "#pipeline"]);
  for (const x of (ad && ad.feeds) || []) if (x.late) out.push(["bad", x.name, x.age != null ? "late · " + hrs(x.age) : "not found", "#pipeline"]);
  const o = ad && ad.overview;
  if (o) {
    const over = ((o.ours || {}).rows || []).filter((r) => r.lead === "0-48" && r.n >= 100 && r.mae > (r.model.endsWith("#temp") ? 0.5 : 0.3));
    if (over.length) out.push(["warn", "Ours vs Open-Meteo", `${over.length} over the limit`, "#quality"]);
    const crash = ((o.crashes || {}).groups || []).filter((g) => now - g.last < 3 * 3600).sort((a, b) => b.last - a.last)[0];
    if (crash) out.push(["warn", "Crash", `${crash.kind || crash.summary || ""} · ${crash.platform} · ${hrs(now - crash.last)} ago`, "#app"]);
    const failed = ((o.alerts || {}).sent || []).reduce((a, s) => a + (s.failed || 0), 0);
    if (failed) out.push(["warn", "Alerts", `${failed} pushes failed today`, "#app"]);
    const st = o.stations || {};
    if (st.total && st.fresh < st.total * 0.8) out.push(["warn", "Stations", `${st.fresh} of ${st.total} fresh`, "#stations"]);
  }
  if (spots && (spots.pending || []).length) out.push(["warn", "Spots", `${spots.pending.length} waiting for review`, "#app"]);
  if (f && f.live_t && now - f.live_t > 180) out.push(["bad", "Runner", `quiet for ${dur(now - f.live_t)}`, "#machine"]);
  if (f && f.beat && now - f.beat > 1200) out.push(["bad", "Heartbeat", `${dur(now - f.beat)} old`, "#machine"]);
  return out;
}

function Warnings(props) {
  const { f, ad, now } = props;
  const list = warningsList(props);
  const fine = ((ad && ad.feeds) || []).filter((x) => !x.late).length;
  return html`<div class="warnings">
    ${list.map(([k, a, b, href]) => html`<a class=${"w " + k} href=${href}><b>${a}</b> ${b}</a>`)}
    <a class="w ok" href="#machine">${fine} feeds fine · ${(f.live || []).length} live at home · ${f.wrf && f.wrf.running ? "WRF running" : f.wrf && f.wrf.waiting ? "WRF waiting for GFS" : "WRF next " + clock((f.wrf && f.wrf.next || [])[0])} · heartbeat ${f.beat ? dur(now - f.beat) : "–"}</a>
  </div>`;
}

function TopBar(props) {
  const { f, zone, setZone, sec } = props;

  const stale = f.live_t && now - f.live_t > 180;

  </div><${Warnings} ...${props} now=${now} /></div></header>`;

const SET_SRC = { metnordic: ["metno_nordic_pp", "regional.yml"], "metnordic-wx": ["metno_nordic_pp", "regional.yml"],

  "icon-ch2": ["meteoswiss_icon_ch2", "bucket.yml"], arome25: ["meteofrance_arome_france0025", "bucket.yml"],
  "knmi-eu": ["knmi_harmonie_arome_europe", "bucket.yml"], aladin: [null, "update.yml"],
  "icon-eu": ["dwd_icon_eu", "world.yml", "icon-eu"], "icon-eu-wx": ["dwd_icon_eu", "world.yml", "icon-eu"], "icon-eu-steer": ["dwd_icon_eu", "world.yml", "icon-eu"],
  ecmwf: ["ecmwf_ifs", "world.yml", "ecmwf"], gfs: ["ncep_gfs025", "world.yml", "gfs"], icon: ["dwd_icon", "world.yml", "icon"],
  gdps: ["cmc_gem_gdps_15km", "world.yml", "gdps"], ewam: ["dwd_ewam", "world.yml", "ewam"], "ecmwf-waves": ["ecmwf_wam", "world.yml", "ecmwf-waves"],
  mix: [null, "mix.yml"], "mix-world": [null, "mix-world.yml"], "mix-wx": [null, "weather-mix.yml"], "mix-world-wx": [null, "weather-mix.yml"],
  chance: [null, "chance.yml"], sea: [null, "sea.yml"], waves: [null, "waves.yml"], water: [null, "update.yml"], "wrf-tarifa": ["ncep_gfs025", null] };
// The model each home job watches (runner/jobs.py's watch).
const JOB_WATCH = { "regional-wind": "metno_nordic_pp", "regional-weather": "metno_nordic_pp", "nordic-1km": "metno_nordic_pp",
  "regional-icon-d2": "dwd_icon_d2", "regional-dini": "dmi_harmonie_arome_europe", "regional-harm-nl": "knmi_harmonie_arome_netherlands",
  "regional-arome": "meteofrance_arome_france_hd", "regional-icon-ch1": "meteoswiss_icon_ch1", "regional-icon-2i": "italia_meteo_arpae_icon_2i",
  "icon-eu": "dwd_icon_eu", "world-gfs": "ncep_gfs025", "world-ecmwf": "ecmwf_ifs", "world-icon": "dwd_icon", "world-gdps": "cmc_gem_gdps_15km",
  "ecmwf-waves": "ecmwf_wam", ewam: "dwd_ewam", "bucket-icon-ch2": "meteoswiss_icon_ch2", "bucket-knmi-eu": "knmi_harmonie_arome_europe",
  "bucket-arome25": "meteofrance_arome_france0025", ukmo: "ukmo_uk_deterministic_2km" };
// The mixes' inputs (views.PRODUCTS, weather_mix.py EUROPE/WORLD, mix_world.py WORLD_MODELS): their "available" is
// the first input run published since the mix's previous run started (the owner, 22.10.2026: "available for the
// mixes, from when a new input model run was published").
const MIX_INPUTS = {
  mix: ["metnordic-1km", "dini", "harm-fi", "arome", "icon-d2", "icon-ch1", "harm-nl", "icon-2i", "aladin", "ukmo", "icon-ch2", "arome25",
    "knmi-eu", "icon-eu", "ecmwf", "gfs", "wrf-tarifa"],
  "mix-world": ["icon-eu", "ecmwf", "gfs", "icon", "gdps"],
  "mix-wx": ["metnordic-1km-wx", "dini-wx", "arome-wx", "icon-d2-wx", "icon-ch1-wx", "harm-nl-wx", "icon-2i-wx", "ukmo", "icon-ch2", "arome25",
    "knmi-eu", "icon-eu-wx", "ecmwf", "gfs"],
  "mix-world-wx": ["icon-eu-wx", "ecmwf", "gfs", "icon", "gdps"],
};
const GROUPS = ["Regional", "World and Europe", "Waves and seas", "Mixes and products", "Our own"];
const groupOf = (set) => set === "wrf-tarifa" ? "Our own"
  : ["ewam", "ecmwf-waves", "waves", "sea", "water"].includes(set) ? "Waves and seas"
  : set.startsWith("mix") || set === "chance" ? "Mixes and products"
  : ["icon-eu", "icon-eu-wx", "icon-eu-steer", "ecmwf", "gfs", "icon", "gdps"].includes(set) ? "World and Europe" : "Regional";
const med = (a) => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); return s[s.length >> 1]; };
const mins = (s) => s == null ? "–" : s >= 3600 ? (s / 3600).toFixed(1) + " h" : Math.max(0, Math.round(s / 60)) + " min";

function laneData(maps, fr, f, now, s) {
  if (!maps || !maps.maps) return [];
  const byMap = {};
  for (const r of maps.runs || []) {
    const [name, run, online, published, frames, failed] = r;
    (byMap[name] = byMap[name] || []).push({ run: +run, published: published ? +published : null, failed: +failed === 1 });
  }
  const freshBySet = {};
  for (const r of (fr && fr.rows) || []) if (r.set) freshBySet[r.set] = r;
  const homeBySet = {};
  for (const j of (f && f.jobs) || []) for (const [set, jobs] of Object.entries(SET_JOBS)) if (jobs.includes(j.job)) homeBySet[set] = j;
  const pipe = (s && s.pipe) || { arrivals: [], gh: [], wrf: [] };
  const arrBy = {};
  for (const [m, r, d] of pipe.arrivals) (arrBy[m] = arrBy[m] || {})[r] = d;
  const live = new Set((f && f.live) || []);
  const since = now - 40 * 3600, day = now - 24 * 3600;
  const labels = Object.fromEntries(maps.maps.map((m) => [m.name.replace(/^tiles:/, ""), m.label]));
  return maps.maps.map((m) => {
    const set = m.name.startsWith("tiles:") ? m.name.slice(6) : m.name;
    const [om, wf, word] = SET_SRC[set] || [];
    const wrf = set === "wrf-tarifa";
    const runs = (byMap[m.name] || []).sort((a, b) => a.run - b.run);
    const jobs = SET_JOBS[set] || [];
    const towerRuns = ((s && s.home) || []).filter((r) => jobs.includes(r.job));
    const ghRuns = wf ? pipe.gh.filter((g) => g[0] === wf && (!word || g[1] === word || g[1] === "(all)")) : [];
    const avails = (om && arrBy[om]) || {};
    // Each model run: when it was available (Open-Meteo's record), GitHub's publish, the Tower's run.
    const byRun = {};
    if (wrf) {
      // WRF reads GFS from NOAA, hours before Open-Meteo's record: available is when its log had GFS in hand after
      // waiting for it, else WRF's start (GFS was out by then).
      for (const [a, b, ok, ready, waited, cycle] of pipe.wrf) if (cycle) byRun[cycle] = { run: cycle, avail: waited && ready ? ready : a, early: !waited,
        tower: { start: a, end: b, ok: ok !== false, going: ok === "going", waiting: ok === "waiting", live: true, job: "wrf",
                 phases: pipe.wrf.find((x) => x[0] === a)?.[6] } };
    } else for (const [r, d] of Object.entries(avails)) byRun[+r] = { run: +r, avail: d };
    for (const r of runs) if ((r.published || r.run) >= since) {
      const e = byRun[r.run] = byRun[r.run] || { run: r.run, avail: null };
      e.pub = r.published; e.failed = r.failed;
    }
    const entries = Object.values(byRun).sort((a, b) => a.run - b.run);
    const newestPub = Math.max(0, ...runs.filter((r) => r.published).map((r) => r.run));
    const matched = new Set();
    for (const e of entries) {
      // GitHub's job: its workflow's run that was going when the map was published (or is going now).
      if (ghRuns.length) {
        // The run that ended closest after the publish (its last step uploads the index): a short "nothing new" run
        // overlapping it was picked before (the Mix read 11 min on GitHub where its publishing runs took 22-51).
        const near = (g) => g[3] == null ? 1e9 : g[3] >= e.pub - 60 ? g[3] - e.pub : 1e8;
        const g = e.pub ? ghRuns.filter((g) => g[2] <= e.pub + 60 && (g[3] == null || g[3] >= e.pub - 120))
            .sort((a, b) => Math.abs(near(a)) - Math.abs(near(b)))[0]
          // A job going now is the newest available run's: an older unpublished run was passed over (MET Nordic 1 km's
          // 14Z claimed it on 22.10.2026, an 11 h "wait" and no "not taken" mark).
          : e.avail != null ? ghRuns.find((g) => g[3] == null && g[2] >= e.avail - 120
            && !entries.some((o) => o.run > e.run && o.avail != null && o.avail <= g[2] + 120)) : null;
        if (g) e.gh = { start: g[2], end: g[3] };
      }
      // The Tower's: a job that watches this model, its run made from this source run; the others ride along (the
      // regional job watches MET Nordic and makes the regional models it finds): its first good run within 3 h.
      if (!wrf && e.avail != null) {
        // (since 21.10.2026 evening each run records every watched model's run as it started: exact)
        const t = towerRuns.filter((t) => t.sources && t.sources[om] === e.run).sort((a, b) => a.start - b.start)[0]
          || towerRuns.find((t) => JOB_WATCH[t.job] === om && t.source === e.run)
          || towerRuns.filter((t) => JOB_WATCH[t.job] !== om && t.exit === 0 && t.start >= e.avail - 120 && t.start <= e.avail + 3 * 3600)
            .sort((a, b) => a.start - b.start)[0];
        if (t) { matched.add(t); e.tower = { start: t.start, end: t.end, due: t.due, ok: t.exit === 0, live: t.live, job: t.job, cpu: t.cpu, peak: t.peak, net: t.net }; }
      }
      e.ghTime = !wrf && e.avail != null && e.pub ? e.pub - e.avail : null;
      e.towerTime = e.avail == null ? null : wrf ? (e.pub ? e.pub - e.avail : null) : e.tower && e.tower.ok ? e.tower.end - e.avail : null;
      e.skipped = !wrf && e.avail != null && !e.pub && !e.gh && !(e.tower && e.tower.live && e.tower.ok)
        && (now - e.avail > 3 * 3600 || newestPub > e.run);
    }
    // A mix: each run's "available" from its inputs' publishes (the first since its previous run started; none: a run
    // with nothing new, e.g. its far hours remade), for GitHub's runs and the Tower's.
    const inputs = MIX_INPUTS[set];
    let towerLoose = towerRuns, homeAvail = null;
    const running = homeBySet[set];
    if (inputs) {
      const pubs = inputs.flatMap((name) => (byMap["tiles:" + name] || []).filter((r) => r.published).map((r) => [r.published, labels[name] || name]))
        .sort((a, b) => a[0] - b[0]);
      const firstNew = (from, to) => pubs.find((p) => p[0] > from && p[0] <= to) || null;
      let prev = null;
      for (const e of entries) {
        if (!e.gh) continue;
        const p = prev == null ? null : firstNew(prev, e.gh.start);
        prev = e.gh.start;
        if (p) { e.avail = p[0]; e.availFrom = p[1]; e.ghTime = e.pub ? e.pub - p[0] : null; }
      }
      let prevT = null;
      towerLoose = [...towerRuns].sort((a, b) => a.start - b.start).map((t) => {
        const p = prevT == null ? null : firstNew(prevT, t.start);
        prevT = t.start;
        return p ? { ...t, avail: p[0], availFrom: p[1] } : t;
      });
      // The job running at home now: the same, from its last run's start (the owner, 22.10.2026: "have to have same
      // for Tower ... later we will remove GitHub").
      const p = running && running.started && prevT != null ? firstNew(prevT, running.started) : null;
      if (p) homeAvail = { avail: p[0], availFrom: p[1] };
    } else if (running && running.started && !wrf) {
      // Else the newest run available by its start that the Tower hasn't made yet (within 6 h).
      const cur = [...entries].reverse().find((o) => o.avail != null && o.avail <= running.started + 120);
      if (cur && !cur.tower && running.started - cur.avail < 6 * 3600) homeAvail = { avail: cur.avail, run: cur.run };
    }
    const recent = entries.filter((e) => (e.avail || e.pub || e.run) >= day);
    const runTimes = Object.keys(avails).map(Number).sort((a, b) => a - b);
    const cad = wrf ? 12 * 3600 : runTimes.length > 1 ? med(runTimes.slice(1).map((r, i) => r - runTimes[i])) : null;
    const lastAvail = runTimes.length ? avails[runTimes[runTimes.length - 1]] : null;
    const last = runs[runs.length - 1];
    // Without a source's rhythm (a job on a clock: chance of rain, the seas): the Tower's own planned start, the
    // scheduler's "next" (the owner, 22.10.2026: chance of rain looked unscheduled; a guess from its last run fell in
    // the past and drew nothing).
    const towerNext = ((f && f.next) || []).filter((n) => jobs.includes(n.job) && n.at).map((n) => n.at).sort((a, b) => a - b)[0] || null;
    const next = wrf ? ((f && f.wrf && f.wrf.next) || [])[0] || null
      : cad && lastAvail ? lastAvail + cad : towerNext || (last ? last.run + (m.interval + m.delay) * 3600 : null);
    const fresh = freshBySet[set];
    let status = "ok";
    if (fresh) status = fresh.status;
    else if (last && now - (runs.filter((r) => r.published).pop() || last).run > (m.interval + m.delay) * 3600 + 3600) status = "bad";
    // Without an "available" moment (our own products, sources Open-Meteo doesn't have): the jobs' own minutes.
    const procOnly = !wrf && !runTimes.length && !inputs;
    return { ...m, set, om, wf, wrf, group: groupOf(set), entries, jobs, towerRuns, fresh, status, cad, next, procOnly,
      loose: inputs ? towerLoose : procOnly ? towerRuns : [], home: running, homeAvail, isLive: wrf || jobs.some((j) => live.has(j)),
      towerT: inputs ? med(towerLoose.filter((t) => t.avail && t.exit === 0 && t.end >= day).map((t) => t.end - t.avail))
        : procOnly ? med(towerRuns.filter((t) => t.exit === 0 && t.end >= day).map((t) => t.end - t.start)) : med(recent.map((e) => e.towerTime).filter((v) => v != null)),
      ghT: procOnly ? med(recent.filter((e) => e.gh && e.pub).map((e) => e.pub - e.gh.start)) : med(recent.map((e) => e.ghTime).filter((v) => v != null)),
      offered: recent.filter((e) => e.avail != null).length, skipped: recent.filter((e) => e.skipped).length };
  });
}

// The machine band's reasons (the scheduler's queue record, runner/scheduler.py why_kind).
const WHY = { slots: "all slots busy", priority3: "priority 3 (a slot kept free)", memory: "memory", behind: "behind one waiting for memory",
  drain: "held for one waiting long", wrf: "too big beside WRF", planned: "the jobs' plans over their cap", heavy: "big jobs at their limit", starting: "starting",
  "?": "not recorded" };
const BAND_H = 196;

// The machine on top of the lanes (the owner, 22.10.2026: "on top we could add a total PC usage graph"; mockup
// pipeline-machine-band-2026-10-22): CPU (WRF, jobs), jobs running and waiting against the slots, memory against the
// jobs' budget, red where jobs waited while the machine had room (CPU under 50%, over 6 GB free).
