  if (!rows.length) return null;

  const yCpu = (p) => CPU[1] - Math.min(p, 100) / 100 * (CPU[1] - CPU[0]);
  const maxJobs = Math.max(8, ...rows.map((r) => r[4] + r[5]));
  const yJobs = (n) => JOBS[1] - n / maxJobs * (JOBS[1] - JOBS[0]);

  const xm = (r) => x(r[0] + step / 2);

    const out = [];
    let start = null;
    rows.forEach((r, i) => {
      if (test(r) && start == null) start = r[0];
      const end = !test(r) || i === rows.length - 1;
      if (start != null && end) { out.push([start, test(r) ? r[0] + step : r[0]]); start = null; }
    });
    return out;
  };

    ${spans((r) => roomy(r, total)).map(([a, b]) => html`<rect x=${x(a)} y=${CPU[0]} width=${Math.max(x(b) - x(a), 1)} height=${MEM[1] - CPU[0]} fill="var(--room)"/>`)}
    ${spans((r) => r[6]).map(([a, b]) => html`<rect x=${x(a)} y=${CPU[0] - 5} width=${Math.max(x(b) - x(a), 1)} height="3" fill="var(--wrf)"/>`)}
    <path d=${area(() => yCpu(0), (r) => yCpu(r[2]))} fill="var(--wrf-soft)"/>
    <path d=${area((r) => yCpu(r[2]), (r) => yCpu(r[1] + r[2]))} fill="var(--home-soft)"/>
    <path d=${"M" + rows.map((r) => `${xm(r)},${yCpu(r[1] + r[2])}`).join("L")} fill="none" stroke="var(--home)" stroke-width="1.3"/>
    ${[50, 100].map((p) => html`<line x1=${X0} x2=${X1} y1=${yCpu(p)} y2=${yCpu(p)} stroke="var(--line)" stroke-dasharray="3 3"/><text x=${X0 - 6} y=${yCpu(p) + 4} text-anchor="end">${p}%</text>`)}
    ${rows.map((r) => { const a = x(r[0]), w = Math.max(x(r[0] + step) - a - 0.4, 0.8);
      return html`${r[4] ? html`<rect x=${a} y=${yJobs(r[4])} width=${w} height=${JOBS[1] - yJobs(r[4])} fill="var(--home)" opacity=".7"/>` : null}
        ${r[5] ? html`<rect x=${a} y=${yJobs(r[4] + r[5])} width=${w} height=${yJobs(r[4]) - yJobs(r[4] + r[5])} fill="var(--wait)"/>` : null}`; })}
    <line x1=${X0} x2=${X1} y1=${yJobs(slots)} y2=${yJobs(slots)} stroke="var(--ink)" stroke-dasharray="5 4" stroke-width="1.2"/>
    <text x=${X0 - 6} y=${yJobs(slots) + 4} text-anchor="end">${slots} slots</text><text x=${X0 - 6} y=${JOBS[0] + 8} text-anchor="end">${maxJobs}</text>
    <path d=${"M" + rows.map((r) => `${xm(r)},${yMem(r[3])}`).join("L")} fill="none" stroke="var(--accent)" stroke-width="1.5"/>
    <path d=${"M" + rows.map((r) => `${x(r[0])},${yMem(r[9])}L${x(r[0] + step)},${yMem(r[9])}`).join("L")} fill="none" stroke="var(--accent)" stroke-dasharray="4 3"/>
    <text x=${X0 - 6} y=${MEM[0] + 8} text-anchor="end">${Math.round(total)} GB</text>
    <text class="grp" x="0" y=${CPU[0] + 12}>CPU</text><text x="0" y=${CPU[0] + 26}>${band.threads} threads</text>
    <text class="grp" x="0" y=${JOBS[0] + 12}>JOBS</text><text x="0" y=${JOBS[0] + 26}>running · waiting</text>
    <text class="grp" x="0" y=${MEM[0] + 12}>MEMORY</text><text x="0" y=${MEM[0] + 26}>used · budget</text>
    <text x=${X1 + 22} y=${CPU[0] + 14}>avg ${Math.round(avg)}%</text>
    <text x=${X1 + 22} y=${JOBS[0] + 14} style=${room.length ? "fill:var(--bad)" : ""}>${room.length * Math.round(step / 60)} min</text><text x=${X1 + 22} y=${JOBS[0] + 28}>waited with room</text>
    <text x=${X1 + 22} y=${MEM[0] + 14}>peak ${Math.max(...rows.map((r) => r[3])).toFixed(1)} GB</text>
    <line x1="0" x2=${X1 + 200} y1=${top + 182} y2=${top + 182} stroke="var(--line)"/>
  </g>`;
}

function BandTip({ band, row, left, top }) {

  return html`<div class="btip" style=${`left:${left}px;top:${top}px`}>
    <b>${clock(row[0])} ${zoneName()}</b>${row[6] ? " · WRF running" : ""}<br/>
    <span class="k">CPU</span> ${Math.round(row[1] + row[2])}% (jobs ${Math.round(row[1])}, WRF ${Math.round(row[2])})<br/>

// A running job's expected end from its usual time (the median of its last 10 runs); WRF's from its model time.
function jobEnd(j, now) {
  const typ = j && j.typical ? j.typical * 60 : null;
  if (!j || !j.started || !typ) return null;
  const end = j.started + typ;
  return { end, typ, pct: Math.min((now - j.started) / typ, 1), late: now > end };
}
function wrfEnd(w, now) {
  if (!w || !w.running || w.progress == null || w.progress < 0.03) return null;
  const from = w.computing_from || w.started;
  return { end: from + (now - from) / w.progress, pct: w.progress, from, late: false };
}

// What a bar is (the owner, 22.10.2026: "on hover on each line a popup ... if active, how much it uses, status ...

function Lanes({ lanes, now, sel, setSel, back, ahead, band, slots, wrf }) {

  const w = (a, b, min = 1.5) => Math.max(x(b) - x(a), min);

  const svgRef = useRef(null);

  const [pop, setPop] = useState(null);

  const showPop = (ev, d) => {
    if (!box.current) return;
    const b = box.current.getBoundingClientRect();
    // Above the pointer near the chart's foot (below it hung past the edge: an inner scrollbar, the popup hidden).
    const y = ev.clientY - b.top;
    setPop({ d, left: Math.max(box.current.scrollLeft + 4, Math.min(ev.clientX - b.left + box.current.scrollLeft + 14, box.current.scrollLeft + b.width - 390)),

  const expect = (y, end, color, label, late) => html`<line x1=${x(now)} x2=${x(Math.max(end, now))} y1=${y + 20} y2=${y + 20} stroke=${late ? "var(--wait)" : color} stroke-width="3" stroke-dasharray="5 4"/>
    <rect x=${x(Math.max(end, now)) - 1} y=${y + 14} width="2" height="12" fill=${late ? "var(--wait)" : color} opacity=".8"/>
    <text class="eta" x=${x(Math.max(end, now)) + 6} y=${y + 24} style=${`fill:${late ? "var(--warn)" : color}`}>${label}</text>`;
  const wEnd = wrfEnd(wrf, now);

  const BH = band && band.rows && band.rows.length ? BAND_H : 0;
  // Runs that overlap in a lane get sub-rows (the owner, 22.10.2026: "instead of overlapping, we have multiple rows
  // showing one after another"; mockup pipeline-overlap-2026-10-22): each source's bars (GitHub's, the Tower's) packed
  // into the fewest rows, a run into the first row free by its start; a lane grows 9 px a row while an overlap is in view.
  const sec = (t1 - t0) / (X1 - X0), labelEnd = (end, label) => Math.max(end, now) + (label.length * 6.8 + 10) * sec;
  const runningLabel = (je) => je && (je.late ? `${Math.round((now - je.start) / 60)} min · over its usual ${Math.round(je.typ / 60)}` : `${Math.round(je.pct * 100)}% · ~${clock(je.end)}`);

    const gb = [], tb = [];

        const to = ge || (a != null && now - a < 3 * 3600 ? now : null);
        if (to) gb.push({ key: e, from: a != null ? a : gs != null ? gs : to, to });
      }

        to: t.going && wEnd ? labelEnd(wEnd.end, `${Math.round(wEnd.pct * 100)}% · ~${clock(wEnd.end)}`) : t.end });
    }
    for (const r of l.loose) if (r.end >= t0 && r.start <= t1) tb.push({ key: r, from: r.avail || (r.due && r.start - r.due > 60 ? r.due : r.start), to: r.end });

    const [kg, gAt] = pack(gb), [kt, tAt] = pack(tb);
    return { kg, kt, g: (key) => PITCH * (gAt.get(key) || 0), t: (key) => PITCH * (kg - 1 + (tAt.get(key) || 0)), h: lh + PITCH * (kg + kt - 2),
      hasG: (key) => gAt.has(key), hasT: (key) => tAt.has(key) };
  };
  // Each run's "available" joined to its bars in a lane with sub-rows (the owner, 22.10.2026, red lines on a
  // screenshot: "where indicated every task when it was available and to what it's related"), drawn over the bars it
  // passes; the Tower's own triangles where its "available" is its own (a mix's home runs, the job running now).
  const tri = (a, y, tip) => html`<path d=${`M${x(a) - 4} ${y + 1} L${x(a) + 4} ${y + 1} L${x(a)} ${y + 6} Z`} fill="var(--muted)"><title>${tip}</title></path>`;
  const links = (l, y, lay) => {
    const out = [], grown = lay.kg + lay.kt > 2;
    const link = (a, top) => { if (grown && a >= t0 && a <= t1 && top > y + 10) out.push(html`<line x1=${x(a)} x2=${x(a)} y1=${y + 6} y2=${top + 3} stroke="var(--ink)" stroke-width="1" opacity=".55" pointer-events="none"/>`); };
    for (const e of l.entries) if (e.avail != null && !e.skipped) {
      if (lay.hasG(e)) link(e.avail, y + lay.g(e) + 8);
      if (lay.hasT(e)) link(e.avail, y + lay.t(e) + 17);
    }
    for (const r of l.loose) if (r.avail && r.avail >= t0 && lay.hasT(r)) {
      out.push(tri(r.avail, y, `${l.label} · at home: available ${clock(r.avail)} (a new input: ${r.availFrom} published)`));
      link(r.avail, y + lay.t(r) + 17);
    }
    const h = l.homeAvail;
    if (h && h.avail >= t0 && lay.hasT("home")) {
      out.push(tri(h.avail, y, `${l.label} · running at home: available ${clock(h.avail)}${h.availFrom ? ` (a new input: ${h.availFrom} published)` : h.run ? ` (its ${runZ(h.run)} run)` : ""}`));
      link(h.avail, y + lay.t("home") + 17);
    }
    return out;
  };
  const rows = [];
  let y = 30 + BH;
  for (const g of GROUPS) {
    const ls = lanes.filter((l) => l.group === g);
    if (!ls.length) continue;
    rows.push({ g, y }); y += gh;
    for (const l of ls) { const lay = layout(l); rows.push({ l, y, lay }); y += lay.h; }
  }
  const H = y + 22;
  const hours = [];
  for (let t = Math.ceil(t0 / 3600) * 3600; t <= t1; t += 3600) hours.push(t);
  const runTip = (l, e) => `${l.label} ${runZ(e.run)}${e.avail != null ? ` · available ${clock(e.avail)}` : ""}`;
  const entry = (l, e, y, lay) => {
    const a = e.avail, out = [], yg = y + lay.g(e), yt = y + lay.t(e);
    const end = Math.max(e.pub || 0, e.tower ? e.tower.end : 0, e.gh ? e.gh.end || now : 0, a || 0);
    if (end < t0 || (a || e.pub || e.run) > t1) return out;
    if (a != null) out.push(html`<path d=${`M${x(a) - 4} ${y + 1} L${x(a) + 4} ${y + 1} L${x(a)} ${y + 6} Z`} fill="var(--muted)"><title>${runTip(l, e)} (${e.availFrom ? `a new input: ${e.availFrom} published` : l.wrf ? (e.early ? "GFS was already out at NOAA when WRF started" : "GFS out at NOAA: WRF had waited for it") : "Open-Meteo's record"})</title></path>`);
    if (e.skipped) {
      out.push(html`<text x=${x(a) + 3} y=${y + 20} class="skip">×<title>${runTip(l, e)}: not taken (no publish on GitHub or at home)</title></text>`);
      return out;
    }
    // GitHub, the upper bar: waiting (amber) from available to its job's start, then the job (grey) to the publish.
    if (!l.wrf) {
      const gs = e.gh ? e.gh.start : null, ge = e.pub || (e.gh && e.gh.end == null ? now : null);
      const from = a != null ? a : gs;
      if (from != null && ge) {
        const procFrom = gs != null && a != null ? Math.max(gs, a) : from;
        out.push(html`<g ...${hov({ kind: "gh", l, e })}>${a != null && procFrom > a ? html`<rect x=${x(a)} y=${yg + 8} width=${w(a, procFrom, 1)} height="6" rx="1" fill="var(--wait)"/>` : null}
          <rect x=${x(procFrom)} y=${yg + 8} width=${w(procFrom, ge)} height="6" rx="1" fill=${e.failed ? "var(--bad)" : "var(--gh)"} opacity=${gs == null && a != null ? 0.35 : 1}/>
          ${e.pub ? html`<rect x=${x(e.pub) - 1} y=${yg + 6} width="2.5" height="10" fill="var(--ok)"/>` : null}</g>`);
      } else if (e.pub) out.push(html`<g ...${hov({ kind: "gh", l, e })}><rect x=${x(e.pub) - 1} y=${yg + 6} width="2.5" height="10" fill="var(--ok)"/></g>`);
      else if (a != null && now - a < 3 * 3600) out.push(html`<g ...${hov({ kind: "gh", l, e })}><rect x=${x(a)} y=${yg + 8} width=${w(a, now, 1)} height="6" rx="1" fill="var(--wait)"/></g>`);
    }
    // The Tower, the lower bar: waiting, then its run (faint: shadow, not published).
    const t = e.tower;
    // WRF started by its task, still waiting for NOAA's GFS (22.10.2026: it showed nothing): a waiting bar to now.
    if (t && t.waiting) {
      out.push(html`<g ...${hov({ kind: "wrfwait", l, e, w: wrf, t })}><rect x=${x(t.start)} y=${yt + 17} width=${w(t.start, t.end, 1)} height="6" rx="1" fill="var(--wait)"/></g>`);
    } else if (t) {
      const procFrom = a != null ? Math.max(a, t.start) : t.start;
      out.push(html`<g ...${hov(t.going ? { kind: "wrf", l, e, w: wrf } : l.wrf ? { kind: "wrfdone", l, e, t } : { kind: "tower", l, e, t })}>
        ${a != null && t.start > a ? html`<rect x=${x(a)} y=${yt + 17} width=${w(a, t.start, 1)} height="6" rx="1" fill="var(--wait)"/>` : null}
        <rect x=${x(procFrom)} y=${yt + 17} width=${w(procFrom, t.end)} height="6" rx="1" fill=${t.ok ? "var(--home)" : "var(--bad)"} opacity=${t.live ? 1 : 0.55}/>
        ${t.live && t.ok && !t.going ? html`<rect x=${x(l.wrf && e.pub ? e.pub : t.end) - 1} y=${yt + 15} width="2.5" height="10" fill="var(--ok)"/>` : null}
        ${t.going && wEnd ? expect(yt, wEnd.end, "var(--wrf)", `${Math.round(wEnd.pct * 100)}% · ~${clock(wEnd.end)}`, false) : null}</g>`);
    }
    return out;
  };
  // The band's minute under the pointer (hover, or a tap on a phone).
  const point = (ev) => {
    if (ev.type === "pointerdown" && !(ev.target && ev.target.closest && ev.target.closest("[data-bar]"))) setPop(null);
    if (!BH || !svgRef.current || !box.current) return setTip(null);
    const pt = svgRef.current.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    const p = pt.matrixTransform(svgRef.current.getScreenCTM().inverse());
    if (p.x < X0 || p.x > X1 || p.y > 30 + BH - 10) return setTip(null);
    const t = t0 + (p.x - X0) / (X1 - X0) * (t1 - t0);
    const near = band.rows.reduce((a, r) => Math.abs(r[0] - t) < Math.abs(a[0] - t) ? r : a, band.rows[0]);
    if (Math.abs(near[0] - t) > 600) return setTip(null);
    const b = box.current.getBoundingClientRect();
    setTip({ row: near, left: Math.min(ev.clientX - b.left + box.current.scrollLeft + 14, box.current.scrollLeft + b.width - 310), top: ev.clientY - b.top + 12 });
  };
  return html`<div class="lanes" ref=${box}><svg ref=${svgRef} viewBox="0 0 ${W} ${H}" role="img" aria-label="Every map's runs from available to published"
      onPointerMove=${point} onPointerDown=${point} onPointerLeave=${() => setTip(null)}>
    ${hours.map((t) => html`<line x1=${x(t)} x2=${x(t)} y1="22" y2=${H - 20} stroke="var(--line)"/>${Math.round(t / 3600) % step === 0 ? html`<text x=${x(t)} y="15" text-anchor="middle">${clock(t)}</text>` : null}`)}
    ${BH ? bandLayer(band, x, t0, slots || 4, X0, X1) : null}
    <text x=${X1 + 22} y="15">Tower</text><text x=${X1 + 86} y="15">GitHub</text><text x=${X1 + 150} y="15">skipped</text>
    ${rows.map(({ g, l, y, lay }) => g ? html`<text class="grp" x="0" y=${y + 16}>${g.toUpperCase()}</text>` : html`<g class=${"row" + (sel === l.name ? " sel" : "")} onClick=${() => setSel(l.name)} style="cursor:pointer">
      <rect class="hit" x="0" y=${y} width=${W} height=${lay.h} fill="transparent" rx="4"/>
      ${l.wrf ? null : html`<text class="src" x=${X0 - 6} y=${y + 14} text-anchor="end">GitHub${lay.kg > 1 ? " ×" + lay.kg : ""}</text>`}
      <text class="src" x=${X0 - 6} y=${y + lay.t(null) + 23} text-anchor="end" style="fill:var(--home)">Tower${lay.kt > 1 ? " ×" + lay.kt : ""}</text>
      <circle cx="8" cy=${y + 15} r="4" fill=${l.status === "bad" ? "var(--bad)" : l.status === "proc" ? "var(--accent)" : l.status === "wait" ? "var(--warn)" : "var(--ok)"}/>
      <text class="lname" x="18" y=${y + 19}>${l.label.length > 28 ? l.label.slice(0, 27) + "…" : l.label}</text>
      ${l.entries.map((e) => entry(l, e, y, lay))}
      ${l.loose.filter((r) => r.end >= t0 && r.start <= t1).map((r) => { const from = r.avail || (r.due && r.start - r.due > 60 ? r.due : null);
        const yt = y + lay.t(r);
        return html`<g ...${hov({ kind: "tower", l, t: r })}>
        ${from ? html`<rect x=${x(from)} y=${yt + 17} width=${w(from, r.start, 1)} height="6" rx="1" fill="var(--wait)"/>` : null}
        <rect x=${x(r.start)} y=${yt + 17} width=${w(r.start, r.end)} height="6" rx="1" fill=${r.exit === 0 ? "var(--home)" : "var(--bad)"} opacity=${r.live ? 1 : 0.55}/></g>`; })}
      ${l.home && l.home.started ? (() => { const je = jobEnd(l.home, now);
        const yt = y + lay.t("home"), ha = l.homeAvail, cur = [...l.entries].reverse().find((o) => o.avail != null && o.avail <= l.home.started + 120);
        return html`<g ...${hov({ kind: "running", l, j: l.home, e: ha ? { ...(cur || {}), ...(ha.run ? l.entries.find((o) => o.run === ha.run) : {}), avail: ha.avail, availFrom: ha.availFrom } : cur })}>
          ${ha && l.home.started > ha.avail ? html`<rect x=${x(ha.avail)} y=${yt + 17} width=${w(ha.avail, l.home.started, 1)} height="6" rx="1" fill="var(--wait)"/>` : null}<rect x=${x(l.home.started)} y=${yt + 17} width=${w(l.home.started, now, 3)} height="6" rx="1" fill="var(--home)" opacity=${l.home.live ? 1 : 0.55}/>
          ${je ? (je.late ? expect(yt, now, "var(--home)", `${Math.round((now - l.home.started) / 60)} min · over its usual ${Math.round(je.typ / 60)}`, true)
            : expect(yt, je.end, "var(--home)", `${Math.round(je.pct * 100)}% · ~${clock(je.end)}`, false)) : null}</g>`; })() : null}
      ${links(l, y, lay)}
      ${(() => { const out = []; if (l.next) for (let t = l.next; t < t1 && out.length < 30; t += l.cad || 1e9) if (t > now) out.push(html`<path d=${`M${x(t)} ${y + 6} l5 9 -5 9 -5 -9 Z`} fill="none" stroke="var(--faint)"><title>${l.label}: next run expected about ${clock(t)}</title></path>`); return out; })()}
      <text class="ours" x=${X1 + 22} y=${y + 19} style=${"fill:var(--home)" + (l.procOnly ? ";font-style:italic" : "")}>${mins(l.towerT)}</text>
      <text class="ours" x=${X1 + 86} y=${y + 19} style=${"fill:var(--muted)" + (l.procOnly ? ";font-style:italic" : "")}>${mins(l.ghT)}</text>
      ${l.skipped ? html`<text class="ours" x=${X1 + 150} y=${y + 19} style="fill:var(--bad)">${l.skipped} of ${l.offered}</text>` : null}
    </g>`)}
    <line x1=${x(now)} x2=${x(now)} y1="20" y2=${H - 18} stroke="var(--warn)" stroke-width="2"/><text x=${x(now) + 5} y=${H - 6} style="fill:var(--warn)">now ${clock(now)}</text>
    ${tip ? html`<line x1=${x(tip.row[0] + 60)} x2=${x(tip.row[0] + 60)} y1="20" y2=${30 + BH - 10} stroke="var(--ink)" opacity=".45"/>` : null}
  </svg>${tip ? html`<${BandTip} band=${band} row=${tip.row} left=${tip.left} top=${tip.top} />` : null}
    ${pop ? html`<${BarPop} d=${{ ...pop.d, w: wrf, j: (pop.d.kind === "running" && (lanes.find((o) => o.name === pop.d.l.name) || {}).home) || pop.d.j }}
      now=${now} left=${pop.left} top=${pop.top} />` : null}</div>`;
}

function RunBars({ l }) {
  const es = l.entries.filter((e) => e.avail != null && !e.skipped && (e.pub || e.tower)).slice(-8);
  if (!es.length) return html`<p class="note" style="margin:0">No runs with an "available" moment yet${l.procOnly ? " (this one is made from our own sets or a source Open-Meteo doesn't have; the chart shows its jobs' own times)" : " (recorded from 21.10.2026 evening)"}.</p>`;
  const top = Math.max(...es.map((e) => Math.max(e.pub ? e.pub - e.avail : 0, e.tower ? e.tower.end - e.avail : 0)), 1800) / 60;
  const max = top <= 60 ? Math.ceil(top / 15) * 15 : Math.ceil(top / 60) * 60;
  const A = 34, B = 350, xx = (m) => A + Math.max(0, Math.min(m, max)) / max * (B - A), H = es.length * 22 + 24;
  return html`<svg viewBox=${`0 0 360 ${H}`} style="width:100%" role="img" aria-label="The last runs, minutes from available">
    ${[0, 0.25, 0.5, 0.75, 1].map((p) => html`<line x1=${xx(p * max)} x2=${xx(p * max)} y1="4" y2=${H - 16} stroke="var(--line)"/><text x=${xx(p * max)} y=${H - 3} text-anchor="middle" style="font:10px var(--mono);fill:var(--muted)">${max > 60 ? (p * max / 60).toFixed(p * max % 60 ? 1 : 0) + (p === 1 ? " h" : "") : Math.round(p * max) + (p === 1 ? " min" : "")}</text>`)}
    ${es.map((e, i) => {
      const y = 6 + i * 22, gw = e.gh ? Math.max(0, e.gh.start - e.avail) / 60 : 0, gt = e.pub ? (e.pub - e.avail) / 60 : null;
      const t = e.tower, tw = t ? Math.max(0, t.start - e.avail) / 60 : 0, tt = t ? (t.end - e.avail) / 60 : null;
      return html`<text x="0" y=${y + 11} style="font:10.5px var(--mono);fill:var(--muted)">${runZ(e.run)}</text>
        ${gt != null && !l.wrf ? html`<rect x=${A} y=${y} width=${xx(Math.min(gw, gt)) - A} height="7" fill="var(--wait)"/><rect x=${xx(Math.min(gw, gt))} y=${y} width=${Math.max(xx(gt) - xx(Math.min(gw, gt)), 1.5)} height="7" fill="var(--gh)"><title>GitHub: waited ${Math.round(gw)} min, published ${Math.round(gt)} min after available</title></rect>` : null}
        ${tt != null ? html`<rect x=${A} y=${y + 9} width=${xx(tw) - A} height="7" fill="var(--wait)"/><rect x=${xx(tw)} y=${y + 9} width=${Math.max(xx(tt) - xx(tw), 1.5)} height="7" fill=${t.ok ? "var(--home)" : "var(--bad)"} opacity=${t.live ? 1 : 0.55}><title>Tower: waited ${Math.round(tw)} min, done ${Math.round(tt)} min after available</title></rect>` : null}`;
    })}</svg>`;
}

function LaneDetail({ l, now, cap, all }) {
  if (!l) return html`<div class="panel"><p class="note" style="margin:0">Tap a lane: its last runs from available, where the time went, what a run costs at home.</p></div>`;
  const last = [...l.entries].reverse().find((e) => e.avail != null && !e.skipped && (e.pub || e.tower));
  const gw = last && last.gh ? Math.max(0, last.gh.start - last.avail) : null;
  const t = last && last.tower;
  const tw = t ? Math.max(0, t.start - last.avail) : null;
  const srcEvery = l.cad ? Math.round(l.cad / 3600) : null;
  const jobs = ((cap && cap.jobs) || []).filter((j) => l.jobs.includes(j.job));
  const makes = (job) => all.filter((x) => x.jobs.includes(job)).length;
  return html`<div class="panel"><div class="dhead"><b>${l.label}</b><span class=${"tag" + (l.isLive ? " live" : "")}>${l.wrf ? "at home" : l.jobs.length ? "Tower: " + (l.isLive ? "live" : "shadow") : "GitHub only"}</span></div>
      <p class="note" style="margin:6px 0 10px">${MIX_INPUTS[l.set] ? `Made from ${MIX_INPUTS[l.set].length} of our sets ("available": the first new input published since its run before)` : srcEvery ? `Every ${srcEvery} h at the source` : l.procOnly ? "No source record (made from our own sets or a source Open-Meteo doesn't have)" : "The source's cadence not known yet"}, every ${l.interval} h ours${l.skipped ? ` · ${l.skipped} of ${l.offered} runs skipped in 24 h` : ""}. The last runs, from available:</p>
      <${RunBars} l=${l} />
      <div class="legend"><span style="--c:var(--gh)">GitHub</span><span style="--c:var(--home)">Tower</span><span style="--c:var(--wait)">waiting</span></div></div>
    ${last ? html`<div class="panel"><h2>The last run · ${runZ(last.run)}</h2><div class="kv">
      <span>Available to us</span><span>${clock(last.avail)}${l.wrf ? (last.early ? " (GFS out by then)" : " (GFS out at NOAA)") : ""}</span>
      ${l.wrf ? null : html`<span>GitHub published</span><span>${last.pub ? `${clock(last.pub)} · ${mins(last.pub - last.avail)}` : "–"}</span>
        ${last.gh && last.pub ? html`<span>· waited, then the job</span><span>${mins(gw)} · ${mins(last.pub - last.avail - gw)}</span>` : null}`}
      ${t ? html`<span>${l.wrf ? "WRF ran" : "Tower done"}</span><span>${t.going ? "running" : `${clock(t.end)} · ${mins(t.end - last.avail)}`}</span>
        <span>· waited, then the run</span><span>${mins(tw)} · ${mins(t.end - Math.max(t.start, last.avail))}</span>` : null}
      ${l.wrf && last.pub ? html`<span>Published</span><span>${clock(last.pub)} · ${mins(last.pub - last.avail)}</span>` : null}
      ${l.om && !l.wrf ? html`<span>Open-Meteo had it</span><span>${clock(last.avail)} · 0 min</span>` : null}</div>
      <div class="hint">${l.wrf ? `WRF starts at fixed times (11:45 and 23:45 Riga) and waits there for GFS, so GFS being available earlier or later moves the wait, not the run.`
        : gw != null && tw != null ? `GitHub waited ${mins(gw)} for its job to start (its cron); at home the job started ${mins(tw)} after the run was available.`
        : gw != null ? `GitHub waited ${mins(gw)} for its job to start (its cron).` : `"Available" is Open-Meteo's record of the run being complete on its open data, where our jobs read it; so Open-Meteo has every run at that same moment.`}</div></div>` : null}
    ${jobs.length ? html`<div class="panel"><h2>A run costs · Tower, 24 h</h2><div class="kv">
      ${jobs.map((j) => html`<span><b>${j.job}</b></span><span>${j.runs} runs${makes(j.job) > 1 ? ` · makes ${makes(j.job)} maps` : ""}</span>
        <span>CPU per run</span><span>${Math.round(j.cpu_h * 60 / Math.max(j.runs, 1))} min</span>
        <span>Peak memory</span><span>${(j.peak_mb / 1000).toFixed(1)} GB</span>
        <span>Downloaded per run</span><span>${(j.net_gb / Math.max(j.runs, 1)).toFixed(2)} GB</span>
        <span>Per day</span><span>${j.cpu_h.toFixed(1)} CPU h · ${j.waited_h.toFixed(1)} h waited</span>`)}</div></div>` : null}
    <div class="panel"><h2>Actions</h2><div class="btns">
      <${ActButton} label="Run the helper now" run=${() => adminPost("run", { what: "helper" })} primary=${true} />
      <${ActButton} label="Rebuild all maps" run=${() => adminPost("run", { what: "rebuild" })} />
    </div><p class="note" style="margin:8px 0 0">Through admin's own routes; each asks once more.</p></div>`;
}

const RANGES = [[6, 3], [12, 6], [24, 12]];

function Pipeline({ maps, fr, f, now, s, cap }) {
  const [sel, setSel] = useState(null);
  const [filter, setFilter] = useState("all");
  const [range, setRange] = useState(12);
  const all = laneData(maps, fr, f, now, s);
  const both = (l) => l.towerT != null && l.ghT != null && !l.procOnly;
  const pick = { all: () => true, sooner: (l) => both(l) && l.towerT < l.ghT, later: (l) => both(l) && l.towerT >= l.ghT,
    skip: (l) => l.skipped > 0, home: (l) => l.isLive || !!l.home, bad: (l) => l.status === "bad" };
  const lanes = all.filter(pick[filter]);
  const picked = all.find((l) => l.name === sel);
  // A tapped lane's detail sits under the chart: brought into view.
  const choose = (name) => { setSel(name); setTimeout(() => { const d = document.getElementById("lanedetail"); if (d) d.scrollIntoView({ behavior: "smooth", block: "nearest" }); }, 50); };
  // Today's summary: our time on each machine, GitHub's waiting share, runs skipped, the Tower against GitHub.
  const day = all.filter((l) => !l.procOnly).flatMap((l) => l.entries.filter((e) => e.avail != null && e.avail >= now - 24 * 3600));
  const tMed = med(day.map((e) => e.towerTime).filter((v) => v != null)), gMed = med(day.map((e) => e.ghTime).filter((v) => v != null));
  const gx = day.filter((e) => e.gh && e.pub && e.ghTime > 0);
  const waitShare = gx.length ? gx.reduce((a, e) => a + Math.min(Math.max(0, e.gh.start - e.avail), e.ghTime), 0) / gx.reduce((a, e) => a + e.ghTime, 0) : null;
  const skipped = all.reduce((a, l) => a + l.skipped, 0), offered = all.reduce((a, l) => a + l.offered, 0);
  const compared = all.filter(both), sooner = compared.filter((l) => l.towerT < l.ghT).length;
  const [back, ahead] = RANGES.find((r) => r[0] === range);
  // The machine band (/api/band): when the Pipeline opens, every 2 minutes, and for each range.
  const [band, setBand] = useState(null);
  useEffect(() => {
    let stop = false;

  const chips = [["all", `All ${all.length}`], ["sooner", `Tower sooner ${sooner}`], ["later", `GitHub sooner ${compared.length - sooner}`],
    ["skip", `Skipping runs ${all.filter((l) => l.skipped).length}`], ["home", `At home ${all.filter(pick.home).length}`], ["bad", `Behind ${all.filter(pick.bad).length}`]];

      <div><span class="v">${mins(gMed)}</span><span class="l">GitHub</span></div>
      <div><span class="v">${waitShare == null ? "–" : Math.round(waitShare * 100) + "%"}</span><span class="l">of GitHub's time is waiting for its job to start</span></div>

      <div><span class="v">${sooner} of ${compared.length}</span><span class="l">maps the Tower makes sooner</span></div></div>
    <div class="pipe" style="margin-top:16px">
    <section class="panel" aria-label="Pipeline"><h2>Every map: from available to published · last ${back} h and next ${ahead} · ${zoneName()} time</h2>
      ${!maps ? html`<p class="empty">Reading admin's map history…</p>` : html`
      <div class="filters">${RANGES.map(([b]) => html`<span class=${"chip" + (range === b ? " on" : "")} onClick=${() => setRange(b)}>${b} h</span>`)}<span style="width:10px"></span>
        ${chips.map(([k, label]) => html`<span class=${"chip" + (filter === k ? " on" : "")} onClick=${() => setFilter(k)}>${label}</span>`)}</div>
      <${Lanes} lanes=${lanes} now=${now} sel=${sel} setSel=${choose} back=${back} ahead=${ahead} band=${band} slots=${f && f.slots} wrf=${f && f.wrf} />
      <div class="legend"><span style="--c:var(--wrf)">CPU: WRF</span><span style="--c:var(--home)">CPU: jobs · jobs running</span><span style="--c:var(--wait)">jobs waiting · waiting to start</span><span style="--c:var(--accent)">memory used (dashed: the jobs' budget)</span><span style="--c:var(--room)">waiting with room (CPU &lt; 50%, &gt; 6 GB free)</span></div>
      <div class="legend"><span class="t">▼ run available to us (Open-Meteo's record; a mix: a new input published; a line down: its bars in a lane with more rows)</span><span style="--c:var(--gh)">GitHub (upper bar)</span><span style="--c:var(--home)">Tower (lower bar; faint: shadow, not published)</span>
        <span style="--c:var(--wait)">waiting to start</span><span style="--c:var(--ok)">published</span><span class="t" style="color:var(--bad)">× a source run nobody took</span><span class="t">◇ next run expected</span><span class="t">right: our time, median of 24 h (italic: the job's own time, no "available" moment)</span></div>
      <p class="note" style="margin:8px 0 0">Each bar starts when the run was complete on Open-Meteo's open data, where our jobs read it, and ends when riders could see it. The maker's own time before that is left out. Sooner is better. "Available" is recorded for every model from 21.10.2026 evening; older runs start at GitHub's job.</p>`}
    </section>
    <aside class="detail" id="lanedetail">${html`<${LaneDetail} l=${picked} now=${now} cap=${cap} all=${all} />`}</aside>
  </div>
  <div style="margin-top:16px"><${Freshness} fr=${fr} now=${now} /></div>`;

// MARK: Quality

function Quality({ ad, now }) {
  const o = ad && ad.overview;
  if (!o) return html`<p class="empty">${ad && ad.error ? ad.error : "Reading admin's data…"}</p>`;
  const rows = (o.ours || {}).rows || [];
  const models = [...new Set(rows.map((r) => r.model))];
  const cell = (m, lead) => rows.find((r) => r.model === m && r.lead === lead);
  const limit = (m) => m.endsWith("#temp") ? 0.5 : 0.3;
  const over = models.filter((m) => { const c = cell(m, "0-48"); return c && c.n >= 100 && c.mae > limit(m); });
  const rs = o.rainSkill || [];
  const lastRs = rs[rs.length - 1];
  const sets = lastRs ? Object.entries(lastRs.sets).sort((a, b) => b[1].fss - a[1].fss) : [];
  const skill = ((o.alerts || {}).skill || []);
  const csi = (m, lead) => { const s = skill.find((x) => x.method === m && x.lead === lead); return s ? s.hits / Math.max(1, s.hits + s.misses + s.falses) : null; };
  const W = 400, H = 170, X0 = 30, Y0 = 10, Y1 = 150;
  const lines = [["rain-now+1", "var(--ok)"], ["composite", "var(--home)"], ["weighted", "var(--wrf)"], ["icon-eu-wx", "var(--warn)"]];
  return html`<div class="grid">
    <div class="panel s3"><h2>Ours vs Open-Meteo</h2><div class="big" style=${over.length ? "color:var(--warn)" : "color:var(--ok)"}>${over.length} <small>over the limit</small></div><p class="whytxt">Same run, first 48 h: 0.5 °C air, 0.3 m/s wind.</p></div>
    <div class="panel s3"><h2>Rain map skill · last hour</h2><div class="big">${lastRs && lastRs.sets.weighted ? lastRs.sets.weighted.fss.toFixed(2) : "–"} <small>FSS, weighted</small></div><p class="whytxt">Best now: ${sets[0] ? sets[0][0] + " " + sets[0][1].fss.toFixed(2) : "–"}</p></div>
    <div class="panel s3"><h2>Rain alerts</h2><div class="big">${csi("blend", 60) != null ? csi("blend", 60).toFixed(2) : "–"} <small>CSI at 60 min</small></div><p class="whytxt">Blend method, 7 days.</p></div>
    <div class="panel s3"><h2>Spots on our data</h2><div class="big">${(o.stations || {}).total != null ? "" : ""}${rows.length ? models.length : "–"} <small>models compared</small></div><p class="whytxt">Last compared ${rows.length ? hrs(now - Math.max(...rows.map((r) => r.last || 0))) + " ago" : "–"}.</p></div>
    <div class="panel s8"><h2>Ours vs Open-Meteo, same run · mean difference (bias: ours higher +)</h2><div class="tablewrap"><table>
      <thead><tr><th>Model</th><th class="r">0-2 days</th><th class="r">2-5 days</th><th class="r">5+ days</th><th class="r">Spots</th><th></th></tr></thead>
      <tbody>${models.sort((a, b) => ((cell(b, "0-48") || {}).mae || 0) - ((cell(a, "0-48") || {}).mae || 0)).map((m) => {
        const u = m.endsWith("#temp") ? " °C" : m === "waves" ? " m" : " m/s";
        const show = (c) => c ? html`${c.mae.toFixed(2)}${u} <span class="whytxt">(${c.bias >= 0 ? "+" : ""}${c.bias.toFixed(2)})</span>` : "–";
        const c0 = cell(m, "0-48");
        const bad = c0 && c0.n >= 100 && c0.mae > limit(m);
        return html`<tr><td>${m.replace("#temp", " air").replace(/_/g, " ")}</td><td class="r num" style=${bad ? "color:var(--warn)" : ""}>${show(c0)}</td><td class="r num">${show(cell(m, "48-120"))}</td><td class="r num">${show(cell(m, "120+"))}</td>
          <td class="r num">${c0 ? c0.spots : "–"}</td><td><span class=${"st " + (bad ? "wait" : "ok")}>${bad ? "look" : "fine"}</span></td></tr>`;
      })}</tbody></table></div></div>
    <div class="panel s4"><h2>Rain map vs radar · FSS by hour (24 h)</h2>
      <svg class="chart" viewBox="0 0 ${W} ${H}">
        ${[0, 0.5, 1].map((v) => html`<line x1=${X0} x2=${W - 5} y1=${Y1 - v * (Y1 - Y0)} y2=${Y1 - v * (Y1 - Y0)} stroke="var(--line)"/><text x=${X0 - 5} y=${Y1 - v * (Y1 - Y0) + 4} text-anchor="end">${v}</text>`)}
        ${lines.map(([k, col]) => { const pts = rs.slice(-24).map((r, i, a) => r.sets[k] ? `${X0 + i / Math.max(a.length - 1, 1) * (W - X0 - 5)},${Y1 - r.sets[k].fss * (Y1 - Y0)}` : null).filter(Boolean);
          return pts.length > 1 ? html`<polyline points=${pts.join(" ")} fill="none" stroke=${col} stroke-width="2"/>` : null; })}
      </svg><div class="legend">${lines.map(([k, c]) => html`<span style=${"--c:" + c}>${k}</span>`)}</div></div>
    <p class="note s12" style="margin:0">The rain nowcast's full charts and the blend's weights: <a href="/admin/" style="color:var(--accent)">full admin</a>, Overview.</p>
  </div>`;
}

function Costs({ ad, now }) {

// A POST whose answer is shown as it came (admin answers some refusals with HTTP 200 and {error}, a far move with
// {far:true}): {status, data}.
async function adminPostRaw(path, body) {
  const r = await fetch("/admin/api/" + path, { method: "POST", headers: { "content-type": "application/json", "x-shorewind-admin": "1" }, body: JSON.stringify(body) });
  let data = {};
  try { data = await r.json(); } catch (e) { data = { error: `HTTP ${r.status}` }; }
  return { status: r.status, data };
}

function Saved({ msg }) {
  if (!msg) return null;

}

    <input inputmode="decimal" value=${v[k] ? String(Math.round(v[k] * 1000) / 10) : ""} placeholder="–"
      onChange=${(e) => { const n = parseFloat(String(e.target.value).replace(",", ".")); const next = { ...v }; if (n > 0) next[k] = n / 100; else delete next[k]; onChange(next); }}/></label>`)}</div>`;

async function toJpeg(file) {
  const img = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  for (const q of [0.86, 0.76, 0.66, 0.56]) {
    const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", q));
    if (blob && blob.size < 1550 * 1024) return { blob, w: c.width, h: c.height };
  }
  throw new Error("The photo stays over 1.6 MB");
}

function SpotEdit({ code, onClose, onSaved }) {
  const [s, setS] = useState(null);
  const [err, setErr] = useState("");
  const [msg, setMsg] = useState("");
  const [uploaded, setUploaded] = useState([]);
  const load = async () => { try { setS(await adminGet("spots/info?code=" + encodeURIComponent(code))); } catch (e) { setErr(String(e.message || e)); } };
  useEffect(() => { load(); }, [code]);
  if (err) return html`<div class="panel"><p class="whytxt" style="color:var(--bad)">${err}</p><button class="btn" onClick=${onClose}>Close</button></div>`;
  if (!s) return html`<div class="panel"><p class="empty">Reading the spot…</p></div>`;
  if (s.error) return html`<div class="panel"><p class="whytxt">${s.error}</p><button class="btn" onClick=${onClose}>Close</button></div>`;
  const info = s.info || {};
  const set = (k, v) => setS({ ...s, info: { ...info, [k]: v } });
  const tick = (group, val) => { const now = new Set(info[group] || []); now.has(val) ? now.delete(val) : now.add(val); set(group, [...now]); };
  const photos = info.photos || [];
  const save = async (publish) => {
    setMsg("…");
    const { data } = await adminPostRaw("spots", { action: "info", code, info, publish, kiteable: s.kiteable || "", best: s.best || "", offshore: s.offshore || "", photosLoaded: uploaded });
    setMsg(data.error ? data.error : publish ? "✓ published" : "✓ draft saved");
    if (!data.error) { setUploaded([]); onSaved && onSaved(); }
  };
  const saveWeights = async () => {
    setMsg("…");
    const { data } = await adminPostRaw("spots", { action: "weights", code, weights: s.weights || {}, source: s.weightsSource || "" });
    setMsg(data.error ? data.error : "✓ weights saved");
    if (!data.error) setS({ ...s, weights: data.weights });
  };
  const move = async (far) => {
    const lat = parseFloat(s.newLat ?? s.lat), lon = parseFloat(s.newLon ?? s.lon);
    const { data } = await adminPostRaw("spots", { action: "move", code, lat, lon, far: far === true });
    if (data.far && !far) { setS({ ...s, askFar: data.error }); return; }
    setMsg(data.error ? data.error : `✓ moved ${Math.round(data.distance)} m`);
    if (!data.error) { setS({ ...s, lat, lon, askFar: null }); onSaved && onSaved(); }
  };
  const upload = async (e) => {
    const files = [...e.target.files];
    for (const f of files) {
      try {
        setMsg("resizing " + f.name + "…");
        const { blob, w, h } = await toJpeg(f);
        const r = await fetch("/admin/api/spots/photo?code=" + encodeURIComponent(code), { method: "POST", headers: { "content-type": "image/jpeg", "x-shorewind-admin": "1" }, body: blob });
        const d = await r.json();
        if (!d.ok) throw new Error(d.error || "not stored");
        info.photos = [...(info.photos || []), { url: d.url, w, h }];
        setUploaded((u) => [...u, d.url]);
        setS({ ...s, info: { ...info } });
        setMsg("✓ photo added (save or publish to keep it)");
      } catch (x) { setMsg(String(x.message || x)); }
    }
    e.target.value = "";
  };
  const movePhoto = (i, d) => { const p = [...photos]; const [x] = p.splice(i, 1); p.splice(Math.max(0, Math.min(p.length, i + d)), 0, x); set("photos", p); };
  return html`<div class="panel editor">
    <div class="dhead"><b>${s.name}</b><span class="whytxt">${s.id} · ${s.code}</span>${s.draft ? html`<span class="st wait">draft</span>` : null}${s.published ? html`<span class="st ok">published</span>` : null}
      <span style="margin-left:auto" class="btns"><a class="btn" href=${"/admin/#spots"} title="Rules, map pins and zones are drawn there">Map pins, zones, rules ↗</a><button class="btn" onClick=${onClose}>Close</button></span></div>
    <div class="egrid">
      <div class="egroup"><h3>Wind</h3>
        <label>Kiteable directions<input value=${s.kiteable || ""} placeholder="185-355, 20-60" onInput=${(e) => setS({ ...s, kiteable: e.target.value })}/></label>
        <label>Best<input value=${s.best || ""} placeholder="200-260" onInput=${(e) => setS({ ...s, best: e.target.value })}/></label>
        <label>Offshore (dangerous)<input value=${s.offshore || ""} placeholder="20-110" onInput=${(e) => setS({ ...s, offshore: e.target.value })}/></label>
        <p class="whytxt">Sectors in degrees the wind comes from, "from-to", comma between.</p></div>
      <div class="egroup"><h3>About</h3><textarea rows="6" maxlength="2000" value=${info.about || ""} onInput=${(e) => set("about", e.target.value)}></textarea>
        <label>Crowds<select value=${info.crowds || ""} onChange=${(e) => set("crowds", e.target.value || undefined)}><option value="">–</option><option value="quiet">quiet</option><option value="medium">medium</option><option value="busy">busy</option></select></label>
        <label class="row"><input type="checkbox" checked=${!!info.standing} onChange=${(e) => set("standing", e.target.checked)}/> Standing depth</label>
        ${info.standing ? html`<label>Standing note<input maxlength="80" value=${info.standingNote || ""} onInput=${(e) => set("standingNote", e.target.value)}/></label>` : null}
        <label class="row"><input type="checkbox" checked=${!!info.bigLaunch} onChange=${(e) => set("bigLaunch", e.target.checked || undefined)}/> Big launch area</label>
        <label class="row"><input type="checkbox" checked=${!!info.levelMatters} onChange=${(e) => set("levelMatters", e.target.checked || undefined)}/> Level matters</label>
        <label>Hazard note<input maxlength="500" value=${info.hazardNote || ""} onInput=${(e) => set("hazardNote", e.target.value)}/></label></div>
      <div class="egroup"><h3>Ticks</h3>${Object.entries(INFO_TICKS).map(([g, vals]) => html`<div class="ticks"><span>${g}</span>${vals.map((v) => html`<label class="row"><input type="checkbox" checked=${(info[g] || []).includes(v)} onChange=${() => tick(g, v)}/> ${v}</label>`)}</div>`)}
        <div class="ticks"><span>good months</span>${MONTHS.map((m, i) => html`<label class="row"><input type="checkbox" checked=${(info.goodMonths || []).includes(i + 1)} onChange=${() => { const g = new Set(info.goodMonths || []); g.has(i + 1) ? g.delete(i + 1) : g.add(i + 1); set("goodMonths", [...g].sort((a, b) => a - b)); }}/> ${m}</label>`)}</div>
        <p class="whytxt">Kept as they are: ${(info.rules || []).length} rules, ${(info.pins || []).length} map pins, ${(info.zones || []).length} zones${info.months ? ", the months' wind" : ""}.</p></div>
      <div class="egroup wide"><h3>Photos · the first is the cover</h3><div class="photos">${photos.map((p, i) => html`<div class="ph">
          <img src=${p.url} alt="" loading="lazy"/>
          <input placeholder="credit" maxlength="60" value=${p.credit || ""} onInput=${(e) => { const q = [...photos]; q[i] = { ...p, credit: e.target.value }; set("photos", q); }}/>
          <div class="btns"><button class="btn" onClick=${() => movePhoto(i, -1)} disabled=${i === 0}>←</button><button class="btn" onClick=${() => movePhoto(i, 1)} disabled=${i === photos.length - 1}>→</button>
            <button class="btn danger" onClick=${() => set("photos", photos.filter((_, j) => j !== i))}>Remove</button></div></div>`)}
        <label class="ph add">+ Add photos<input type="file" accept="image/*" multiple onChange=${upload} style="display:none"/></label></div></div>
      <div class="egroup wide"><h3>Weights · in %, only the ratios count</h3><${WeightsGrid} value=${s.weights} onChange=${(w) => setS({ ...s, weights: w })} />
        <label>Where these weights come from<input maxlength="80" value=${s.weightsSource || ""} onInput=${(e) => setS({ ...s, weightsSource: e.target.value })}/></label>
        <div class="btns" style="margin-top:8px"><button class="btn primary" onClick=${saveWeights}>Save weights</button></div></div>
      <div class="egroup"><h3>Position</h3>
        <label>Latitude<input value=${s.newLat ?? s.lat} onInput=${(e) => setS({ ...s, newLat: e.target.value })}/></label>
        <label>Longitude<input value=${s.newLon ?? s.lon} onInput=${(e) => setS({ ...s, newLon: e.target.value })}/></label>
        <div class="btns"><button class="btn" onClick=${() => move(false)}>Move</button></div>
        ${s.askFar ? html`<div class="confirm">${s.askFar}. <button class="btn danger" onClick=${() => move(true)}>Move it that far</button></div>` : null}</div>
    </div>
    <div class="btns ebar"><button class="btn" onClick=${() => save(false)}>Save draft</button>
      <${ActButton} label="Publish to the app" ask="Publish to every rider? Click again" primary=${true} run=${async () => { await save(true); return { ok: true }; }} />
      <${Saved} msg=${msg} /></div>
  </div>`;
}

  };
  return html`<div class="panel s12"><h2>Find and add a station</h2><div class="form four">
      <label>Source<select value=${q.source} onChange=${(e) => setQ({ ...q, source: e.target.value })}>${Object.entries(kinds).map(([k, v]) => html`<option value=${k}>${v.name}</option>`)}</select></label>
      <label>Latitude<input value=${q.lat} onInput=${(e) => setQ({ ...q, lat: e.target.value })} placeholder="36.01"/></label>
      <label>Longitude<input value=${q.lon} onInput=${(e) => setQ({ ...q, lon: e.target.value })} placeholder="-5.60"/></label>
      <label>Within km<input value=${q.km} onInput=${(e) => setQ({ ...q, km: e.target.value })}/></label></div>
    <div class="btns" style="margin-top:8px;align-items:center"><button class="btn primary" onClick=${find} disabled=${!q.lat || !q.lon}>Find stations</button>
      <label class="row"><input type="checkbox" checked=${show} onChange=${(e) => setShow(e.target.checked)}/> show on the map when added</label><${Saved} msg=${msg} /></div>
    ${found ? html`<div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>Station</th><th class="r">Distance</th><th class="r">Wind</th><th class="r">Reading</th><th></th></tr></thead><tbody>
      ${(found.found || []).map((x) => html`<tr><td>${x.name}<div class="whytxt">${x.code}</div></td><td class="r num">${x.km.toFixed(1)} km</td><td class="r num">${x.wind != null ? x.wind + " m/s" : "–"}</td>
        <td class="r num">${x.time ? hrs(Date.now() / 1000 - x.time) + " ago" : "–"}</td>
        <td class="r">${x.added ? html`<span class="st ok">added</span>` : html`<button class="btn" onClick=${() => add(x)}>Add</button>`}</td></tr>`)}</tbody></table>
      <p class="whytxt">${found.listed} stations listed for this source, list updated ${found.updated ? hrs(Date.now() / 1000 - found.updated) + " ago" : "–"}.</p></div>` : null}
  </div>`;
}

function StationRow({ x, refresh, now }) {
  const [open, setOpen] = useState(false);
  const [f, setF] = useState({ name: x.name, note: x.note || "", windguru: x.windguru || "", twinKm: x.twinKm ?? "", lat: x.lat, lon: x.lon });
  const [msg, setMsg] = useState("");
  const [far, setFar] = useState(null);
  const save = async (confirmFar) => {
    const body = { action: "edit", id: x.id, name: f.name, note: f.note, windguru: f.windguru === "" ? null : f.windguru, twinKm: f.twinKm === "" ? undefined : Number(f.twinKm) };
    if (String(f.lat) !== String(x.lat) || String(f.lon) !== String(x.lon)) { body.lat = Number(f.lat); body.lon = Number(f.lon); if (confirmFar) body.far = true; }
    const { status, data } = await adminPostRaw("stations", body);
    if (status === 409 && data.far) { setFar(data.error); return; }
    setMsg(data.error ? data.error : "✓ saved"); setFar(null);
    if (!data.error) refresh();
  };
  const toggle = async () => { const { data } = await adminPostRaw("stations", { action: x.hidden ? "show" : "hide", id: x.id }); setMsg(data.error ? data.error : "✓"); refresh(); };
  return html`<tr><td>${x.name}${x.hidden ? html` <span class="st unknown">hidden</span>` : null}<div class="whytxt">${x.id}</div></td><td class="whytxt">${x.source}</td>
    <td class="r num" style=${x.time && now - x.time > 1200 ? "color:var(--warn)" : ""}>${x.time ? hrs(now - x.time) + " ago" : "–"}</td>
    <td class="r num">${x.wind != null ? x.wind + (x.gust != null ? "/" + x.gust : "") + " m/s" : "–"}</td>
    <td class="r"><span class="btns"><button class="btn" onClick=${() => setOpen(!open)}>${open ? "Close" : "Edit"}</button><button class="btn" onClick=${toggle}>${x.hidden ? "Show" : "Hide"}</button></span></td></tr>
    ${open ? html`<tr><td colspan="5"><div class="form four">
      <label>Name<input value=${f.name} onInput=${(e) => setF({ ...f, name: e.target.value })}/></label>
      <label>Note<input maxlength="300" value=${f.note} onInput=${(e) => setF({ ...f, note: e.target.value })}/></label>
      <label>Windguru station id (internal)<input value=${f.windguru} onInput=${(e) => setF({ ...f, windguru: e.target.value })}/></label>
      <label>Twin km (0-10)<input value=${f.twinKm} onInput=${(e) => setF({ ...f, twinKm: e.target.value })}/></label>
      <label>Latitude<input value=${f.lat} onInput=${(e) => setF({ ...f, lat: e.target.value })}/></label>
      <label>Longitude<input value=${f.lon} onInput=${(e) => setF({ ...f, lon: e.target.value })}/></label></div>
      <div class="btns" style="margin-top:8px;align-items:center"><button class="btn primary" onClick=${() => save(false)}>Save</button><${Saved} msg=${msg} />
        ${far ? html`<span class="confirm">${far} <button class="btn danger" onClick=${() => save(true)}>Move it that far</button></span>` : null}</div></td></tr>` : null}`;
}

function StationsEditor({ st, refresh, now }) {
  if (!st) return null;
  return html`<div class="grid" style="margin-top:16px"><${StationAdd} st=${st} refresh=${refresh} />
    <div class="panel s12"><h2>Edit stations · ${(st.stations || []).length}</h2><div class="tablewrap"><table><thead><tr><th>Station</th><th>Source</th><th class="r">Last reading</th><th class="r">Wind</th><th></th></tr></thead><tbody>
      ${(st.stations || []).slice().sort((a, b) => a.name.localeCompare(b.name)).map((x) => html`<${StationRow} key=${x.id} x=${x} refresh=${refresh} now=${now} />`)}</tbody></table></div></div></div>`;
}

const APP_TABS = [["overview", "Overview"], ["spots", "Spots"], ["points", "Weight points"], ["roles", "Riders & roles"], ["features", "Features"]];
function AppSection(props) {
  const [tab, setTab] = useState("overview");
  return html`<div class="subtabs">${APP_TABS.map(([k, label]) => html`<button class=${"chip" + (tab === k ? " on" : "")} onClick=${() => setTab(k)}>${label}</button>`)}</div>
    ${tab === "overview" ? html`<${AppRiders} ...${props} />` : tab === "spots" ? html`<${SpotsEditor} spots=${props.spots} refresh=${props.reloadSpots} />`
      : tab === "points" ? html`<${WeightPoints} spots=${props.spots} refresh=${props.reloadSpots} />`
      : tab === "roles" ? html`<${RolesEditor} roles=${props.roles} refresh=${props.reloadRoles} now=${props.now} />`
      : html`<${FeaturesEditor} roles=${props.roles} refresh=${props.reloadRoles} />`}`;
}

function App() {
  const [f, setF] = useState(null);
  const [s, setS] = useState(null);
  const [fr, setFr] = useState(null);
  const [cap, setCap] = useState(null);
  const [ad, setAd] = useState(null);
  const [maps, setMaps] = useState(null);
  const [spots, setSpots] = useState(null);
  const [roles, setRoles] = useState(null);
  const [builds, setBuilds] = useState(null);
  const [st, setSt] = useState(null);
  const pick = () => { const h = location.hash.slice(1); return SECTIONS.some(([k]) => k === h) ? h : "pipeline"; };
  const [sec, setSec] = useState(pick());
  const [zone, setZoneState] = useState(ZONE);
  const [, tick] = useState(0);
  const setZone = (z) => { ZONE = z; try { localStorage.setItem("ops-zone", z); } catch (e) {} setZoneState(z); };
  const load = async (list) => { for (const [k, fn] of list) { try { fn(await adminGet(k)); } catch (e) {} } };
  const refresh = () => load([["spots", setSpots]]);
  const reloadRoles = () => load([["roles", setRoles]]);
  const reloadStations = () => load([["stations", setSt]]);
  useEffect(() => {
    let last = Date.now();
    const es = new EventSource("/api/stream");
    es.addEventListener("fast", (e) => { last = Date.now(); setF(JSON.parse(e.data)); });
    es.addEventListener("slow", (e) => setS(JSON.parse(e.data)));
    es.addEventListener("fresh", (e) => setFr(JSON.parse(e.data)));
    es.addEventListener("capacity", (e) => setCap(JSON.parse(e.data)));
    es.addEventListener("admin", (e) => setAd(JSON.parse(e.data)));
    const onHash = () => setSec(pick());
    addEventListener("hashchange", onHash);
    // Admin's own data: the maps' history every 10 minutes (it reads ~3,000 rows), the rest every 5.
    load([["maps", setMaps], ["spots", setSpots], ["roles", setRoles], ["builds", setBuilds], ["stations", setSt]]);
    const slowAdmin = setInterval(() => load([["maps", setMaps]]), 600000);
    const midAdmin = setInterval(() => load([["spots", setSpots], ["builds", setBuilds], ["stations", setSt], ["roles", setRoles]]), 300000);
    // Without the stream (a proxy holding it back), ask every 3 seconds instead.
    const poll = setInterval(async () => {
      if (Date.now() - last < 8000) return;
      try {
        setF(await (await fetch("/api/fast")).json());
        if (Date.now() % 30000 < 3000) {
          setS(await (await fetch("/api/slow")).json());
          setFr(await (await fetch("/api/fresh")).json());
          setCap(await (await fetch("/api/capacity")).json());
          setAd(await (await fetch("/api/admin")).json());
        }
      } catch (err) {}
    }, 3000);
    const clockTimer = setInterval(() => tick((n) => n + 1), 1000);
    return () => { es.close(); clearInterval(poll); clearInterval(clockTimer); clearInterval(slowAdmin); clearInterval(midAdmin); removeEventListener("hashchange", onHash); };
  }, []);
  const now = Date.now() / 1000;
  if (!f) return html`<main class="wrap"><p class="empty">Connecting to the Tower…</p></main>`;
  return html`<${TopBar} f=${f} fr=${fr} ad=${ad} spots=${spots} zone=${zone} setZone=${setZone} sec=${sec} />
    <main class="wrap">
      ${sec === "pipeline" ? html`<${Pipeline} maps=${maps} fr=${fr} f=${f} now=${now} s=${s} cap=${cap} />`
        : sec === "machine" ? html`<${NowTab} f=${f} s=${s} now=${now} /><div style="margin-top:16px"><${Capacity} cap=${cap} now=${now} /></div>`
        : sec === "quality" ? html`<${Quality} ad=${ad} now=${now} />`
        : sec === "app" ? html`<${AppSection} ad=${ad} spots=${spots} roles=${roles} builds=${builds} refresh=${refresh} reloadSpots=${refresh} reloadRoles=${reloadRoles} now=${now} />`
        : sec === "stations" ? html`<${StationsSec} ad=${ad} st=${st} now=${now} /><${StationsEditor} st=${st} refresh=${reloadStations} now=${now} />`
        : html`<${Costs} ad=${ad} now=${now} />`}
    <div class="foot"><span>Live every 2 seconds; admin's data every 5-10 minutes.</span><span>Changes go through admin's own routes and ask once more.</span><a href="/admin/" style="color:var(--accent)">Full admin</a></div></main>`;
}

render(html`<${App} />`, document.getElementById("app"));
</script>
</body></html>
